apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def keyProperties = new Properties()
def keyFile = rootProject.file("keystore.properties")
if (keyFile.exists()) {
    keyFile.withInputStream { keyProperties.load(it) }
}

def envStoreFile = System.getenv("TD_KEYSTORE_PATH")
def envStorePassword = System.getenv("KEYSTORE_PASSWORD")
def envKeyAlias = System.getenv("KEY_ALIAS")
def envKeyPassword = System.getenv("KEY_PASSWORD")

android {
    namespace 'com.musicflow.play'
    compileSdk 36

    signingConfigs {
        release {
            if (keyFile.exists()) {
                storeFile file(keyProperties["storeFile"])
                storePassword keyProperties["storePassword"]
                keyAlias keyProperties["keyAlias"]
                keyPassword keyProperties["keyPassword"]
            } else if (envStoreFile && envStorePassword && envKeyAlias && envKeyPassword) {
                storeFile file(envStoreFile)
                storePassword envStorePassword
                keyAlias envKeyAlias
                keyPassword envKeyPassword
            }
        }
    }

    flavorDimensions "distribution"
    productFlavors {
        github {
            dimension "distribution"
            buildConfigField "String", "DISTRIBUTION", "\"github\""
            buildConfigField "boolean", "HAS_DOWNLOADER", "true"
            buildConfigField "boolean", "HAS_SELF_UPDATE", "true"
        }
        play {
            dimension "distribution"
            buildConfigField "String", "DISTRIBUTION", "\"play\""
            buildConfigField "boolean", "HAS_DOWNLOADER", "false"
            buildConfigField "boolean", "HAS_SELF_UPDATE", "false"
        }
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    defaultConfig {
        applicationId "com.musicflow.play"
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt((project.findProperty('ciVersionCode') ?: '20000').toString())
        versionName((project.findProperty('ciVersionName') ?: '2.0.0.0').toString())

        ndk {
            abiFilters "arm64-v8a"
        }

        buildConfigField "boolean", "WEB_DEBUG", (project.findProperty('ciWebDebug') ?: 'false').toString()
        manifestPlaceholders = [
            netConfig: (project.findProperty('ciWebDebug') ?: 'false').toString() == 'true'
                ? '@xml/network_security_config_test' : '@xml/network_security_config'
        ]
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlin_version}"
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.documentfile:documentfile:1.0.1'

    def composeBom = platform("androidx.compose:compose-bom:${rootProject.ext.compose_bom_version}")
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation "androidx.media3:media3-exoplayer:${rootProject.ext.media3_version}"
    implementation "androidx.media3:media3-session:${rootProject.ext.media3_version}"
    implementation "androidx.media3:media3-ui:${rootProject.ext.media3_version}"
    implementation "androidx.media3:media3-datasource:${rootProject.ext.media3_version}"
    implementation "androidx.media3:media3-extractor:${rootProject.ext.media3_version}"

    implementation "androidx.room:room-runtime:${rootProject.ext.room_version}"
    implementation "androidx.room:room-ktx:${rootProject.ext.room_version}"
}
