apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.chaquo.python'

def keyProperties = new Properties()
def keyFile = rootProject.file("keystore.properties")
if (keyFile.exists()) { keyFile.withInputStream { keyProperties.load(it) } }

// MusicFlow (search and download) comes from the musicflow submodule, as it is: its Android server code (Python),
// used inside the player's own server, and the Kotlin helper its online search uses. Its page is not used.
def mfDir = file('../../musicflow')
def mfGenerated = file("$buildDir/generated/musicflow")
def mfVersion = '0'
try { mfVersion = (file("$mfDir/android/app/build.gradle").text =~ /ciVersionName'\) \?: '([^']+)'/)[0][1] } catch (ignored) { }

tasks.register('copyMusicFlowCode') {
    inputs.dir("$mfDir/android/app/src/main/java")
    inputs.dir('../../web')
    inputs.file('../../CHANGELOG.md')
    outputs.dir(mfGenerated)
    doLast {
        def javaOut = file("$mfGenerated/java/com/musicflow/app")
        javaOut.mkdirs()
        def src = file("$mfDir/android/app/src/main/java/com/musicflow/app")
        file("$javaOut/SpotifySearch.kt").text = file("$src/SpotifySearch.kt").text
        // The player's page goes in web/.
        copy { from '../../web'; into "$mfGenerated/python/web" }
        // The changelog, for "What's new" after an update.
        copy { from '../../CHANGELOG.md'; into "$mfGenerated/python/web" }
    }
}
preBuild.dependsOn 'copyMusicFlowCode'
tasks.configureEach { t ->
    if (t.name != 'copyMusicFlowCode' && (t.name.contains('Python') || t.name.contains('Kotlin') || t.name.contains('Java'))) {
        t.dependsOn 'copyMusicFlowCode'
    }
}

android {
    signingConfigs {
        // CI test key: one fixed keystore (kept in the CI cache), so each build installs over the previous one.
        ciTest {
            if (project.hasProperty('ciKeystore')) {
                storeFile file(project.property('ciKeystore').toString())
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        release {
            if (keyFile.exists()) {
                storeFile file(keyProperties["storeFile"])
                storePassword keyProperties["storePassword"]
                keyAlias keyProperties["keyAlias"]
                keyPassword keyProperties["keyPassword"]
            }
        }
    }
    namespace 'com.musicflow.play'

    sourceSets {
        main {
            // MusicFlow's code is part of the app (nothing to install): its Android server module (mobile_app.py,
            // secrets_store.py) and core/ run inside the player's server.
            python.srcDirs = ['src/main/python', '../../server', '../../musicflow/core',
                              '../../musicflow/android/app/src/main/python', "$buildDir/generated/musicflow/python"]
            java.srcDirs += ["$buildDir/generated/musicflow/java"]
        }
    }
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.musicflow.play"
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt((project.findProperty('ciVersionCode') ?: '2').toString())
        versionName((project.findProperty('ciVersionName') ?: '1.2.4.0').toString())

        ndk {
            abiFilters "arm64-v8a"
        }

        // Only the emulator test build turns this on (-PciWebDebug=true), so the test can drive the page.
        buildConfigField "String", "MF_VERSION", "\"${mfVersion}\""
        buildConfigField "boolean", "WEB_DEBUG", (project.findProperty('ciWebDebug') ?: 'false').toString()
        // Emulator test build only: also reaches the test computer (10.0.2.2) over http, for its fake Spotify.
        manifestPlaceholders = [netConfig: (project.findProperty('ciWebDebug') ?: 'false').toString() == 'true'
            ? '@xml/network_security_config_test' : '@xml/network_security_config']

        python {
            version "3.13"
            if (project.hasProperty('buildPython')) {
                buildPython project.property('buildPython').toString()
            }
            pip {
                install "yt-dlp"
                install "flask"
                install "mutagen"
                install "certifi"
                install "Pillow"
            }
        }
    }

    buildTypes {
        release {
            signingConfig keyFile.exists() ? signingConfigs.release : (project.hasProperty('ciKeystore') ? signingConfigs.ciTest : signingConfigs.debug)
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-audio:8.1.9'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'
}
