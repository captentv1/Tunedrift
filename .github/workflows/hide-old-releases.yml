# Keeps only the latest release public. Every older release is turned into a draft: drafts are
# visible only to the repository owner and collaborators, so nobody else can download old versions.
# Runs after each build on main, and can be started by hand (Actions › Hide old releases › Run workflow).
name: Hide old releases

on:
  workflow_run:
    workflows: [Build APK]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hide:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Turn every release except the latest into a draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          latest=$(gh api "repos/$REPO/releases/latest" --jq .id)
          echo "Latest release kept public: $(gh api "repos/$REPO/releases/latest" --jq .tag_name)"
          gh api "repos/$REPO/releases" --paginate --jq '.[] | select(.draft == false) | "\(.id) \(.tag_name)"' |
          while read -r id tag; do
            [ "$id" = "$latest" ] && continue
            echo "Hiding $tag"
            gh api -X PATCH "repos/$REPO/releases/$id" -F draft=true --silent
          done
