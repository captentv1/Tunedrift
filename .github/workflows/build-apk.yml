name: Build APK & AAB

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.github/workflows/hide-old-releases.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-tunedrift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Python server tests
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m pip install -q -r requirements.txt pytest yt-dlp certifi Pillow
          python -m pytest -q tests

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - id: version
        run: echo "version=2.0.0.0" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/.android/release-key.jks"
            echo "TD_KEYSTORE_PATH=$HOME/.android/release-key.jks" >> "$GITHUB_ENV"
            echo "HAS_RELEASE_KEY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set; falling back to temporary CI keystore."
            keytool -genkeypair -keystore "$HOME/.android/ci-fallback.jks" \
              -storepass android -keypass android \
              -alias tunedrift -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Tunedrift,O=Tunedrift,C=TN"
            echo "TD_KEYSTORE_PATH=$HOME/.android/ci-fallback.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=tunedrift" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
            echo "HAS_RELEASE_KEY=false" >> "$GITHUB_ENV"
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Build native Android (github release APK + play release AAB)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          ./gradlew assembleGithubRelease bundlePlayRelease --no-daemon --stacktrace \
            -PciVersionCode="$((GITHUB_RUN_NUMBER + 20000))" \
            -PciVersionName="${{ steps.version.outputs.version }}"

          cp app/build/outputs/apk/github/release/app-github-release.apk "$GITHUB_WORKSPACE/Tunedrift.apk"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "$GITHUB_WORKSPACE/Tunedrift-play.aab"

          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$GITHUB_WORKSPACE/Tunedrift.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Tunedrift-github-apk
          path: Tunedrift.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tunedrift-play-aab
          path: Tunedrift-play.aab

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build MusicFlowPlay.exe (MusicFlow's search and download inside)
        run: |
          python -m pip install -q -r requirements.txt -r musicflow/desktop/requirements.txt truststore certifi pyinstaller
          # MusicFlow's code (desktop/app.py, core/, yt-dlp, ffmpeg) is in the exe: nothing to install, no second page.
          $std = python ci/stdlib_args.py
          python -m PyInstaller --noconfirm --onefile --name MusicFlowPlay --icon NONE --distpath dist --workpath build --specpath build `
            --paths server --paths musicflow/core --paths musicflow/desktop --add-data "$PWD\web\*;web" --add-data "$PWD\CHANGELOG.md;web" `
            --collect-submodules mutagen --collect-submodules flask --collect-submodules werkzeug --collect-submodules certifi `
            --collect-all yt_dlp --collect-all yt_dlp_ejs --collect-all imageio_ffmpeg --collect-submodules selenium `
            --hidden-import truststore --hidden-import library --hidden-import app --hidden-import spotify_scan `
            --hidden-import downloads --hidden-import importer --hidden-import mf_bridge @std server/mfp_server.py

      - name: Start the exe and load the page
        shell: pwsh
        run: |
          $env:MFP_DATA_DIR = "$PWD\exe-data"
          $p = Start-Process dist\MusicFlowPlay.exe -ArgumentList "--no-browser" -PassThru
          $ok = $false; $tok = ""
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep 2
            try { $r = Invoke-WebRequest http://127.0.0.1:5091/ -UseBasicParsing -TimeoutSec 5; $ok = $r.Content -match "Tunedrift"
                  if ($r.Content -match "MFP_TOKEN='([^']+)'") { $tok = $Matches[1] } } catch {}
          }
          $mf = ""
          for ($i = 0; $i -lt 60 -and $ok -and $mf -ne "ready" -and $mf -ne "error"; $i++) {
            Start-Sleep 2
            try { $s = Invoke-RestMethod http://127.0.0.1:5091/api/state -Headers @{"X-MFP-Token" = $tok} -TimeoutSec 5; $mf = $s.musicflow.state
                  if ($mf -eq "error") { Write-Host $s.musicflow.error } } catch {}
          }
          Stop-Process $p -Force
          if (-not $ok) { throw "the exe did not serve the player page" }
          if ($mf -ne "ready") { throw "MusicFlow's search and download did not load in the exe ($mf)" }

      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlowPlay-exe
          path: dist/MusicFlowPlay.exe

  # 2.0.0.0 is still in progress: published as a pre-release, so the installed 1.x apps do not update to it yet.
  release:
    needs: [server-tests, android, windows]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Tunedrift-github-apk

      - uses: actions/download-artifact@v4
        with:
          name: Tunedrift-play-aab

      - uses: actions/download-artifact@v4
        with:
          name: MusicFlowPlay-exe

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.android.outputs.version }}
        run: |
          cp MusicFlowPlay.exe Tunedrift.exe
          FILES="Tunedrift.apk Tunedrift-play.aab Tunedrift.exe"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" $FILES --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Tunedrift ${TAG#v} (en cours)" \
              --notes "Android natif (Kotlin + Jetpack Compose + Media3), en cours : Tunedrift.apk (variante GitHub) et Tunedrift-play.aab (variante Play). Windows : Tunedrift.exe. Voir CHANGELOG.md."
          fi
