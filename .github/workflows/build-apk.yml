# Builds the Android app. On main, the APK is also published as a GitHub release
# (tag = VERSION in server/app.py), so the latest one is always at
# https://github.com/<owner>/<repo>/releases/latest/download/MusicFlowPlay.apk
name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Server tests
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m pip install -q -r requirements.txt pytest
          python -m pytest -q tests

      - name: Read the version
        id: version
        run: echo "version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' server/app.py)" >> "$GITHUB_OUTPUT"

      # Without a release keystore the APK is signed with a test key. Keeping that key in the cache lets a
      # new build install over the previous one instead of asking to uninstall first.
      - name: Restore the test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: test-signing-key-v1

      - name: Create the test signing key
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PbuildPython="$(which python3.13 || which python)" \
            -PciVersionCode="$((GITHUB_RUN_NUMBER + 1))" \
            -PciVersionName="${{ steps.version.outputs.version }}"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/MusicFlowPlay.apk"
          ls -la "$GITHUB_WORKSPACE/MusicFlowPlay.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlowPlay-apk
          path: MusicFlowPlay.apk

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MusicFlowPlay-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install ffmpeg (makes the test songs)
        run: sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Start the app on an emulator and play a song in every format
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Android 14 x86_64 image: it runs ARM64-only apps through its built-in translation.
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 ci/smoke_test.py MusicFlowPlay.apk out

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-results
          path: out/

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MusicFlowPlay-apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" MusicFlowPlay.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" MusicFlowPlay.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "MusicFlow Play ${TAG#v}" \
              --notes "Android: download MusicFlowPlay.apk below, open it and allow installing from this source. Changes: see CHANGELOG.md."
          fi
