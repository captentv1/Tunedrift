# Builds the Android app (APK) and the Windows app (exe). On main, both are published as a GitHub release
# (tag = VERSION in server/mfp_server.py), so the latest ones are always at
# https://github.com/<owner>/<repo>/releases/latest/download/MusicFlowPlay.apk (and MusicFlowPlay.exe)
name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Server tests
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m pip install -q -r requirements.txt pytest
          python -m pytest -q tests

      - name: Read the version
        id: version
        run: echo "version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' server/mfp_server.py)" >> "$GITHUB_OUTPUT"

      # The Download tab is a module the app downloads from the release when the person installs it.
      - name: Make the Download tab's module (Android)
        run: python ci/make_module.py android "${{ steps.version.outputs.version }}" MusicFlowModule-android.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlowModule-android
          path: MusicFlowModule-android.zip

      # Without a release keystore the APK is signed with a test key. Keeping that key in the cache lets a
      # new build install over the previous one instead of asking to uninstall first.
      - name: Restore the test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: test-signing-key-v1

      - name: Create the test signing key
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PbuildPython="$(which python3.13 || which python)" \
            -PciVersionCode="$((GITHUB_RUN_NUMBER + 1))" \
            -PciVersionName="${{ steps.version.outputs.version }}"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/MusicFlowPlay.apk"
          ls -la "$GITHUB_WORKSPACE/MusicFlowPlay.apk"

      # Same app with WebView debugging on, only for the emulator test (never published).
      - name: Build the test APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PbuildPython="$(which python3.13 || which python)" \
            -PciVersionCode="$((GITHUB_RUN_NUMBER + 1))" \
            -PciVersionName="${{ steps.version.outputs.version }}" -PciWebDebug=true
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/MusicFlowPlay-test.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlowPlay-apk
          path: MusicFlowPlay.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlowPlay-test-apk
          path: MusicFlowPlay-test.apk
          retention-days: 3

      - name: Make one test song per format for the emulator
        run: |
          mkdir songs
          make() { ffmpeg -y -loglevel error -f lavfi -i "anoisesrc=d=90:c=pink:a=0.3" -ac 2 "${@:2}" "songs/Fmt $1 - Tester.$1"; }
          make mp3 -c:a libmp3lame -b:a 320k
          make m4a -c:a aac -b:a 256k
          make flac -c:a flac
          make opus -c:a libopus
          make ogg -c:a libvorbis
          make wav -c:a pcm_s16le

      - uses: actions/upload-artifact@v4
        with:
          name: test-songs
          path: songs/
          retention-days: 1

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MusicFlowPlay-test-apk

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: python -m pip install -q websocket-client

      - uses: actions/download-artifact@v4
        with:
          name: test-songs
          path: songs

      - uses: actions/download-artifact@v4
        with:
          name: MusicFlowModule-android
          path: module

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the app on an emulator and play a song in every format
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Android 14 x86_64 image: it runs ARM64-only apps through its built-in translation.
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: MODULE_DIR=module python3 ci/smoke_test.py MusicFlowPlay-test.apk out songs

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-results
          path: out/

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build MusicFlowPlay.exe and the Download tab's module
        run: |
          python -m pip install -q -r requirements.txt truststore pyinstaller
          $version = (Select-String -Path server/mfp_server.py -Pattern '^VERSION = "(.*)"').Matches[0].Groups[1].Value
          python ci/make_module.py windows $version MusicFlowModule-windows.zip
          # MusicFlow (the Download tab) is not in the exe: it is the module above, installed from the Download tab.
          # The exe has Python's whole standard library, so the module can use any part of it.
          $std = python ci/stdlib_args.py
          python -m PyInstaller --noconfirm --onefile --name MusicFlowPlay --icon NONE --distpath dist --workpath build --specpath build `
            --paths server --paths musicflow/core --add-data "$PWD\web\*;web" `
            --exclude-module app --exclude-module yt_dlp --exclude-module imageio_ffmpeg --exclude-module selenium `
            --collect-submodules mutagen --collect-submodules flask --collect-submodules werkzeug --collect-submodules certifi `
            --hidden-import truststore --hidden-import library @std server/mfp_server.py

      - name: Start the exe and load the page
        shell: pwsh
        run: |
          $env:MFP_DATA_DIR = "$PWD\exe-data"
          $env:MFP_MODULE_URL = ([System.Uri]"$PWD\MusicFlowModule-windows.zip").AbsoluteUri
          $p = Start-Process dist\MusicFlowPlay.exe -ArgumentList "--no-browser" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep 2
            try { $r = Invoke-WebRequest http://127.0.0.1:5091/ -UseBasicParsing -TimeoutSec 5; $ok = $r.Content -match "MusicFlow Play" } catch {}
          }
          $mf = $false
          for ($i = 0; $i -lt 90 -and $ok -and -not $mf; $i++) {
            try { $r = Invoke-WebRequest "http://127.0.0.1:5090/?embed=1" -UseBasicParsing -TimeoutSec 5; $mf = $r.Content -match "mfp-embed" } catch { Start-Sleep 2 }
          }
          Stop-Process $p -Force
          if (-not $ok) { throw "the exe did not serve the player page" }
          if (-not $mf) { throw "the exe did not start MusicFlow (search and download)" }

      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlowPlay-exe
          path: dist/MusicFlowPlay.exe

      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlowModule-windows
          path: MusicFlowModule-windows.zip

  release:
    needs: [build, windows]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MusicFlowPlay-apk

      - uses: actions/download-artifact@v4
        with:
          name: MusicFlowPlay-exe

      - uses: actions/download-artifact@v4
        with:
          name: MusicFlowModule-android

      - uses: actions/download-artifact@v4
        with:
          name: MusicFlowModule-windows

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          # A test build (four-part version, e.g. 0.7.2.1) is published for Android only.
          FILES="MusicFlowPlay.apk MusicFlowModule-android.zip"
          if [ "$(echo "${TAG#v}" | tr -cd . | wc -c)" -lt 3 ]; then FILES="$FILES MusicFlowPlay.exe MusicFlowModule-windows.zip"; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" $FILES --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "MusicFlow Play ${TAG#v}" \
              --notes "Android: download MusicFlowPlay.apk below, open it and allow installing from this source. Windows: download MusicFlowPlay.exe and double-click it (if Windows warns: More info, Run anyway). Changes: see CHANGELOG.md."
          fi
