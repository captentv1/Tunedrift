# Builds the Android app (APK) and the Windows app (exe). On main, both are published as a GitHub release
# (tag = VERSION in server/mfp_server.py), so the latest ones are always at
# https://github.com/<owner>/<repo>/releases/latest/download/Tunedrift.apk (and Tunedrift.exe)
name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.github/workflows/hide-old-releases.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Server tests
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m pip install -q -r requirements.txt pytest yt-dlp certifi Pillow
          python -m pytest -q tests

      - name: Read the version
        id: version
        run: echo "version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' server/mfp_server.py)" >> "$GITHUB_OUTPUT"

      # Without a release keystore the APK is signed with a test key. Keeping that key in the cache lets a
      # new build install over the previous one instead of asking to uninstall first.
      - name: Restore the test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: test-signing-key-v1

      - name: Create the test signing key
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PbuildPython="$(which python3.13 || which python)" \
            -PciVersionCode="$((GITHUB_RUN_NUMBER + 1))" \
            -PciVersionName="${{ steps.version.outputs.version }}" -PciKeystore="$HOME/.android/debug.keystore"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/MusicFlowPlay.apk"
          # The APK must be signed with the cached key, or it will not install over the previous version.
          want=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | tr -d ': ' | tr A-F a-f)
          got=$("$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "$GITHUB_WORKSPACE/MusicFlowPlay.apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "key $want, APK $got"; [ -n "$want" ] && [ "$want" = "$got" ]
          ls -la "$GITHUB_WORKSPACE/MusicFlowPlay.apk"

      # Same app with WebView debugging on, only for the emulator test (never published).
      - name: Build the test APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PbuildPython="$(which python3.13 || which python)" \
            -PciVersionCode="$((GITHUB_RUN_NUMBER + 1))" \
            -PciVersionName="${{ steps.version.outputs.version }}" -PciKeystore="$HOME/.android/debug.keystore" -PciWebDebug=true
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/MusicFlowPlay-test.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlowPlay-apk
          path: MusicFlowPlay.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlowPlay-test-apk
          path: MusicFlowPlay-test.apk
          retention-days: 3

      - name: Make one test song per format for the emulator
        run: |
          mkdir songs
          make() { ffmpeg -y -loglevel error -f lavfi -i "anoisesrc=d=90:c=pink:a=0.3" -ac 2 "${@:2}" "songs/Fmt $1 - Tester.$1"; }
          make mp3 -c:a libmp3lame -b:a 320k
          make m4a -c:a aac -b:a 256k
          make flac -c:a flac
          make opus -c:a libopus
          make ogg -c:a libvorbis
          make wav -c:a pcm_s16le

      - uses: actions/upload-artifact@v4
        with:
          name: test-songs
          path: songs/
          retention-days: 1

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MusicFlowPlay-test-apk

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: python -m pip install -q websocket-client

      - uses: actions/download-artifact@v4
        with:
          name: test-songs
          path: songs

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A computer's Tunedrift on the same network (the emulator reaches it at 10.0.2.2): the phone imports one
      # of its playlists while a song plays (the "it crashes when I download and play" case).
      - name: Start a Tunedrift "computer" with a playlist
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m pip install -q flask mutagen
          git submodule update --init musicflow
          mkdir -p pc/Music
          for n in 1 2 3 4; do ffmpeg -y -loglevel error -f lavfi -i "sine=frequency=$((300 + n * 60)):duration=120" -c:a libmp3lame -b:a 192k "pc/Music/PC Song $n - PC Artist.mp3"; done
          MFP_DATA_DIR=$PWD/pc/data python ci/pc_server.py pc/Music > pc/server.log 2>&1 &
          for i in $(seq 1 30); do [ -f pc/link.txt ] && break; sleep 1; done
          cat pc/link.txt

      - name: Start the app on an emulator (Android 12), play every format, import while playing, swipe it away
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Android 12 (API 31) x86_64 image: it runs ARM64-only apps through its built-in translation.
          api-level: 31
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: PC_LINK="$(cat pc/link.txt)" python3 ci/smoke_test.py MusicFlowPlay-test.apk out songs

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-results
          path: |
            out/
            pc/server.log

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build MusicFlowPlay.exe (MusicFlow's search and download inside)
        run: |
          python -m pip install -q -r requirements.txt -r musicflow/desktop/requirements.txt truststore certifi pyinstaller
          # MusicFlow's code (desktop/app.py, core/, yt-dlp, ffmpeg) is in the exe: nothing to install, no second page.
          $std = python ci/stdlib_args.py
          python -m PyInstaller --noconfirm --onefile --name MusicFlowPlay --icon NONE --distpath dist --workpath build --specpath build `
            --paths server --paths musicflow/core --paths musicflow/desktop --add-data "$PWD\web\*;web" --add-data "$PWD\CHANGELOG.md;web" `
            --collect-submodules mutagen --collect-submodules flask --collect-submodules werkzeug --collect-submodules certifi `
            --collect-all yt_dlp --collect-all yt_dlp_ejs --collect-all imageio_ffmpeg --collect-submodules selenium `
            --hidden-import truststore --hidden-import library --hidden-import app --hidden-import spotify_scan `
            --hidden-import downloads --hidden-import importer --hidden-import mf_bridge @std server/mfp_server.py

      - name: Start the exe and load the page
        shell: pwsh
        run: |
          $env:MFP_DATA_DIR = "$PWD\exe-data"
          $p = Start-Process dist\MusicFlowPlay.exe -ArgumentList "--no-browser" -PassThru
          $ok = $false; $tok = ""
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep 2
            try { $r = Invoke-WebRequest http://127.0.0.1:5091/ -UseBasicParsing -TimeoutSec 5; $ok = $r.Content -match "Tunedrift"
                  if ($r.Content -match "MFP_TOKEN='([^']+)'") { $tok = $Matches[1] } } catch {}
          }
          $mf = ""
          for ($i = 0; $i -lt 60 -and $ok -and $mf -ne "ready" -and $mf -ne "error"; $i++) {
            Start-Sleep 2
            try { $s = Invoke-RestMethod http://127.0.0.1:5091/api/state -Headers @{"X-MFP-Token" = $tok} -TimeoutSec 5; $mf = $s.musicflow.state
                  if ($mf -eq "error") { Write-Host $s.musicflow.error } } catch {}
          }
          Stop-Process $p -Force
          if (-not $ok) { throw "the exe did not serve the player page" }
          if ($mf -ne "ready") { throw "MusicFlow's search and download did not load in the exe ($mf)" }

      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlowPlay-exe
          path: dist/MusicFlowPlay.exe

  release:
    needs: [build, windows]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MusicFlowPlay-apk

      - uses: actions/download-artifact@v4
        with:
          name: MusicFlowPlay-exe

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          # A test build (fourth number not 0, e.g. 0.7.2.1) is published for Android only.
          cp MusicFlowPlay.apk Tunedrift.apk
          FILES="Tunedrift.apk"
          # x.y.z.0 is a full release; x.y.z.N (N > 0) is a test build.
          if [ "$(echo "${TAG#v}" | tr -cd . | wc -c)" -lt 3 ] || [ "${TAG##*.}" = "0" ]; then cp MusicFlowPlay.exe Tunedrift.exe; FILES="$FILES Tunedrift.exe"; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" $FILES --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Tunedrift ${TAG#v}" \
              --notes "Android: download Tunedrift.apk below, open it and allow installing from this source. Windows: download Tunedrift.exe and double-click it (if Windows warns: More info, Run anyway). Changes: see CHANGELOG.md."
          fi
