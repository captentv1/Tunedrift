<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>MusicFlow Play</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{
    --bg:#000000; --panel:#10242A; --panel2:#17323A; --panel3:#1d3d46;
    --ink:#e8f6f8; --muted:#8b9aa3; --border:#24303A;
    --accent:#29E0E8; --accent-ink:#00191b; --err:#E5484D; --fav:#ff4f7b;
    --t1:rgba(41,224,232,.08); --t2:rgba(41,224,232,.16);
    --bar-h:76px; --nav-h:0px;
    --safe-b:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:"Segoe UI",Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  body{background-image:radial-gradient(760px 380px at 50% -110px, var(--t1), transparent 72%);background-attachment:fixed;overflow:hidden}
  button{font:inherit;color:inherit}
  .hidden{display:none!important}
  svg.i{width:20px;height:20px;fill:currentColor;flex:0 0 auto;display:block}

  #app{display:grid;grid-template-columns:210px 1fr;grid-template-rows:56px 1fr;height:100dvh;
    padding-bottom:calc(var(--bar-h) + var(--nav-h) + var(--safe-b))}
  #topbar{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--border)}
  .logo{font-weight:700;letter-spacing:.3px;font-size:15px;white-space:nowrap;display:flex;align-items:center;gap:8px}
  .logo span{color:var(--accent)}
  #search{flex:1;max-width:460px;margin-left:auto;margin-right:auto;position:relative}
  #search input{width:100%;height:38px;border-radius:19px;border:1px solid var(--border);background:var(--panel2);
    color:var(--ink);padding:0 36px 0 38px;font-size:14px}
  #search input:focus{outline:none;border-color:var(--accent)}
  #search .i{position:absolute;left:11px;top:9px;color:var(--muted)}
  #search-clear{position:absolute;right:6px;top:5px;width:28px;height:28px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:50%}
  .iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);
    cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .iconbtn:hover{color:var(--ink);border-color:#0E6b73}
  .iconbtn.on{color:var(--accent);border-color:var(--accent)}

  #side{background:var(--panel);border-right:1px solid var(--border);padding:14px 10px;overflow:auto}
  .nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:var(--muted);font-weight:600;
    cursor:pointer;margin-bottom:3px;user-select:none;border:1px solid transparent;font-size:13.5px}
  .nav:hover{background:var(--panel2);color:var(--ink)}
  .nav.active{background:var(--t2);color:var(--ink);border-color:rgba(41,224,232,.35)}
  .nav.active .i{color:var(--accent)}
  .nav-sep{height:1px;background:var(--border);margin:10px 4px}

  #main{overflow:auto;padding:22px 24px 30px;min-width:0;overscroll-behavior:contain}
  .head{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap}
  .head h1{margin:0;font-size:24px;line-height:1.2;word-break:break-word}
  .head .sub{color:var(--muted);margin-top:4px}
  .head .grow{flex:1;min-width:180px}
  .head .art{width:132px;height:132px;border-radius:12px;flex:0 0 auto}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  .btn{height:36px;padding:0 16px;border-radius:18px;border:1px solid var(--border);background:var(--panel2);color:var(--ink);
    cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:7px;font-size:13px}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .btn.danger{color:var(--err);border-color:rgba(229,72,77,.45)}
  .btn .i{width:17px;height:17px}
  select,input.text{height:36px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--ink);padding:0 10px;font:inherit}
  input.text{width:100%}
  input.text:focus,select:focus{outline:none;border-color:var(--accent)}
  .spacer{flex:1}
  .muted{color:var(--muted)}
  h2.sec{font-size:15px;margin:22px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}

  .art{background:var(--panel2) center/cover no-repeat;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);overflow:hidden}
  .art img{width:100%;height:100%;object-fit:cover;display:block}
  .art .i{width:40%;height:40%;opacity:.6}

  .rows{display:flex;flex-direction:column}
  .row{display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:9px;cursor:pointer;min-height:56px}
  .row:hover{background:var(--panel)}
  .row.playing .t1{color:var(--accent)}
  .row .art{width:44px;height:44px;flex:0 0 auto}
  .row .no{width:24px;text-align:right;color:var(--muted);flex:0 0 auto;font-variant-numeric:tabular-nums}
  .row .txt{flex:1;min-width:0}
  .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t2{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .row .dur{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px;flex:0 0 auto}
  .row .rb{width:34px;height:34px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .row .rb:hover{color:var(--ink);background:var(--panel2)}
  .rb.fav-on{color:var(--fav)!important}
  .eq{display:none}
  .row.playing .eq{display:inline-block;width:14px;height:12px;margin-right:6px;vertical-align:-1px;
    background:linear-gradient(var(--accent),var(--accent)) 0 100%/3px 60% no-repeat,linear-gradient(var(--accent),var(--accent)) 5px 100%/3px 100% no-repeat,linear-gradient(var(--accent),var(--accent)) 10px 100%/3px 40% no-repeat}
  body.is-playing .row.playing .eq{animation:eq 0.9s infinite alternate}
  @keyframes eq{to{background-size:3px 30%,3px 50%,3px 90%}}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
  .card{cursor:pointer;min-width:0}
  .card .art{width:100%;aspect-ratio:1;border-radius:10px;margin-bottom:8px}
  .card.round .art{border-radius:50%}
  .card:hover .art{outline:2px solid var(--accent);outline-offset:2px}
  .chips{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .chip{padding:7px 14px;border-radius:16px;border:1px solid var(--border);background:var(--panel2);cursor:pointer;font-weight:600;font-size:13px}
  .chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .empty{padding:50px 20px;text-align:center;color:var(--muted);line-height:1.6}
  .empty .i{width:46px;height:46px;margin:0 auto 12px;opacity:.5}
  .more{height:1px}

  #bar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--safe-b));height:var(--bar-h);background:var(--panel);border-top:1px solid var(--border);
    display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);align-items:center;gap:16px;padding:0 16px;z-index:30}
  #bar .now{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer}
  #bar .now .art{width:52px;height:52px;flex:0 0 auto}
  #bar .center{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
  .ctrls{display:flex;align-items:center;gap:10px}
  .cb{width:38px;height:38px;border-radius:50%;border:0;background:none;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
  .cb:hover{background:var(--panel2)}
  .cb.dim{color:var(--muted)}
  .cb.on{color:var(--accent)}
  .cb.on::after{content:"";position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
  .cb .badge{position:absolute;top:6px;right:4px;font-size:9px;font-weight:800}
  .cb.play{width:42px;height:42px;background:var(--ink);color:#000}
  .cb.play:hover{background:#fff;transform:scale(1.04)}
  .seek{display:flex;align-items:center;gap:8px;width:100%;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .seek span{width:38px;flex:0 0 auto}
  .seek span:first-child{text-align:right}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:18px;background:transparent;cursor:pointer;min-width:0;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(var(--accent),var(--accent)) 0/var(--p,0%) 100% no-repeat,var(--panel3)}
  input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--panel3)}
  input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--ink);margin-top:-4.5px;border:0}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--ink);border:0}
  #bar .right{display:flex;align-items:center;justify-content:flex-end;gap:6px}
  #vol{max-width:110px}
  #bar .mini-progress{display:none}

  #bottomnav{display:none}

  #np{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;
    transform:translateY(100%);transition:transform .28s ease;visibility:hidden}
  #np.open{transform:none;visibility:visible}
  #np .bgblur{position:absolute;inset:-40px;background:center/cover no-repeat;filter:blur(50px) brightness(.35) saturate(1.3);z-index:-1;opacity:.9}
  #np header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 6px}
  #np header .title{flex:1;text-align:center;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px}
  #np .body{flex:1;display:grid;grid-template-columns:minmax(260px,440px) minmax(0,1fr);gap:40px;padding:10px 40px 24px;min-height:0;max-width:1200px;width:100%;margin:0 auto}
  #np .left{display:flex;flex-direction:column;justify-content:center;gap:18px;min-width:0}
  #np .left .art{width:100%;aspect-ratio:1;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.6)}
  #np .meta{display:flex;align-items:center;gap:10px}
  #np .meta .txt{flex:1;min-width:0}
  #np .meta .t1{font-size:21px}
  #np .meta .t2{font-size:14.5px;margin-top:4px}
  #np .meta .t2 a{color:inherit;text-decoration:none;cursor:pointer}
  #np .meta .t2 a:hover{text-decoration:underline;color:var(--ink)}
  #np .ctrls{justify-content:space-between}
  #np .cb.play{width:62px;height:62px}
  #np .cb.play svg{width:30px;height:30px}
  #np .seek{font-size:12px}
  #np .right{display:flex;flex-direction:column;min-height:0;min-width:0}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tab{padding:8px 16px;border-radius:16px;border:0;background:none;color:var(--muted);font-weight:700;cursor:pointer}
  .tab.on{background:var(--panel2);color:var(--ink)}
  #np .pane{flex:1;overflow:auto;min-height:0;border-radius:12px;overscroll-behavior:contain}
  #lyr{padding:14px 6px 45vh;font-size:22px;font-weight:700;line-height:1.45}
  #lyr .l{color:rgba(232,246,248,.38);padding:5px 8px;border-radius:8px;cursor:pointer;transition:color .2s}
  #lyr .l:hover{background:rgba(255,255,255,.05)}
  #lyr .l.past{color:rgba(232,246,248,.62)}
  #lyr .l.cur{color:var(--ink)}
  #lyr.plain{font-size:17px;font-weight:500;white-space:pre-wrap;color:var(--ink);padding-bottom:40px}
  #lyr .note{font-size:14px;font-weight:500;color:var(--muted);text-align:center;padding:40px 10px}
  #lyr .note .btn{margin-top:14px}
  #lyr .src{font-size:12px;font-weight:500;color:var(--muted);padding:20px 8px 0}

  #menu{position:fixed;z-index:70;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:6px;min-width:220px;
    box-shadow:0 12px 40px rgba(0,0,0,.55);max-height:70vh;overflow:auto}
  #menu .mi{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;font-weight:500}
  #menu .mi:hover{background:var(--panel3)}
  #menu .mi .i{width:18px;height:18px;color:var(--muted)}
  #menu .msep{height:1px;background:var(--border);margin:5px 4px}
  #menu .mh{padding:8px 12px 4px;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  #scrim{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.35)}
  #dialog{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding:16px}
  #dialog .box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;width:min(420px,100%)}
  #dialog h3{margin:0 0 14px}
  #dialog .actions{justify-content:flex-end;margin:16px 0 0}
  #toast{position:fixed;left:50%;bottom:calc(var(--bar-h) + var(--nav-h) + var(--safe-b) + 16px);transform:translateX(-50%);z-index:90;
    background:var(--panel3);border:1px solid var(--border);padding:10px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5);
    opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px);text-align:center}
  #toast.show{opacity:1}

  .set{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
  .set h3{margin:0 0 4px;font-size:15px}
  .set p{margin:0 0 12px;color:var(--muted);line-height:1.5}
  .folder{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--border);word-break:break-all}
  .folder:first-of-type{border-top:0}
  .folder span{flex:1}
  .addrow{display:flex;gap:8px;margin-top:10px}
  code{background:var(--panel2);padding:2px 6px;border-radius:5px;word-break:break-all}
  .progress-line{height:3px;background:var(--panel2);border-radius:2px;overflow:hidden;margin-top:10px}
  .progress-line div{height:100%;width:40%;background:var(--accent);animation:slide 1.2s infinite linear}
  @keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}

  @media (max-width:760px){
    :root{--bar-h:64px;--nav-h:58px}
    #app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    #side{display:none}
    #topbar{grid-column:1;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;flex-wrap:nowrap}
    .logo .name{display:none}
    #main{padding:16px 14px 24px}
    .head .art{width:96px;height:96px}
    .head h1{font-size:20px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px}
    #bar{grid-template-columns:1fr auto;gap:8px;padding:0 8px 0 10px;margin:0 6px;left:0;right:0;border:1px solid var(--border);border-radius:12px;
      bottom:calc(var(--nav-h) + var(--safe-b) + 4px);height:calc(var(--bar-h) - 6px);background:var(--panel2)}
    #bar .center .seek,#bar .right,#bar .cb.hide-m{display:none}
    #bar .center{order:2}
    #bar .now .art{width:44px;height:44px}
    #bar .mini-progress{display:block;position:absolute;left:10px;right:10px;bottom:0;height:2px;background:var(--panel3);border-radius:2px;overflow:hidden}
    #bar .mini-progress div{height:100%;background:var(--accent);width:0}
    #bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);
      background:var(--panel);border-top:1px solid var(--border);z-index:31}
    #bottomnav .bn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;cursor:pointer;border:0;background:none}
    #bottomnav .bn.active{color:var(--accent)}
    #np .body{grid-template-columns:1fr;grid-template-rows:auto;padding:4px 20px calc(16px + var(--safe-b));gap:12px;overflow:hidden}
    #np .left{justify-content:flex-start}
    #np .left .art{width:min(100%,42vh);margin:0 auto}
    #np.view-pane .left .art{display:none}
    #np:not(.view-pane) .right{display:none}
    #np.view-pane .body{grid-template-rows:auto 1fr}
    #np.view-pane .left{order:2}
    #np.view-pane .right{order:1}
    #lyr{font-size:19px}
    .np-switch{display:flex!important}
    #np-tabs{display:none}
  }
  .np-switch{display:none;justify-content:center;gap:6px}
  @media (prefers-reduced-motion:reduce){#np{transition:none}body.is-playing .row.playing .eq{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="logo"><img src="icon.svg" width="28" height="28" alt=""><span class="name">MusicFlow <span>Play</span></span></div>
    <div id="search">
      <svg class="i"><use href="#i-search"/></svg>
      <input id="q" type="search" placeholder="Search songs, artists, albums" autocomplete="off" enterkeyhint="search">
      <button id="search-clear" class="hidden" title="Clear" aria-label="Clear search">✕</button>
    </div>
    <button class="iconbtn" id="btn-settings" title="Settings" aria-label="Settings"><svg class="i"><use href="#i-gear"/></svg></button>
  </header>
  <nav id="side"></nav>
  <main id="main"></main>
</div>

<div id="bar">
  <div class="now" id="bar-now" title="Now playing">
    <div class="art" id="bar-art"><svg class="i"><use href="#i-note"/></svg></div>
    <div class="txt" style="min-width:0"><div class="t1" id="bar-title">Nothing playing</div><div class="t2" id="bar-artist">Pick a song</div></div>
  </div>
  <div class="center">
    <div class="ctrls">
      <button class="cb dim hide-m" data-act="shuffle" title="Shuffle"><svg class="i"><use href="#i-shuffle"/></svg></button>
      <button class="cb hide-m" data-act="prev" title="Previous"><svg class="i"><use href="#i-prev"/></svg></button>
      <button class="cb play" data-act="toggle" title="Play"><svg class="i"><use href="#i-play"/></svg></button>
      <button class="cb" data-act="next" title="Next"><svg class="i"><use href="#i-next"/></svg></button>
      <button class="cb dim hide-m" data-act="repeat" title="Repeat"><svg class="i"><use href="#i-repeat"/></svg><span class="badge"></span></button>
    </div>
    <div class="seek"><span class="cur">0:00</span><input type="range" class="seekbar" min="0" max="1000" value="0" step="1" aria-label="Position"><span class="tot">0:00</span></div>
  </div>
  <div class="right">
    <button class="cb dim" data-act="fav" title="Favorite"><svg class="i"><use href="#i-heart"/></svg></button>
    <button class="cb dim" data-act="lyrics" title="Lyrics"><svg class="i"><use href="#i-lyrics"/></svg></button>
    <button class="cb dim" data-act="queue" title="Queue"><svg class="i"><use href="#i-queue"/></svg></button>
    <button class="cb dim" data-act="mute" title="Mute"><svg class="i"><use href="#i-vol"/></svg></button>
    <input type="range" id="vol" min="0" max="100" value="100" aria-label="Volume">
  </div>
  <div class="mini-progress"><div></div></div>
</div>

<nav id="bottomnav"></nav>

<section id="np" aria-label="Now playing">
  <div class="bgblur"></div>
  <header>
    <button class="iconbtn" id="np-close" title="Close" aria-label="Close"><svg class="i"><use href="#i-down"/></svg></button>
    <div class="title">Now playing</div>
    <button class="iconbtn" id="np-more" title="More" aria-label="More"><svg class="i"><use href="#i-more"/></svg></button>
  </header>
  <div class="body">
    <div class="left">
      <div class="art" id="np-art"><svg class="i"><use href="#i-note"/></svg></div>
      <div class="meta">
        <div class="txt"><div class="t1" id="np-title">Nothing playing</div><div class="t2" id="np-artist"></div></div>
        <button class="cb dim" data-act="fav" title="Favorite"><svg class="i"><use href="#i-heart"/></svg></button>
      </div>
      <div class="seek"><span class="cur">0:00</span><input type="range" class="seekbar" min="0" max="1000" value="0" step="1" aria-label="Position"><span class="tot">0:00</span></div>
      <div class="ctrls">
        <button class="cb dim" data-act="shuffle" title="Shuffle"><svg class="i"><use href="#i-shuffle"/></svg></button>
        <button class="cb" data-act="prev" title="Previous"><svg class="i"><use href="#i-prev"/></svg></button>
        <button class="cb play" data-act="toggle" title="Play"><svg class="i"><use href="#i-play"/></svg></button>
        <button class="cb" data-act="next" title="Next"><svg class="i"><use href="#i-next"/></svg></button>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const ico = (id, cls = "") => `<svg class="i ${cls}"><use href="#i-${id}"/></svg>`;
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = String(s % 60).padStart(2, "0"); return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`; };
const norm = s => String(s || "").normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ").trim();
const store = {
  get(k, d) { try { const v = localStorage.getItem("mfp." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("mfp." + k, JSON.stringify(v)); } catch {} },
};
const UNKNOWN_ARTIST = "Unknown artist", UNKNOWN_ALBUM = "Unknown album";

(function token() {
  const u = new URL(location.href), t = u.searchParams.get("t");
  if (t) { store.set("token", t); u.searchParams.delete("t"); history.replaceState(null, "", u.pathname + u.search + u.hash); }
  let fromApp = "";
  try { fromApp = window.MFPNative ? MFPNative.token() : ""; } catch {}
  window.TOKEN = window.MFP_TOKEN || fromApp || store.get("token", "");
})();

async function api(path, body, method) {
  const opt = {method: method || (body ? "POST" : "GET"), headers: {"X-MFP-Token": TOKEN}};
  if (body) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch("/api/" + path, opt);
  let data = {};
  try { data = await r.json(); } catch {}
  if (!r.ok) throw new Error(data.error || (r.status === 403 ? "Access refused: open the link shown on the computer that runs the player." : "Server error " + r.status));
  return data;
}
const audioUrl = id => `/api/audio/${id}?t=${encodeURIComponent(TOKEN)}`;
const coverUrl = id => `/api/cover/${id}?t=${encodeURIComponent(TOKEN)}`;

const NATIVE = window.MFPNative || null;
const native = (fn, ...args) => { if (NATIVE) try { NATIVE[fn](...args); } catch {} };
function nativeState() { native("playback", !audio.paused, Math.round((audio.currentTime || 0) * 1000), Math.round((isFinite(audio.duration) ? audio.duration : 0) * 1000)); }
window.MFP_cmd = (c, v) => {
  if (c === "play") { if (Player.current()) audio.play().catch(() => {}); else Player.toggle(); }
  else if (c === "pause") audio.pause();
  else if (c === "toggle") Player.toggle();
  else if (c === "next") Player.next(false);
  else if (c === "prev") Player.prev();
  else if (c === "seek") { audio.currentTime = Math.max(0, v / 1000); updateTime(true); nativeState(); }
};
window.MFP_rescan = async () => { try { await api("scan", {}); } catch {} L.scan.running = true; setTimeout(() => loadLibrary(true), 700); if (route().name === "settings") setTimeout(render, 900); };

let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600); }

/* ---------- Library ---------- */
const L = {tracks: new Map(), list: [], artists: new Map(), albums: new Map(), favorites: [], playlists: [], loaded: false, scan: {}, tries: 0};

function albumKey(t) { return norm(t.album || UNKNOWN_ALBUM) + "\u0001" + norm(t.album ? t.album_artist : ""); }

function buildIndexes() {
  L.list = [...L.tracks.values()];
  for (const t of L.list) {
    t._q = norm([t.title, t.artist, t.album, t.album_artist].join(" "));
    t._title = norm(t.title);
  }
  L.artists = new Map();
  L.albums = new Map();
  for (const t of L.list) {
    const names = t.artists && t.artists.length ? t.artists : [UNKNOWN_ARTIST];
    for (const n of names) {
      const k = norm(n);
      if (!L.artists.has(k)) L.artists.set(k, {key: k, name: n, tracks: [], albums: new Set(), cover: null});
      const a = L.artists.get(k); a.tracks.push(t);
      if (t.album) a.albums.add(albumKey(t));
      if (!a.cover && t.cover) a.cover = t.id;
    }
    const ak = albumKey(t);
    if (!L.albums.has(ak)) L.albums.set(ak, {key: ak, name: t.album || UNKNOWN_ALBUM, artist: t.album ? t.album_artist : "", year: "", tracks: [], cover: null});
    const al = L.albums.get(ak); al.tracks.push(t);
    if (!al.cover && t.cover) al.cover = t.id;
    if (t.year && (!al.year || t.year < al.year)) al.year = t.year;
  }
  for (const al of L.albums.values()) al.tracks.sort((a, b) => (a.track_no || 999) - (b.track_no || 999) || a._title.localeCompare(b._title));
}

async function loadLibrary(quiet) {
  try {
    const [d, c] = await Promise.all([api("tracks"), api("collections")]);
    L.tracks = new Map(d.tracks.map(t => [t.id, t]));
    L.scan = d.scan || {};
    L.favorites = c.favorites || [];
    L.playlists = c.playlists || [];
    L.loaded = true;
    buildIndexes();
    Player.restoreIfNeeded();
    render();
    updateNow();
    if (L.scan.running) setTimeout(() => loadLibrary(true), 1500);
  } catch (e) {
    if (e instanceof TypeError && !L.loaded && ++L.tries < 80) { setTimeout(() => loadLibrary(quiet), 500); return; }
    L.error = e.message;
    if (!quiet) render();
  }
}

const isFav = id => L.favorites.includes(id);
async function toggleFav(id) {
  if (!id) return;
  const on = !isFav(id);
  L.favorites = on ? [id, ...L.favorites] : L.favorites.filter(x => x !== id);
  refreshFavButtons();
  try { L.favorites = (await api("favorites", {id, on})).favorites; } catch (e) { toast(e.message); }
  refreshFavButtons();
  if (route().name === "favorites") render();
}
function refreshFavButtons() {
  const id = Player.currentId();
  for (const b of $$('[data-act="fav"]')) { const on = id && isFav(id); b.classList.toggle("dim", !on); b.classList.toggle("rb-fav", on); b.style.color = on ? "var(--fav)" : ""; b.innerHTML = ico(on ? "heart-f" : "heart"); }
  for (const b of $$(".rb[data-fav]")) { const on = isFav(b.dataset.fav); b.classList.toggle("fav-on", on); b.innerHTML = ico(on ? "heart-f" : "heart"); }
}

/* ---------- Player ---------- */
const audio = $("#audio");
const Player = {
  queue: store.get("queue", []), original: store.get("original", null), i: store.get("index", -1),
  shuffle: store.get("shuffle", false), repeat: store.get("repeat", "off"), resumeAt: store.get("position", 0),
  errors: 0, restored: false,
  currentId() { return this.queue[this.i] || null; },
  current() { return L.tracks.get(this.currentId()) || null; },
  save() { store.set("queue", this.queue); store.set("original", this.original); store.set("index", this.i); store.set("shuffle", this.shuffle); store.set("repeat", this.repeat); },
  restoreIfNeeded() {
    if (this.restored) return;
    this.restored = true;
    const keep = this.queue.filter(id => L.tracks.has(id));
    if (keep.length !== this.queue.length) { const cur = this.currentId(); this.queue = keep; this.i = Math.max(0, keep.indexOf(cur)); if (this.original) this.original = this.original.filter(id => L.tracks.has(id)); }
    if (this.current()) { this.load(false, this.resumeAt); }
    else { this.i = this.queue.length ? 0 : -1; }
    syncModeButtons();
  },
  playList(ids, start = 0, shuffle) {
    ids = ids.filter(id => L.tracks.has(id));
    if (!ids.length) return;
    if (shuffle !== undefined) this.shuffle = shuffle;
    if (this.shuffle) {
      this.original = ids.slice();
      const first = shuffle && start === 0 ? ids[Math.floor(Math.random() * ids.length)] : ids[start];
      this.queue = [first, ...shuffled(ids.filter(x => x !== first))];
      this.i = 0;
    } else { this.original = null; this.queue = ids.slice(); this.i = start; }
    this.save(); syncModeButtons(); this.load(true);
  },
  load(autoplay, at = 0) {
    const t = this.current();
    if (!t) { audio.removeAttribute("src"); audio.load(); updateNow(); return; }
    audio.src = audioUrl(t.id);
    this.pendingSeek = at > 0 ? at : 0;
    if (autoplay) audio.play().catch(err => { if (err.name !== "AbortError") toast("Tap play to start"); });
    updateNow(); loadLyrics(t);
    this.save();
  },
  toggle() {
    if (!this.current()) { const ids = sortedSongs().map(t => t.id); if (ids.length) this.playList(ids, 0); return; }
    if (audio.paused) audio.play().catch(() => {}); else audio.pause();
  },
  next(auto) {
    if (!this.queue.length) return;
    if (auto && this.repeat === "one") { audio.currentTime = 0; audio.play().catch(() => {}); return; }
    if (this.i + 1 < this.queue.length) { this.i++; this.load(true); return; }
    if (this.repeat === "all") { this.i = 0; this.load(true); return; }
    if (auto) { audio.pause(); audio.currentTime = 0; this.save(); updateNow(); return; }
    this.i = 0; this.load(false);
  },
  prev() {
    if (audio.currentTime > 3 || this.i <= 0) { if (this.i <= 0 && this.repeat === "all" && audio.currentTime <= 3 && this.queue.length > 1) { this.i = this.queue.length - 1; this.load(true); return; } audio.currentTime = 0; return; }
    this.i--; this.load(true);
  },
  jump(k) { if (k >= 0 && k < this.queue.length) { this.i = k; this.load(true); } },
  setShuffle(on) {
    const cur = this.currentId();
    if (on && !this.shuffle) {
      this.original = this.queue.slice();
      const rest = this.queue.filter((_, k) => k !== this.i);
      this.queue = cur ? [cur, ...shuffled(rest)] : shuffled(rest);
      this.i = cur ? 0 : -1;
    } else if (!on && this.shuffle) {
      const base = (this.original || this.queue).filter(id => this.queue.includes(id));
      for (const id of this.queue) if (!base.includes(id)) base.push(id);
      this.queue = base; this.original = null; this.i = cur ? base.indexOf(cur) : -1;
    }
    this.shuffle = on; this.save(); syncModeButtons(); renderQueuePane(); if (route().name === "queue") render();
  },
  cycleRepeat() { this.repeat = {off: "all", all: "one", one: "off"}[this.repeat] || "off"; this.save(); syncModeButtons(); },
  playNext(ids) {
    ids = ids.filter(id => L.tracks.has(id));
    if (!ids.length) return;
    if (!this.current()) { this.playList(ids, 0); return; }
    this.queue.splice(this.i + 1, 0, ...ids);
    if (this.original) this.original.push(...ids);
    this.save(); afterQueueChange(); toast(ids.length > 1 ? `${ids.length} songs will play next` : "Will play next");
  },
  addToQueue(ids) {
    ids = ids.filter(id => L.tracks.has(id));
    if (!ids.length) return;
    if (!this.current()) { this.playList(ids, 0); return; }
    this.queue.push(...ids);
    if (this.original) this.original.push(...ids);
    this.save(); afterQueueChange(); toast(ids.length > 1 ? `${ids.length} songs added to the queue` : "Added to the queue");
  },
  removeAt(k) {
    if (k === this.i) { this.queue.splice(k, 1); if (this.i >= this.queue.length) this.i = this.queue.length - 1; this.load(!audio.paused); }
    else { this.queue.splice(k, 1); if (k < this.i) this.i--; }
    this.save(); afterQueueChange();
  },
  move(k, d) {
    const j = k + d;
    if (j < 0 || j >= this.queue.length) return;
    [this.queue[k], this.queue[j]] = [this.queue[j], this.queue[k]];
    if (this.i === k) this.i = j; else if (this.i === j) this.i = k;
    this.save(); afterQueueChange();
  },
  clearUpcoming() { this.queue = this.queue.slice(0, this.i + 1); if (this.original) this.original = this.queue.slice(); this.save(); afterQueueChange(); },
};
function shuffled(a) { a = a.slice(); for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; }
function afterQueueChange() { renderQueuePane(); if (route().name === "queue") render(); }

function syncModeButtons() {
  for (const b of $$('[data-act="shuffle"]')) { b.classList.toggle("on", Player.shuffle); b.classList.toggle("dim", !Player.shuffle); b.title = Player.shuffle ? "Shuffle: on" : "Shuffle: off"; }
  for (const b of $$('[data-act="repeat"]')) {
    const r = Player.repeat; b.classList.toggle("on", r !== "off"); b.classList.toggle("dim", r === "off");
    $(".badge", b).textContent = r === "one" ? "1" : ""; b.title = {off: "Repeat: off", all: "Repeat: all", one: "Repeat: this song"}[r];
  }
}

audio.addEventListener("loadedmetadata", () => {
  if (Player.pendingSeek) { try { audio.currentTime = Math.min(Player.pendingSeek, Math.max(0, audio.duration - 1)); } catch {} Player.pendingSeek = 0; }
  updateTime(true);
});
audio.addEventListener("playing", () => { Player.errors = 0; nativeState(); });
audio.addEventListener("seeked", nativeState);
audio.addEventListener("durationchange", nativeState);
audio.addEventListener("play", () => { document.body.classList.add("is-playing"); syncPlayButtons(); nativeState(); });
audio.addEventListener("pause", () => { document.body.classList.remove("is-playing"); syncPlayButtons(); store.set("position", audio.currentTime); nativeState(); });
audio.addEventListener("ended", () => Player.next(true));
audio.addEventListener("timeupdate", () => updateTime());
audio.addEventListener("error", () => {
  if (!audio.getAttribute("src")) return;
  const t = Player.current();
  Player.errors++;
  toast(`Can't play “${t ? t.title : "this file"}”${t ? " (" + t.format.toUpperCase() + ")" : ""}`);
  if (Player.errors < 4 && Player.i + 1 < Player.queue.length) setTimeout(() => Player.next(false), 1200);
});
let lastSaved = 0, lastPos = 0;
function updateTime(force) {
  const d = audio.duration || (Player.current() || {}).length_s || 0, c = audio.currentTime || 0;
  if (!seeking) for (const s of $$(".seekbar")) { s.value = d ? Math.round(c / d * 1000) : 0; s.style.setProperty("--p", (d ? c / d * 100 : 0) + "%"); }
  for (const e of $$(".seek .cur")) e.textContent = fmt(c);
  for (const e of $$(".seek .tot")) e.textContent = fmt(d);
  $("#bar .mini-progress div").style.width = (d ? c / d * 100 : 0) + "%";
  const now = Date.now();
  if (now - lastSaved > 5000) { lastSaved = now; store.set("position", c); }
  if ("mediaSession" in navigator && d && isFinite(d) && (force || Math.abs(now - lastPos) > 4000)) {
    lastPos = now;
    try { navigator.mediaSession.setPositionState({duration: d, position: Math.min(c, d), playbackRate: audio.playbackRate || 1}); } catch {}
  }
  syncLyrics(c);
}
let seeking = false;
for (const s of $$(".seekbar")) {
  s.addEventListener("input", () => { seeking = true; s.style.setProperty("--p", s.value / 10 + "%"); const d = audio.duration || 0; for (const e of $$(".seek .cur")) e.textContent = fmt(d * s.value / 1000); });
  s.addEventListener("change", () => { const d = audio.duration || 0; if (d) audio.currentTime = d * s.value / 1000; seeking = false; updateTime(true); });
}
const vol = $("#vol");
audio.volume = store.get("volume", 1);
vol.value = Math.round(audio.volume * 100); vol.style.setProperty("--p", vol.value + "%");
vol.addEventListener("input", () => { audio.volume = vol.value / 100; audio.muted = false; vol.style.setProperty("--p", vol.value + "%"); store.set("volume", audio.volume); syncMute(); });
function syncMute() { for (const b of $$('[data-act="mute"]')) b.innerHTML = ico(audio.muted || audio.volume === 0 ? "mute" : "vol"); }
function syncPlayButtons() { const p = !audio.paused; for (const b of $$('[data-act="toggle"]')) { b.innerHTML = ico(p ? "pause" : "play"); b.title = p ? "Pause" : "Play"; } if ("mediaSession" in navigator) navigator.mediaSession.playbackState = p ? "playing" : "paused"; }

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const a = b.dataset.act;
  if (a === "toggle") Player.toggle();
  else if (a === "next") Player.next(false);
  else if (a === "prev") Player.prev();
  else if (a === "shuffle") Player.setShuffle(!Player.shuffle);
  else if (a === "repeat") Player.cycleRepeat();
  else if (a === "fav") toggleFav(Player.currentId());
  else if (a === "mute") { audio.muted = !audio.muted; syncMute(); }
  else if (a === "lyrics") openNow("lyrics");
  else if (a === "queue") openNow("queue");
});

if ("mediaSession" in navigator) {
  const ms = navigator.mediaSession, h = (n, f) => { try { ms.setActionHandler(n, f); } catch {} };
  h("play", () => audio.play()); h("pause", () => audio.pause()); h("stop", () => audio.pause());
  h("previoustrack", () => Player.prev()); h("nexttrack", () => Player.next(false));
  h("seekbackward", d => { audio.currentTime = Math.max(0, audio.currentTime - (d.seekOffset || 10)); });
  h("seekforward", d => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + (d.seekOffset || 10)); });
  h("seekto", d => { if (d.fastSeek && audio.fastSeek) audio.fastSeek(d.seekTime); else audio.currentTime = d.seekTime; updateTime(true); });
}

  const t = Player.current();
  $("#bar-title").textContent = t ? t.title : "Nothing playing";
  $("#bar-artist").textContent = t ? (t.artist || UNKNOWN_ARTIST) : "Pick a song";

    if (t.album) { a.append(" · "); const x = document.createElement("a"); x.textContent = t.album; x.onclick = () => { closeNow(); go("album/" + encodeURIComponent(albumKey(t))); }; a.append(x); }
  }

  if (t) native("nowPlaying", t.title, t.artist || UNKNOWN_ARTIST, t.album || "", t.cover ? new URL(coverUrl(t.id), location.href).href : "", (t.length_s || 0) * 1000);
  else native("stop");
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = t ? new MediaMetadata({title: t.title, artist: t.artist || UNKNOWN_ARTIST, album: t.album || "",
      artwork: t.cover ? [{src: new URL(coverUrl(t.id), location.href).href, sizes: "512x512"}] : [{src: new URL("icon.svg", location.href).href, sizes: "512x512", type: "image/svg+xml"}]}) : null;
  }
  markPlaying(); refreshFavButtons(); syncPlayButtons(); renderQueuePane(); if (route().name === "queue" && $("#qlist")) $("#qlist").innerHTML = queueHtml(); updateTime(true);
}

/* ---------- Lyrics ---------- */
const Ly = {id: null, lines: [], cur: -1, userScroll: 0, data: null};
function parseLrc(text) {
  let offset = 0; const out = [];
  for (const raw of String(text || "").split(/\r?\n/)) {
    const off = raw.match(/^\s*\[offset:\s*([+-]?\d+)\s*\]/i);
    if (off) { offset = +off[1] / 1000; continue; }
    const stamps = [...raw.matchAll(/\[(\d{1,3}):(\d{2})(?:[.:](\d{1,3}))?\]/g)];
    if (!stamps.length) continue;
    const txt = raw.replace(/\[[^\]]*\]/g, "").trim();
    for (const m of stamps) out.push({t: +m[1] * 60 + +m[2] + (m[3] ? +("0." + m[3]) : 0), txt});
  }
  out.forEach(l => l.t = Math.max(0, l.t - offset));
  return out.sort((a, b) => a.t - b.t);
}
async function loadLyrics(t) {
  const box = $("#lyr");
  Ly.id = t ? t.id : null; Ly.lines = []; Ly.cur = -1; Ly.data = null;
  box.className = ""; box.innerHTML = `<div class="note">Loading lyrics…</div>`;
  if (!t) { box.innerHTML = `<div class="note">Nothing playing</div>`; return; }
  try {
    const d = await api("lyrics/" + t.id);
    if (Ly.id !== t.id) return;
    showLyrics(t, d);
  } catch (e) { if (Ly.id === t.id) box.innerHTML = `<div class="note">${esc(e.message)}</div>`; }
}
function showLyrics(t, d) {
  const box = $("#lyr"); Ly.data = d;
  Ly.lines = parseLrc(d.synced).filter((l, k, a) => l.txt || (a[k + 1] && a[k + 1].t - l.t > 4));
  const src = d.source === "online" ? `<div class="src">Lyrics from LRCLIB (not saved in the file). <a href="#" id="ly-save" style="color:var(--accent)">Save into the file</a></div>` : "";
  if (Ly.lines.length) {
    box.className = "";
    box.innerHTML = Ly.lines.map((l, k) => `<div class="l" data-k="${k}">${l.txt ? esc(l.txt) : "♪"}</div>`).join("") + src;
    Ly.cur = -1; syncLyrics(audio.currentTime || 0, true);
  } else if (d.plain) {
    box.className = "plain"; box.innerHTML = esc(d.plain) + (d.source === "online" ? src : `<div class="src">Not synced. <a href="#" id="ly-find" style="color:var(--accent)">Look for synced lyrics online</a></div>`);
  } else {
    box.className = ""; box.innerHTML = `<div class="note">No lyrics for this song.<br><button class="btn" id="ly-find">${ico("search")} Search online</button></div>`;
  }
  const f = $("#ly-find"); if (f) f.onclick = e => { e.preventDefault(); findLyrics(t, false); };
  const s = $("#ly-save"); if (s) s.onclick = e => { e.preventDefault(); findLyrics(t, true); };
}
async function findLyrics(t, save) {
  const box = $("#lyr");
  if (!save) { box.className = ""; box.innerHTML = `<div class="note">Searching LRCLIB…</div>`; }
  try {
    const d = await api(`lyrics/${t.id}/find`, {save});
    if (d.error) toast(d.error); else if (save) { toast("Lyrics saved into the file"); d.source = "file"; }
    if (Ly.id === t.id) showLyrics(t, d);
  } catch (e) {
    if (Ly.id !== t.id) return;
    if (save) toast(e.message); else box.innerHTML = `<div class="note">${esc(e.message)}<br><button class="btn" id="ly-find">${ico("refresh")} Try again</button></div>`;
    const f = $("#ly-find"); if (f) f.onclick = () => findLyrics(t, false);
  }
}
function syncLyrics(c, jump) {
  if (!Ly.lines.length) return;
  let lo = 0, hi = Ly.lines.length - 1, k = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (Ly.lines[m].t <= c + 0.15) { k = m; lo = m + 1; } else hi = m - 1; }
  if (k === Ly.cur && !jump) return;
  const els = $$("#lyr .l");
  els.forEach((e, n) => { e.classList.toggle("cur", n === k); e.classList.toggle("past", n < k); });
  Ly.cur = k;
  const pane = $("#pane-lyrics");
  if (k >= 0 && els[k] && Date.now() - Ly.userScroll > 4000 && $("#np").classList.contains("open")) {
    const top = els[k].offsetTop - pane.clientHeight * 0.35;
    pane.scrollTo({top: Math.max(0, top), behavior: jump ? "auto" : "smooth"});
  }
}
$("#lyr").addEventListener("click", e => { const l = e.target.closest(".l"); if (l && Ly.lines[+l.dataset.k]) { audio.currentTime = Ly.lines[+l.dataset.k].t; Ly.userScroll = 0; syncLyrics(audio.currentTime, true); if (audio.paused) audio.play().catch(() => {}); } });
for (const ev of ["wheel", "touchmove"]) $("#pane-lyrics").addEventListener(ev, () => { Ly.userScroll = Date.now(); }, {passive: true});

/* ---------- Now playing ---------- */
let npPane = "lyrics";
function setPane(p) {
  npPane = p;
  const np = $("#np");
  np.classList.toggle("view-pane", p !== "cover");
  const pane = p === "cover" ? "lyrics" : p;
  $("#pane-lyrics").classList.toggle("hidden", pane !== "lyrics");
  $("#pane-queue").classList.toggle("hidden", pane !== "queue");
  for (const b of $$("#np .tab")) b.classList.toggle("on", b.dataset.pane === p);

function openNow(pane) {

  syncLyrics(audio.currentTime || 0, true);
}
function closeNow(fromPop) { if (!$("#np").classList.contains("open")) return; $("#np").classList.remove("open"); if (!fromPop && history.state && history.state.np) history.back(); }
window.addEventListener("popstate", () => { if ($("#np").classList.contains("open")) closeNow(true); });
$("#bar-now").onclick = () => openNow();
$("#np-close").onclick = () => closeNow();
for (const b of $$("#np .tab")) b.onclick = () => setPane(b.dataset.pane);
$("#np-more").onclick = e => { const t = Player.current(); if (t) trackMenu(e.currentTarget, t.id, {}); };

function renderQueuePane(force) {
  const box = $("#pane-queue");
  if (!force && box.classList.contains("hidden")) return;
  box.innerHTML = queueHtml(true);
}
function queueHtml(compact) {
  if (!Player.queue.length) return `<div class="empty">${ico("queue")}The queue is empty.</div>`;
  const up = Player.queue.slice(Player.i + 1).length;
  const MAX = 300, from = Math.max(0, Player.i), rows = [];
  Player.queue.slice(from, from + MAX).forEach((id, n) => {
    const k = from + n, t = L.tracks.get(id); if (!t) return;
    if (k === Player.i + 1) rows.push(`<h2 class="sec" style="margin-top:14px">Up next · ${up}${up ? ` <a href="#" data-clear style="color:var(--accent);text-transform:none;letter-spacing:0;float:right">Clear</a>` : ""}</h2>`);
    rows.push(`<div class="row ${k === Player.i ? "playing" : ""}" data-id="${t.id}" data-qi="${k}">
      <div class="art">${t.cover ? artHtml(t.id) : ico("note")}</div>
      <div class="txt"><div class="t1"><span class="eq"></span>${esc(t.title)}</div><div class="t2">${esc(t.artist || UNKNOWN_ARTIST)}</div></div>
      ${k > Player.i ? `<button class="rb" data-qmove="-1" title="Move up">${ico("up")}</button><button class="rb" data-qmove="1" title="Move down" style="transform:rotate(180deg)">${ico("up")}</button>` : ""}
      ${k !== Player.i ? `<button class="rb" data-qdel title="Remove from queue">${ico("close")}</button>` : `<span class="dur">${fmt(t.length_s)}</span>`}
    </div>`);
  });
  if (Player.i >= 0 && Player.i + 1 >= Player.queue.length) rows.push(`<div class="empty" style="padding:24px">Nothing after this song${Player.repeat === "all" ? " (repeat: the queue starts again)" : ""}.</div>`);
  return `<div class="rows">${rows.join("")}</div>`;
}
document.addEventListener("click", e => {
  const r = e.target.closest(".row[data-qi]");
  if (!r) return;
  const k = +r.dataset.qi;
  if (e.target.closest("[data-qdel]")) Player.removeAt(k);
  else if (e.target.closest("[data-qmove]")) Player.move(k, +e.target.closest("[data-qmove]").dataset.qmove);
  else if (k !== Player.i) Player.jump(k);
  else Player.toggle();
});
document.addEventListener("click", e => { if (e.target.closest("[data-clear]")) { e.preventDefault(); Player.clearUpcoming(); } });

/* ---------- Menus & dialogs ---------- */
function closeMenu() { $("#menu")?.remove(); $("#scrim")?.remove(); }
function menu(anchor, items) {
  closeMenu();
  const scrim = document.createElement("div"); scrim.id = "scrim"; scrim.onclick = closeMenu; document.body.append(scrim);
  const m = document.createElement("div"); m.id = "menu";
  m.innerHTML = items.map((it, k) => it === "-" ? `<div class="msep"></div>` : it.head ? `<div class="mh">${esc(it.head)}</div>` : `<div class="mi" data-k="${k}">${ico(it.icon || "note")}${esc(it.label)}</div>`).join("");
  document.body.append(m);
  const r = anchor.getBoundingClientRect(), mw = m.offsetWidth, mh = m.offsetHeight;
  let x = Math.min(r.right - mw, innerWidth - mw - 8), y = r.bottom + 4;
  if (y + mh > innerHeight - 8) y = Math.max(8, r.top - mh - 4);
  m.style.left = Math.max(8, x) + "px"; m.style.top = y + "px";
  m.onclick = e => { const mi = e.target.closest(".mi"); if (!mi) return; closeMenu(); items[+mi.dataset.k].run(); };
}
function dialog(title, bodyHtml, okLabel, onOk, danger) {
  const d = document.createElement("div"); d.id = "dialog";
  d.innerHTML = `<div class="box"><h3>${esc(title)}</h3>${bodyHtml}<div class="actions"><button class="btn" data-x>Cancel</button><button class="btn ${danger ? "danger" : "primary"}" data-ok>${esc(okLabel)}</button></div></div>`;
  document.body.append(d);
  const close = () => d.remove();
  const ok = async () => { if (await onOk(d) !== false) close(); };
  d.onclick = e => { if (e.target === d || e.target.closest("[data-x]")) close(); else if (e.target.closest("[data-ok]")) ok(); };
  d.addEventListener("keydown", e => { if (e.key === "Enter") ok(); if (e.key === "Escape") close(); });
  setTimeout(() => (d.querySelector("input") || d.querySelector("[data-ok]")).focus(), 30);
}
function askName(title, value, okLabel, cb) {
  dialog(title, `<input class="text" maxlength="120" value="${esc(value || "")}" placeholder="Playlist name">`, okLabel, async d => {
    const v = d.querySelector("input").value.trim(); if (!v) return false; await cb(v);
  });
}
function browseFolder(cb) {
  let current = "";
  dialog("Choose a music folder", `<div id="br-path" class="muted" style="word-break:break-all;margin-bottom:8px"></div><div id="br-list" class="rows" style="max-height:46vh;overflow:auto"></div>`, "Add this folder", () => { if (!current) return false; cb(current); });
  const show = async path => {
    const list = $("#br-list"); if (!list) return;
    try {
      const d = await api("browse?path=" + encodeURIComponent(path));
      current = d.path;
      $("#br-path").textContent = d.path || "Pick a place";
      const up = d.parent !== null && d.parent !== undefined ? `<div class="row" data-p="${esc(d.parent)}">${ico("up")}<div class="txt"><div class="t1">Back</div></div></div>` : "";
      list.innerHTML = up + (d.folders.map(f => `<div class="row" data-p="${esc(f.path)}">${ico("folder")}<div class="txt"><div class="t1">${esc(f.name)}</div></div></div>`).join("") || `<div class="empty" style="padding:20px">No subfolder here.</div>`);
      list.scrollTop = 0;
    } catch (e) { toast(e.message); }
  };
  $("#br-list").onclick = e => { const r = e.target.closest("[data-p]"); if (r) show(r.dataset.p); };
  show("");
}
async function newPlaylist(ids) {
  askName("New playlist", "", "Create", async name => {
    try { const p = (await api("playlists", {name, tracks: ids || []})).playlist; L.playlists.push(p); toast(`Playlist “${p.name}” created`); render(); }
    catch (e) { toast(e.message); }
  });
}
async function addToPlaylist(pid, ids) {
  try {
    const p = (await api("playlists/" + pid, {add: ids})).playlist;
    L.playlists = L.playlists.map(x => x.id === pid ? p : x); toast(`Added to “${p.name}”`);
    if (route().name === "playlist") render();
  } catch (e) { toast(e.message); }
}
function trackMenu(anchor, id, ctx) {
  const t = L.tracks.get(id); if (!t) return;
  const items = [
    {label: "Play next", icon: "playnext", run: () => Player.playNext([id])},
    {label: "Add to queue", icon: "queue", run: () => Player.addToQueue([id])},

  if (t.album) items.push({label: "Go to album", icon: "album", run: () => { closeNow(); go("album/" + encodeURIComponent(albumKey(t))); }});

let moreObserver;
function rowsHtml(tracks, opt = {}) {
  return tracks.map((t, k) => `<div class="row" data-id="${t.id}" data-k="${k}">
    ${opt.numbers ? `<div class="no">${t.track_no || "–"}</div>` : `<div class="art">${t.cover ? artHtml(t.id) : ico("note")}</div>`}
    <div class="txt"><div class="t1"><span class="eq"></span>${esc(t.title)}</div><div class="t2">${esc(opt.albumArtist !== undefined ? (norm(t.artist) !== norm(opt.albumArtist) ? t.artist : "") : [t.artist || UNKNOWN_ARTIST, t.album].filter(Boolean).join(" · "))}</div></div>
    <span class="dur">${fmt(t.length_s)}</span>
    <button class="rb" data-fav="${t.id}" title="Favorite">${ico(isFav(t.id) ? "heart-f" : "heart")}</button>
    <button class="rb" data-more title="More">${ico("more")}</button>
  </div>`).join("");

function mountRows(container, tracks, opt = {}) {
  const STEP = 150; let shown = 0;
  container.innerHTML = `<div class="rows"></div><div class="more"></div>`;
  const rows = $(".rows", container), sentinel = $(".more", container);
  const more = () => { rows.insertAdjacentHTML("beforeend", rowsHtml(tracks.slice(shown, shown + STEP), opt).replace(/data-k="(\d+)"/g, (_, k) => `data-k="${+k + shown}"`)); shown += STEP; if (shown >= tracks.length) sentinel.remove(); markPlaying(); refreshFavButtons(); };
  more();
  moreObserver?.disconnect();
  moreObserver = new IntersectionObserver(es => { if (es.some(x => x.isIntersecting) && shown < tracks.length) more(); }, {root: $("#main"), rootMargin: "600px"});
  if (shown < tracks.length) moreObserver.observe(sentinel);
  rows.onclick = e => {
    const r = e.target.closest(".row"); if (!r) return;
    const k = +r.dataset.k, id = r.dataset.id;
    if (e.target.closest("[data-fav]")) { e.stopPropagation(); toggleFav(id); return; }
    if (e.target.closest("[data-more]")) { e.stopPropagation(); trackMenu(e.target.closest("[data-more]"), id, opt.ctx ? {playlist: opt.ctx, pos: k} : {}); return; }
    if (Player.currentId() === id && opt.list && Player.queue.length === opt.list.length) { Player.toggle(); return; }
    Player.playList((opt.list || tracks).map(t => t.id), k);
  };
}
function markPlaying() { const id = Player.currentId(); for (const r of $$("#main .row[data-id]:not([data-qi])")) r.classList.toggle("playing", r.dataset.id === id); }
function cardsHtml(items, round) {
  return `<div class="grid">${items.map(x => `<div class="card ${round ? "round" : ""}" data-go="${esc(x.go)}">
    <div class="art">${x.cover ? `<img loading="lazy" src="${coverUrl(x.cover)}" alt="" onerror="this.remove()">` : ico(x.icon)}</div>
    <div class="t1">${esc(x.name)}</div><div class="t2">${esc(x.sub)}</div></div>`).join("")}</div>`;
}
document.addEventListener("click", e => { const c = e.target.closest("[data-go]"); if (c) go(c.dataset.go); });

const SORTS = {title: "Title", artist: "Artist", album: "Album", recent: "Recently added"};
function sortedSongs(list = L.list, by = store.get("sort", "title")) {
  const a = list.slice(), cmp = (x, y) => x.localeCompare(y, undefined, {sensitivity: "base", numeric: true});
  if (by === "artist") a.sort((x, y) => cmp(x.artist || "\uffff", y.artist || "\uffff") || cmp(x.album, y.album) || (x.track_no - y.track_no) || cmp(x.title, y.title));
  else if (by === "album") a.sort((x, y) => cmp(x.album || "\uffff", y.album || "\uffff") || (x.track_no - y.track_no) || cmp(x.title, y.title));
  else if (by === "recent") a.sort((x, y) => y.mtime - x.mtime);
  else a.sort((x, y) => cmp(x.title, y.title));
  return a;
}
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const totalTime = ts => { const s = ts.reduce((a, t) => a + (t.length_s || 0), 0); return s >= 3600 ? `${Math.floor(s / 3600)} h ${Math.floor(s / 60) % 60} min` : `${Math.round(s / 60)} min`; };

function emptyLibrary() {
  if (L.scan.running) return `<div class="empty">${ico("refresh")}Reading your music folder… ${L.scan.found || 0} songs found so far.<div class="progress-line"><div></div></div></div>`;
  return `<div class="empty">${ico("folder")}No music found yet.<br>Add the folder where your songs are in <a href="#settings" style="color:var(--accent)">Settings</a>.</div>`;
}

function render() {
  const main = $("#main"), r = route();
  for (const n of $$("[data-r]")) n.classList.toggle("active", n.dataset.r === r.name || (r.name === "artist" && n.dataset.r === "artists") || (r.name === "album" && n.dataset.r === "albums") || (r.name === "playlist" && n.dataset.r === "playlists"));
  if (!TOKEN) { main.innerHTML = `<div class="empty">${ico("gear")}Open the player with the link shown by the server<br>(it ends with <code>?t=…</code>).</div>`; return; }
  if (L.error && !L.loaded) { main.innerHTML = `<div class="empty">${ico("close")}${esc(L.error)}<br><button class="btn" onclick="L.error=null;L.tries=0;loadLibrary()" style="margin-top:12px">Try again</button></div>`; return; }
  if (!L.loaded) { main.innerHTML = `<div class="empty">${NATIVE ? "Starting MusicFlow Play…" : "Loading…"}<div class="progress-line"><div></div></div></div>`; return; }
  const q = $("#q").value.trim();
  if (q && r.name !== "settings") return renderSearch(main, q);
  (VIEWS[r.name] || VIEWS.songs)(main, r.arg);
}

const VIEWS = {
  songs(main) {
    if (!L.list.length) { main.innerHTML = emptyLibrary(); return; }
    const by = store.get("sort", "title"), list = sortedSongs();
    main.innerHTML = `<div class="head"><div class="grow"><h1>Songs</h1><div class="sub">${plural(list.length, "song")} · ${totalTime(list)}</div></div></div>
      <div class="actions"><button class="btn primary" id="a-play">${ico("play")} Play</button><button class="btn" id="a-shuf">${ico("shuffle")} Shuffle</button><span class="spacer"></span>
      <select id="a-sort" aria-label="Sort">${Object.entries(SORTS).map(([k, v]) => `<option value="${k}" ${k === by ? "selected" : ""}>${v}</option>`).join("")}</select></div><div id="list"></div>`;
    $("#a-play").onclick = () => Player.playList(list.map(t => t.id), 0, false);
    $("#a-shuf").onclick = () => Player.playList(list.map(t => t.id), 0, true);
    $("#a-sort").onchange = e => { store.set("sort", e.target.value); render(); };
    mountRows($("#list"), list, {list});
  },
  artists(main) {
    if (!L.list.length) { main.innerHTML = emptyLibrary(); return; }
    const arts = [...L.artists.values()].sort((a, b) => (a.name === UNKNOWN_ARTIST) - (b.name === UNKNOWN_ARTIST) || a.name.localeCompare(b.name, undefined, {sensitivity: "base"}));
    main.innerHTML = `<div class="head"><div class="grow"><h1>Artists</h1><div class="sub">${plural(arts.length, "artist")}</div></div></div>` +
      cardsHtml(arts.map(a => ({go: "artist/" + encodeURIComponent(a.key), cover: a.cover, icon: "person", name: a.name, sub: [a.albums.size ? plural(a.albums.size, "album") : "", plural(a.tracks.length, "song")].filter(Boolean).join(" · ")})), true);
  },
  artist(main, key) {
    const a = L.artists.get(key);
    if (!a) { main.innerHTML = `<div class="empty">${ico("person")}Artist not found.</div>`; return; }
    const songs = sortedSongs(a.tracks, "album"), albums = [...a.albums].map(k => L.albums.get(k)).filter(Boolean).sort((x, y) => (y.year || "").localeCompare(x.year || ""));
    main.innerHTML = `<div class="head"><div class="art" style="border-radius:50%">${a.cover ? artHtml(a.cover) : ico("person")}</div><div class="grow"><div class="sub">Artist</div><h1>${esc(a.name)}</h1><div class="sub">${plural(songs.length, "song")} · ${totalTime(songs)}</div></div></div>
      <div class="actions"><button class="btn primary" id="a-play">${ico("play")} Play</button><button class="btn" id="a-shuf">${ico("shuffle")} Shuffle</button><button class="btn" id="a-more">${ico("more")}</button></div>
      ${albums.length ? `<h2 class="sec">Albums</h2>` + cardsHtml(albums.map(al => ({go: "album/" + encodeURIComponent(al.key), cover: al.cover, icon: "album", name: al.name, sub: [al.year, plural(al.tracks.length, "song")].filter(Boolean).join(" · ")}))) : ""}
      <h2 class="sec">Songs</h2><div id="list"></div>`;
    const ids = songs.map(t => t.id);
    $("#a-play").onclick = () => Player.playList(ids, 0, false);
    $("#a-shuf").onclick = () => Player.playList(ids, 0, true);
    $("#a-more").onclick = e => listMenu(e.currentTarget, ids);
    mountRows($("#list"), songs, {list: songs});
  },
  albums(main) {
    if (!L.list.length) { main.innerHTML = emptyLibrary(); return; }
    const als = [...L.albums.values()].sort((a, b) => (a.name === UNKNOWN_ALBUM) - (b.name === UNKNOWN_ALBUM) || a.name.localeCompare(b.name, undefined, {sensitivity: "base", numeric: true}));
    main.innerHTML = `<div class="head"><div class="grow"><h1>Albums</h1><div class="sub">${plural(als.length, "album")}</div></div></div>` +
      cardsHtml(als.map(al => ({go: "album/" + encodeURIComponent(al.key), cover: al.cover, icon: "album", name: al.name, sub: al.name === UNKNOWN_ALBUM ? plural(al.tracks.length, "song") : [al.artist, al.year].filter(Boolean).join(" · ")})));
  },
  album(main, key) {
    const al = L.albums.get(key);
    if (!al) { main.innerHTML = `<div class="empty">${ico("album")}Album not found.</div>`; return; }
    const songs = al.tracks, numbers = al.name !== UNKNOWN_ALBUM && songs.some(t => t.track_no);
    main.innerHTML = `<div class="head"><div class="art">${al.cover ? artHtml(al.cover) : ico("album")}</div><div class="grow"><div class="sub">Album</div><h1>${esc(al.name)}</h1>
      <div class="sub">${al.artist ? `<a href="#artist/${encodeURIComponent(norm(al.artist))}" style="color:var(--ink);text-decoration:none;font-weight:600">${esc(al.artist)}</a> · ` : ""}${[al.year, plural(songs.length, "song"), totalTime(songs)].filter(Boolean).join(" · ")}</div></div></div>
      <div class="actions"><button class="btn primary" id="a-play">${ico("play")} Play</button><button class="btn" id="a-shuf">${ico("shuffle")} Shuffle</button><button class="btn" id="a-more">${ico("more")}</button></div><div id="list"></div>`;
    const ids = songs.map(t => t.id);
    $("#a-play").onclick = () => Player.playList(ids, 0, false);
    $("#a-shuf").onclick = () => Player.playList(ids, 0, true);
    $("#a-more").onclick = e => listMenu(e.currentTarget, ids);
    mountRows($("#list"), songs, {list: songs, numbers, albumArtist: al.artist});
  },
  playlists(main) {
    const fav = L.favorites.filter(id => L.tracks.has(id));
    const items = [{go: "favorites", cover: (L.tracks.get(fav.find(id => L.tracks.get(id).cover)) || {}).id, icon: "heart", name: "Favorites", sub: plural(fav.length, "song")},
      ...L.playlists.map(p => { const ok = p.tracks.filter(id => L.tracks.has(id)); return {go: "playlist/" + p.id, cover: ok.find(id => L.tracks.get(id).cover), icon: "list", name: p.name, sub: plural(ok.length, "song")}; })];
    main.innerHTML = `<div class="head"><div class="grow"><h1>Playlists</h1><div class="sub">${plural(L.playlists.length, "playlist")}</div></div></div>
      <div class="actions"><button class="btn primary" id="a-new">${ico("plus")} New playlist</button></div>` + cardsHtml(items);
    $("#a-new").onclick = () => newPlaylist([]);
  },
  playlist(main, pid) {
    const p = L.playlists.find(x => x.id === pid);
    if (!p) { main.innerHTML = `<div class="empty">${ico("list")}Playlist not found.</div>`; return; }
    const songs = p.tracks.map(id => L.tracks.get(id)).filter(Boolean), missing = p.tracks.length - songs.length;
    const cover = songs.find(t => t.cover);
    main.innerHTML = `<div class="head"><div class="art">${cover ? artHtml(cover.id) : ico("list")}</div><div class="grow"><div class="sub">Playlist</div><h1>${esc(p.name)}</h1><div class="sub">${plural(songs.length, "song")} · ${totalTime(songs)}${missing ? ` · ${missing} not found in your folders` : ""}</div></div></div>
      <div class="actions"><button class="btn primary" id="a-play">${ico("play")} Play</button><button class="btn" id="a-shuf">${ico("shuffle")} Shuffle</button>
      <button class="btn" id="a-ren">${ico("edit")} Rename</button><button class="btn danger" id="a-del">${ico("trash")} Delete</button></div><div id="list"></div>`;
    const ids = songs.map(t => t.id);
    $("#a-play").onclick = () => Player.playList(ids, 0, false);
    $("#a-shuf").onclick = () => Player.playList(ids, 0, true);
    $("#a-ren").onclick = () => askName("Rename playlist", p.name, "Rename", async name => { try { Object.assign(p, (await api("playlists/" + p.id, {name})).playlist); render(); } catch (e) { toast(e.message); } });
    $("#a-del").onclick = () => dialog("Delete playlist?", `<p class="muted" style="margin:0">“${esc(p.name)}” will be deleted. Your songs stay in the folder.</p>`, "Delete", async () => {
      try { await api("playlists/" + p.id, null, "DELETE"); L.playlists = L.playlists.filter(x => x.id !== p.id); go("playlists"); } catch (e) { toast(e.message); }
    }, true);
    if (!songs.length) { $("#list").innerHTML = `<div class="empty">${ico("list")}This playlist is empty.<br>Use ⋯ on a song, then “Add to playlist”.</div>`; return; }
    mountRows($("#list"), songs, {list: songs, ctx: p.id});
  },
  favorites(main) {
    const songs = L.favorites.map(id => L.tracks.get(id)).filter(Boolean);
    main.innerHTML = `<div class="head"><div class="grow"><h1>Favorites</h1><div class="sub">${plural(songs.length, "song")} · ${totalTime(songs)}</div></div></div>
      <div class="actions"><button class="btn primary" id="a-play">${ico("play")} Play</button><button class="btn" id="a-shuf">${ico("shuffle")} Shuffle</button></div><div id="list"></div>`;
    const ids = songs.map(t => t.id);
    $("#a-play").onclick = () => Player.playList(ids, 0, false);
    $("#a-shuf").onclick = () => Player.playList(ids, 0, true);
    if (!songs.length) { $("#list").innerHTML = `<div class="empty">${ico("heart")}No favorites yet.<br>Tap the heart next to a song.</div>`; return; }
    mountRows($("#list"), songs, {list: songs});
  },
  queue(main) {
    main.innerHTML = `<div class="head"><div class="grow"><h1>Queue</h1><div class="sub">${plural(Player.queue.length, "song")}</div></div></div>
      <div class="actions"><button class="btn" id="a-save">${ico("plus")} Save as playlist</button></div><div id="qlist">${queueHtml()}</div>`;
    $("#a-save").onclick = () => Player.queue.length ? newPlaylist(Player.queue.slice()) : toast("The queue is empty");
  },
  async settings(main) {
    let st = {};
    try { st = await api("state"); } catch (e) { main.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
    main.innerHTML = `<div class="head"><div class="grow"><h1>Settings</h1><div class="sub">MusicFlow Play ${esc(st.version)}</div></div></div>
      <div class="set"><h3>Music folders</h3><p>Songs in these folders and their subfolders are shown in the library. Files are never changed, except when you choose “Save into the file” for lyrics.</p>
        <div id="folders">${st.folders.map((f, k) => `<div class="folder">${ico("folder")}<span>${esc(f)}</span><button class="rb iconbtn" data-rm="${k}" title="Remove">${ico("close")}</button></div>`).join("") || `<p>No folder.</p>`}</div>
        <div class="addrow"><input class="text" id="f-new" placeholder="Folder path"><button class="btn" id="f-pick">${ico("folder")} Browse</button><button class="btn primary" id="f-add">Add</button></div></div>
      ${NATIVE && !NATIVE.hasAllFiles() ? `<div class="set"><h3>Lyrics files</h3><p>Android only shows music files to the player. To read the synced lyrics (<code>.lrc</code>) saved next to your songs, and to save lyrics into a file, allow access to all files.</p><button class="btn" id="f-all">Allow access to all files</button></div>` : ""}
      <div class="set"><h3>Library</h3><p>${plural(st.count, "song")}${st.scan.running ? ` · reading… ${st.scan.found} found` : ""}${st.scan.error ? ` · ${esc(st.scan.error)}` : ""}</p>
        <button class="btn" id="f-scan">${ico("refresh")} Read the folders again</button></div>
      ${NATIVE ? "" : `<div class="set"><h3>Listen on your phone</h3><p>${st.lan ? "The player is open to your Wi-Fi. Open the link printed in the server window on your phone (same Wi-Fi) and add it to the home screen. Controls stay on the lock screen and the music keeps playing in the background." : "Start the server with <code>run_lan.bat</code> (or <code>python server/app.py --lan</code>), then open the link it prints on your phone, on the same Wi-Fi."}</p></div>
      <div class="set"><h3>Keyboard</h3><p style="margin:0">Space: play/pause · ←/→: back/forward 5 s · Shift + ←/→: previous/next · L: lyrics · Q: queue · /: search</p></div>`}`;
    const save = async folders => { try { await api("folders", {folders}); toast("Reading the folders…"); L.scan.running = true; setTimeout(() => loadLibrary(true), 800); render(); } catch (e) { toast(e.message); } };
    for (const b of $$("[data-rm]")) b.onclick = () => save(st.folders.filter((_, k) => k !== +b.dataset.rm));
    $("#f-add").onclick = () => { const v = $("#f-new").value.trim(); if (v) save([...st.folders, v]); };
    $("#f-new").onkeydown = e => { if (e.key === "Enter") $("#f-add").click(); };
    $("#f-pick").onclick = () => browseFolder(f => save([...st.folders, f]));
    const all = $("#f-all"); if (all) all.onclick = () => native("requestAllFiles");
    $("#f-scan").onclick = async () => { try { await api("scan", {}); toast("Reading the folders…"); setTimeout(() => loadLibrary(true), 800); setTimeout(render, 900); } catch (e) { toast(e.message); } };
  },
};

async function removeFromPlaylist(pid, pos) {
  const p = L.playlists.find(x => x.id === pid); if (!p) return;
  const visible = p.tracks.filter(id => L.tracks.has(id)), id = visible[pos];
  const k = p.tracks.indexOf(id); if (k < 0) return;
  const tracks = p.tracks.slice(); tracks.splice(k, 1);
  try { Object.assign(p, (await api("playlists/" + pid, {tracks})).playlist); render(); toast("Removed from the playlist"); } catch (e) { toast(e.message); }
}

function renderSearch(main, q) {
  const words = norm(q).split(" ").filter(Boolean);
  const hit = s => words.every(w => s.includes(w));
  const songs = L.list.filter(t => hit(t._q)).sort((a, b) => (b._title.startsWith(words[0]) - a._title.startsWith(words[0])) || a.title.localeCompare(b.title));
  const arts = [...L.artists.values()].filter(a => hit(a.key)).slice(0, 12);
  const als = [...L.albums.values()].filter(al => al.name !== UNKNOWN_ALBUM && hit(norm(al.name + " " + al.artist))).slice(0, 12);
  if (!songs.length && !arts.length && !als.length) { main.innerHTML = `<div class="empty">${ico("search")}Nothing found for “${esc(q)}”.</div>`; return; }
  main.innerHTML = `<div class="head"><div class="grow"><h1>“${esc(q)}”</h1><div class="sub">${plural(songs.length, "song")}</div></div></div>
    ${arts.length ? `<h2 class="sec">Artists</h2>` + cardsHtml(arts.map(a => ({go: "artist/" + encodeURIComponent(a.key), cover: a.cover, icon: "person", name: a.name, sub: plural(a.tracks.length, "song")})), true) : ""}
    ${als.length ? `<h2 class="sec">Albums</h2>` + cardsHtml(als.map(al => ({go: "album/" + encodeURIComponent(al.key), cover: al.cover, icon: "album", name: al.name, sub: al.artist}))) : ""}
    ${songs.length ? `<h2 class="sec">Songs</h2><div id="list"></div>` : ""}`;
  if (songs.length) mountRows($("#list"), songs, {list: songs});
}
let searchTimer;
function searchUi() { $("#search-clear").classList.toggle("hidden", !$("#q").value); }
$("#q").addEventListener("input", () => { searchUi(); clearTimeout(searchTimer); searchTimer = setTimeout(() => { render(); $("#main").scrollTop = 0; }, 160); });
$("#q").addEventListener("keydown", e => { if (e.key === "Escape") { $("#q").value = ""; searchUi(); render(); $("#q").blur(); } if (e.key === "Enter") $("#q").blur(); });
$("#search-clear").onclick = () => { $("#q").value = ""; searchUi(); render(); };
document.addEventListener("click", e => { if (e.target.closest("[data-go]")) { $("#q").value = ""; searchUi(); } }, true);

document.addEventListener("keydown", e => {
  if (e.target.closest("input, select, textarea") || e.ctrlKey || e.metaKey || e.altKey || $("#dialog")) return;
  if (e.key === " ") { e.preventDefault(); Player.toggle(); }
  else if (e.key === "ArrowRight" && e.shiftKey) Player.next(false);
  else if (e.key === "ArrowLeft" && e.shiftKey) Player.prev();
  else if (e.key === "ArrowRight") audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
  else if (e.key === "ArrowLeft") audio.currentTime = Math.max(0, audio.currentTime - 5);
  else if (e.key === "l" || e.key === "L") $("#np").classList.contains("open") && npPane === "lyrics" ? closeNow() : openNow("lyrics");
  else if (e.key === "q" || e.key === "Q") $("#np").classList.contains("open") && npPane === "queue" ? closeNow() : openNow("queue");
  else if (e.key === "/") { e.preventDefault(); $("#q").focus(); }
  else if (e.key === "Escape") { closeMenu(); closeNow(); }
});
document.addEventListener("visibilitychange", () => { if (document.hidden) store.set("position", audio.currentTime || 0); });
window.addEventListener("pagehide", () => store.set("position", audio.currentTime || 0));

syncModeButtons(); syncMute(); render();
if (TOKEN) loadLibrary();
</script>
