// Updates, as in MusicFlow: checked at start (at most every 6 h), offered once per version, can be turned off.
const Upd = {
  info: null, ready: "",
  on() { try { return localStorage.getItem("mfp.updatesOff") !== "1"; } catch { return true; } },
  usable() { return NATIVE ? !!NATIVE.installUpdate : ["127.0.0.1", "localhost"].includes(location.hostname); },
  state(t) { const e = $("#u-state"); if (e) e.textContent = t; },
  newer(a, b) { const x = a.split(".").map(n => +n || 0), y = b.split(".").map(n => +n || 0);
    for (let i = 0; i < Math.max(x.length, y.length); i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); return false; },
  async check(auto) {
    if (!this.usable()) return;
    try { this.ready = (NATIVE && NATIVE.updateReady && NATIVE.updateReady()) || ""; } catch {}
    if (this.ready) { this.state(`Version ${this.ready} is downloaded.`); this.button(`Install ${this.ready}`); if (auto) this.offer(this.ready, ""); return; }
    if (!auto) this.state("Checking…");
    try {
      let d = null;
      try { const c = JSON.parse(localStorage.getItem("mfp.updCache") || "null"); if (auto && c && Date.now() - c.t < 6 * 3600e3) d = c.d; } catch {}
      if (!d) {
        const r = await fetch("https://api.github.com/repos/captentv1/tunedrift/releases/latest").catch(() => null);
        if (r && r.ok) { const x = await r.json(); d = {tag_name: x.tag_name, body: x.body, assets: (x.assets || []).map(a => ({name: a.name, url: a.browser_download_url}))}; }
        else d = await api("latest-version");
        try { localStorage.setItem("mfp.updCache", JSON.stringify({t: Date.now(), d})); } catch {}
      }
      const v = String(d.tag_name || "").replace(/^v/, ""), cur = Upd.version || "";
      const ext = NATIVE ? ".apk" : ".exe", file = (d.assets || []).find(a => a.name === "Tunedrift" + ext) || (d.assets || []).find(a => a.name === "MusicFlowPlay" + ext);
      if (!v || !file || !cur || !this.newer(v, cur)) { this.info = null; this.button("Check for updates"); this.state(`Up to date (${cur})`); return; }
      this.info = {v, url: file.url, notes: String(d.body || "").slice(0, 800)};
      this.button(`Update to ${v}`); this.state(`Version ${v} is available (you have ${cur}).`);
      if (auto) this.offer(v, this.info.notes);
    } catch (e) { if (!auto) this.state("Could not check for updates (no connection?)"); }
  },
  offer(v, notes) {
    try { if (localStorage.getItem("mfp.updLater") === v) return; localStorage.setItem("mfp.updLater", v); } catch {}
    if ($("#dialog")) return;
    dialog(`Tunedrift ${v} is available`, `<p class="muted" style="margin:0;white-space:pre-wrap;max-height:40vh;overflow:auto">${esc(notes || "A new version is ready.")}</p>`, "Install", () => { Upd.install(); });
  },
  button(t) { const b = $("#u-btn"); if (b) { b.textContent = t; b.classList.toggle("primary", t !== "Check for updates"); } },
  install() {
    if (this.ready) { this.ready = ""; this.state("Opening the installer… Confirm “Install”."); native("installDownloadedUpdate"); return; }
    if (!this.info) return this.check(false);
    if (NATIVE) {
      if (!NATIVE.installUpdate) { toast("Update: download Tunedrift.apk from GitHub"); return; }
      this.state("Downloading the update…"); toast(`Downloading Tunedrift ${this.info.v}…`);
      try { NATIVE.installUpdate(this.info.url); } catch (e) { this.state(`Update failed: ${e.message || e}`); toast(`Update failed: ${e.message || e}`); }
    }
    else { window.open(this.info.url, "_blank"); this.state("The new Tunedrift.exe is downloading: close this one, then open the new one."); }
  },
};

async function removeFromPlaylist(pid, pos) {
  const p = L.playlists.find(x => x.id === pid); if (!p) return;
  const visible = p.tracks.filter(id => L.tracks.has(id)), id = visible[pos];
  const k = p.tracks.indexOf(id); if (k < 0) return;
  const tracks = p.tracks.slice(); tracks.splice(k, 1);
  try { Object.assign(p, (await api("playlists/" + pid, {tracks})).playlist); render(); toast("Removed from the playlist"); } catch (e) { toast(e.message); }
}

const fmtDur = d => typeof d === "number" ? fmt(d) : String(d || "");
function localMatch(r) {
  const tt = norm(r.title || ""), aa = norm(r.uploader || "");
  return L.list.find(t => t._title === tt && (!aa || norm(t.artist || "").includes(aa.split(" ")[0]))) || null;
}
// Online search: only once the person stops typing, one at a time (a newer one replaces the one waiting), and
// answers kept, so typing never piles up searches (that made the app stall for seconds).
const ONLINE_CACHE = new Map();
const onlineKind = () => SRCH.kind === "artists" ? "artists" : "songs";
const onlineKey = q => onlineKind() + ":" + q;
let onlineTimer = 0, onlineBusy = false, onlineNext = "";
function searchOnlineSoon(q, wait) { clearTimeout(onlineTimer); onlineTimer = setTimeout(() => searchOnline(q), wait == null ? 700 : wait); }
async function searchOnline(q) {
  q = (q || "").trim(); clearTimeout(onlineTimer);
  if (!q || SRCH.scope === "local" || !mfUrl) return;
  const kind = onlineKind(), key = kind + ":" + q;
  if (!navigator.onLine) { SRCH.online = {q, kind, error: "You are offline: only your music is shown."}; return render(); }
  if (ONLINE_CACHE.has(key)) { SRCH.online = {q, kind, results: ONLINE_CACHE.get(key)}; return render(); }
  if (onlineBusy) { onlineNext = q; if (SRCH.online.q !== q || SRCH.online.kind !== kind) { SRCH.online = {q, kind, loading: true}; render(); } return; }
  onlineBusy = true; SRCH.online = {q, kind, loading: true}; render();
  try {
    const res = kind === "artists" ? (await api("online/artists?q=" + encodeURIComponent(q))).artists || [] : await MF.search(q);
    ONLINE_CACHE.set(key, res); if (ONLINE_CACHE.size > 40) ONLINE_CACHE.delete(ONLINE_CACHE.keys().next().value);
    if (SRCH.online.q === q && SRCH.online.kind === kind) SRCH.online = {q, kind, results: res};
  } catch (e) {
    const m = String(e.message || "");
    if (!(e.data && e.data.superseded) && SRCH.online.q === q && SRCH.online.kind === kind) SRCH.online = {q, kind, error: /proxy|connect|network|resolve|timed out|URLError|getaddrinfo/i.test(m)
      ? "The online search could not connect. Check the connection, then try again." : m.length > 160 ? m.slice(0, 157) + "…" : m};
  }
  onlineBusy = false;
  const next = onlineNext; onlineNext = "";
  if (next && (next !== q || onlineKind() !== kind) && $("#q").value.trim() === next) return searchOnline(next);
  if ($("#q").value.trim() === q) render();
}
// Online songs of an artist or album (MusicFlow installed): what you have plays, the rest downloads.
const ONL = {items: []};
const mbOf = d => { const p = String(d || "").split(":").map(Number); const sec = p.length > 1 ? p[0] * 60 + (p[1] || 0) : +d || 0; return sec * 40 / 1024; };
function onlineBlock(items, withArtist) {
  const base = ONL.items.length; ONL.items.push(...items);
  const miss = items.map((r, i) => base + i).filter(i => !localMatch(ONL.items[i]));
  const mb = miss.reduce((a, i) => a + mbOf(ONL.items[i].duration), 0);
  return (miss.length > 1 ? `<button class="btn" data-onlall="${miss.join(",")}" style="margin:0 0 8px">${ico("download")} Download ${miss.length} missing (≈ ${Math.round(mb)} MB)</button>` : "")
    + `<div class="rows">${items.map((r, i) => { const have = localMatch(r), k = (r.title || "") + "|" + (r.uploader || "");
    return `<div class="row orow" data-ostream="${base + i}" style="cursor:pointer" title="Play"><div class="art">${r.thumbnail ? `<img loading="lazy" src="${esc(r.thumbnail)}" alt="" onerror="this.remove()">` : ico("note")}</div>
      <div class="txt"><div class="t1">${esc(r.title || "")}</div><div class="t2">${esc([withArtist ? r.uploader : "", r.album, r.duration, r.duration ? "≈ " + mbOf(r.duration).toFixed(1) + " MB" : ""].filter(Boolean).join(" · "))}</div></div>
      ${have ? `<button class="btn" data-oplay="${have.id}">${ico("play")}<span class="hide-s">In your music</span></button>`
        : SRCH.added.has(k) ? `<button class="btn" data-r="download">${ico("download")}<span class="hide-s">Added</span></button>`
        : `<button class="btn primary" data-onl="${base + i}" title="Download">${ico("download")}<span class="hide-s">Download</span></button>`}</div>`; }).join("")}</div>`;
}
const fmtFans = n => n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + " M fans" : n >= 1e3 ? Math.round(n / 1e3) + " k fans" : plural(n, "fan");
function discographyHtml(d) {
  return `<h2 class="sec">Popular songs online</h2>${onlineBlock(d.top || [])}<h2 class="sec">Albums and singles online</h2>
      <div class="rows">${(d.albums || []).map(a => `<div><div class="row" data-oalb="${a.id}" style="cursor:pointer"><div class="art">${a.cover_art ? `<img loading="lazy" src="${esc(a.cover_art)}" alt="">` : ico("album")}</div>
        <div class="txt"><div class="t1">${esc(a.song_title)}</div><div class="t2">${esc([a.type === "single" ? "Single" : a.type === "ep" ? "EP" : "Album", (a.date || "").slice(0, 4)].filter(Boolean).join(" · "))}</div></div>${ico("down")}</div><div class="oalb-t"></div></div>`).join("")}</div>`;
}
async function artistOnline(box, name) {
  box.innerHTML = `<h2 class="sec">Online</h2><div class="muted">Searching online…</div><div class="progress-line"><div></div></div>`;
  try {
    const d = await api("online/artist?name=" + encodeURIComponent(name));
    box.innerHTML = discographyHtml(d);
  } catch (e) { box.innerHTML = `<h2 class="sec">Online</h2><div class="note">${ico("close")}<span>${esc(e.message)}</span><button class="btn" id="o-again">Try again</button></div>`; $("#o-again").onclick = () => artistOnline(box, name); }
}
function onlDownload(i, btn) {
  const r = ONL.items[i]; if (!r) return;
  MF.download(r); SRCH.added.add((r.title || "") + "|" + (r.uploader || ""));
  if (btn) { btn.outerHTML = `<button class="btn" data-r="download">${ico("download")}<span class="hide-s">Added</span></button>`; }
}
document.addEventListener("click", async e => {
  const one = e.target.closest("[data-onl]"), all = e.target.closest("[data-onlall]"), alb = e.target.closest("[data-oalb]");
  const row = e.target.closest("[data-ostream]");
  if (one) { onlDownload(+one.dataset.onl, one); toast("Downloading. It will appear in your music when it is done."); }
  else if (row && !e.target.closest("button")) {
    const rows = [...row.parentElement.querySelectorAll("[data-ostream]")];
    Player.playOnline(rows.map(x => ONL.items[+x.dataset.ostream]), rows.indexOf(row));
  }
  else if (all) {
    const ids = all.dataset.onlall.split(",").map(Number); all.disabled = true;
    for (const i of ids) onlDownload(i, document.querySelector(`[data-onl="${i}"]`));
    toast(`${ids.length} songs are downloading. Follow them in the Import tab.`);
  } else if (alb) {
    const t = alb.nextElementSibling; if (t.innerHTML) { t.innerHTML = ""; return; }
    t.innerHTML = `<div class="progress-line"><div></div></div>`;
    try { t.innerHTML = `<div style="padding:6px 0 12px 12px">${onlineBlock((await api("online/album?id=" + alb.dataset.oalb)).tracks)}</div>`; }
    catch (err) { t.innerHTML = `<div class="note">${esc(err.message)}</div>`; }
  }
});
// Browse online: Popular, each genre and popular playlists; open one to see its songs and search inside it.
const BR = {cats: null, lists: new Map()};
async function browseCats() {
  if (!BR.cats) BR.cats = await api("online/browse");
  return BR.cats;
}
async function browseList(kind, id) {
  const key = kind + ":" + (id || "");
  if (!BR.lists.has(key)) BR.lists.set(key, (await api(`online/category?kind=${kind}${id ? "&id=" + id : ""}`)).tracks || []);
  return BR.lists.get(key);
}
const onlCard = (go, img, name, sub) => `<div class="card gcard" data-go="${esc(go)}"><div class="art">${img ? `<img loading="lazy" src="${esc(img)}" alt="" onerror="this.remove()">` : ico("note")}</div>
  <div class="t1">${esc(name)}</div>${sub ? `<div class="t2">${esc(sub)}</div>` : ""}</div>`;
VIEWS.browse = async function (main, arg) {
  const [kind, id, ...rest] = (arg || "").split("/");
  let name = rest.join("/"); try { name = decodeURIComponent(name); } catch {}
  const wait = `<div class="muted">Loading…</div><div class="progress-line"><div></div></div>`;
  const fail = e => `<div class="note">${ico("close")}<span>${esc(navigator.onLine ? e.message : "You are offline.")}</span><button class="btn" data-go="${esc("browse/" + (arg || ""))}">Try again</button></div>`;
  if (!mfUrl) { main.innerHTML = `<div class="empty">${ico("search")}Browsing online needs MusicFlow, which is not ready yet.</div>`; return; }
  const here = () => route().name === "browse" && (route().arg || "") === (arg || "");
  if (!kind) {
    main.innerHTML = `<div class="head"><div class="grow"><h1>Browse online</h1><div class="sub">Popular songs, every genre and popular playlists</div></div></div>
      <div id="br-chips"></div><h2 class="sec">Popular now</h2><div id="br-top">${wait}</div><div id="br-cats"></div>`;
    browseCats().then(c => { if (!here()) return;
      $("#br-chips").innerHTML = `<div class="chips scroll"><button class="chip active" data-go="browse/popular">Popular</button>${c.genres.map(g => `<button class="chip" data-go="${esc(`browse/genre/${g.id}/${encodeURIComponent(g.name)}`)}">${esc(g.name)}</button>`).join("")}</div>`;
      $("#br-cats").innerHTML = `<h2 class="sec">Genres</h2><div class="grid">${c.genres.map(g => onlCard(`browse/genre/${g.id}/${encodeURIComponent(g.name)}`, g.image, g.name)).join("")}</div>
        ${c.playlists.length ? `<h2 class="sec">Popular playlists</h2><div class="grid">${c.playlists.map(p => onlCard(`browse/playlist/${p.id}/${encodeURIComponent(p.song_title)}`, p.cover_art, p.song_title, p.nb ? plural(p.nb, "song") : "")).join("")}</div>` : ""}`;
    }).catch(e => { if (here()) $("#br-cats").innerHTML = fail(e); });
    browseList("popular").then(t => { if (here()) $("#br-top").innerHTML = onlineBlock(t.slice(0, 10), true) + `<button class="btn" data-go="browse/popular" style="margin-top:8px">See all popular songs</button>`; })
      .catch(e => { if (here()) $("#br-top").innerHTML = fail(e); });
    return;
  }
  const title = kind === "popular" ? "Popular now" : name || (kind === "genre" ? "Genre" : "Playlist");
  main.innerHTML = `<div class="head"><div class="grow"><div class="sub"><a href="#browse" style="color:inherit">Browse online</a> · ${kind === "playlist" ? "Playlist" : kind === "genre" ? "Genre" : "Chart"}</div><h1>${esc(title)}</h1><div class="sub" id="br-n"></div></div></div>
    <div id="br-chips"></div><input class="br-find" id="br-find" type="search" placeholder="Search in ${esc(title)}" autocomplete="off"><div id="br-list">${wait}</div>`;
  if (kind !== "playlist") browseCats().then(c => { if (!here()) return;
    $("#br-chips").innerHTML = `<div class="chips scroll"><button class="chip${kind === "popular" ? " active" : ""}" data-go="browse/popular">Popular</button>${c.genres.map(g => `<button class="chip${String(g.id) === id ? " active" : ""}" data-go="${esc(`browse/genre/${g.id}/${encodeURIComponent(g.name)}`)}">${esc(g.name)}</button>`).join("")}</div>`;
    const on = $("#br-chips .chip.active"); if (on) on.scrollIntoView({inline: "center", block: "nearest"});
  }).catch(() => {});
  let all = [];
  const draw = () => {
    const words = norm($("#br-find").value).split(" ").filter(Boolean);
    const list = words.length ? all.filter(r => { const k = norm((r.title || "") + " " + (r.uploader || "") + " " + (r.album || "")); return words.every(w => k.includes(w)); }) : all;
    $("#br-n").textContent = words.length ? `${plural(list.length, "song")} of ${all.length}` : plural(all.length, "song");
    $("#br-list").innerHTML = list.length ? onlineBlock(list, true) : `<div class="muted">Nothing found in ${esc(title)}.</div>`;
  };
  $("#br-find").oninput = draw;
  try { all = await browseList(kind, id); if (here()) draw(); }
  catch (e) { if (here()) $("#br-list").innerHTML = fail(e); }
};
function renderSearch(main, q) {
  const words = norm(q).split(" ").filter(Boolean);
  const hit = s => words.every(w => s.includes(w));
  const mfOn = !!mfUrl, sc = mfOn ? SRCH.scope : "local", k = SRCH.kind, local = sc !== "online", want = x => local && (k === "all" || k === x);
  const songs = want("songs") ? L.list.filter(t => hit(t._q)).sort((a, b) => (b._title.startsWith(words[0]) - a._title.startsWith(words[0])) || a.title.localeCompare(b.title)) : [];
  const arts = want("artists") ? [...L.artists.values()].filter(a => hit(a.key)).slice(0, 12) : [];
  const als = want("albums") ? [...L.albums.values()].filter(al => al.name !== UNKNOWN_ALBUM && hit(norm(al.name + " " + al.artist))).slice(0, 12) : [];
  const fols = want("folders") ? [...(L.folders || new Map()).values()].filter(n => n.key && hit(norm(n.name))).slice(0, 12) : [];
  const nLocal = songs.length + arts.length + als.length + fols.length;
  const chip = (attr, v, label, on) => `<button class="chip${on ? " active" : ""}" ${attr}="${v}">${label}</button>`;
  const o = SRCH.online, ok = onlineKind(), mine = o.q === q && o.kind === ok;
  let online = "";
  let searching = false;
  if (sc !== "local") {
    if (!navigator.onLine) online = sc === "online" ? `<div class="note">${ico("close")}You are offline: only your music is shown.</div>` : "";
    else if (!mine || o.loading) searching = true;
    else if (o.error) online = `<div class="note">${ico("close")}<span>${esc(o.error)}</span><button class="btn" id="s-online">Try again</button></div>`;
    else if (!o.results.length) online = sc === "online" ? `<div class="muted">Nothing found online.</div>` : "";
    else if (ok === "artists") online = `<h2 class="sec">Artists online</h2><div class="grid">${o.results.map(a => `<div class="card round" data-go="${esc("oartist/" + a.id + "/" + encodeURIComponent(a.name))}">
        <div class="art">${a.photo ? `<img loading="lazy" src="${esc(a.photo)}" alt="" onerror="this.style.display='none'">` : ico("person")}</div>
        <div class="t1">${esc(a.name)}</div><div class="t2">${esc([a.fans ? fmtFans(a.fans) : "", a.albums ? plural(a.albums, "album") : ""].filter(Boolean).join(" · "))}</div></div>`).join("")}</div>`;
    else online = `<h2 class="sec">Online</h2><div class="rows">${o.results.map((r, i) => { const have = localMatch(r), key = (r.title || "") + "|" + (r.uploader || "");
      return `<div class="row orow" data-oi="${i}" style="cursor:pointer" title="Play"><div class="art">${r.thumbnail ? `<img loading="lazy" src="${esc(r.thumbnail)}" alt="" onerror="this.remove()">` : ico("note")}</div>
        <div class="txt"><div class="t1">${esc(r.title || "")}</div><div class="t2">${esc([r.uploader, r.album, fmtDur(r.duration)].filter(Boolean).join(" · "))}</div></div>
        ${have ? `<button class="btn" data-oplay="${have.id}">${ico("play")} In your music</button>`
          : SRCH.added.has(key) ? `<button class="btn" data-r="download">${ico("download")} Added</button>`
          : `<button class="btn primary" data-odl="${i}" title="Download">${ico("download")}<span class="hide-s">Download</span></button>`}</div>`; }).join("")}</div>`;
  }
  main.innerHTML = `<div class="head"><div class="grow"><h1>“${esc(q)}”</h1><div class="sub">${local ? plural(songs.length, "song") + " in your music" : "Online"}</div></div></div>
    <div class="chips mf-only">${chip("data-sscope", "all", "Everywhere", sc === "all")}${chip("data-sscope", "local", "My music", sc === "local")}${chip("data-sscope", "online", "Online", sc === "online")}<button class="chip" data-go="browse">${ico("search")} Browse categories</button></div>
    ${searching ? `<div class="progress-line slim" style="margin:0 0 10px"><div></div></div>` : ""}
    ${local ? `<div class="chips kinds">${[["all", "All"], ["songs", "Songs"], ["artists", "Artists"], ["albums", "Albums"], ["folders", "Folders"]].map(([v, l]) => chip("data-skind", v, l, k === v)).join("")}</div>`
      : `<div class="chips kinds">${[["songs", "Songs"], ["artists", "Artists"]].map(([v, l]) => chip("data-skind", v, l, ok === v)).join("")}</div>`}
    ${local && !nLocal && (sc === "local" || (mine && !o.loading && !(o.results || []).length)) ? `<div class="empty" style="padding:24px">${ico("search")}Nothing in your music for “${esc(q)}”.</div>` : ""}
    ${arts.length ? `<h2 class="sec">Artists</h2>` + cardsHtml(arts.map(a => ({go: "artist/" + encodeURIComponent(a.key), cover: a.cover, icon: "person", name: a.name, sub: plural(a.tracks.length, "song")})), true).replace('class="grid"', 'class="grid shelf"') : ""}
    ${als.length ? `<h2 class="sec">Albums</h2>` + cardsHtml(als.map(albumCard)).replace('class="grid"', 'class="grid shelf"') : ""}
    ${fols.length ? `<h2 class="sec">Folders</h2>` + folderCards(fols).replace('class="grid"', 'class="grid shelf"') : ""}
    ${songs.length ? `<h2 class="sec">Songs</h2><div id="list"></div>` : ""}
    ${online}`;
  if (songs.length) mountRows($("#list"), songs, {list: songs});
  const so = $("#s-online"); if (so) so.onclick = () => { ONLINE_CACHE.delete(onlineKey(q.trim())); SRCH.online = {}; searchOnline(q); };
  // Online results come by themselves once typing stops (from 2 letters); Enter searches at once.

}
document.addEventListener("click", e => {

});
let searchTimer;

$("#q").addEventListener("input", () => { searchUi(); clearTimeout(searchTimer); searchTimer = setTimeout(() => { render(); $("#main").scrollTop = 0; }, 160); });
$("#q").addEventListener("keydown", e => { if (e.key === "Escape") { $("#q").value = ""; searchUi(); render(); $("#q").blur(); }

document.addEventListener("keydown", e => {
  if (e.target.closest("input, select, textarea") || e.ctrlKey || e.metaKey || e.altKey || $("#dialog")) return;
  if (e.key === " ") { e.preventDefault(); Player.toggle(); }
  else if (e.key === "ArrowRight" && e.shiftKey) Player.next(false);
  else if (e.key === "ArrowLeft" && e.shiftKey) Player.prev();
  else if (e.key === "ArrowRight") audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
  else if (e.key === "ArrowLeft") audio.currentTime = Math.max(0, audio.currentTime - 5);
