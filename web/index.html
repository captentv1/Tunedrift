<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>MusicFlow Play</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{
    --bg:#000000; --panel:#10242A; --panel2:#17323A; --panel3:#1d3d46;
    --ink:#e8f6f8; --muted:#8b9aa3; --border:#24303A;
    --accent:#29E0E8; --accent-ink:#00191b; --err:#E5484D; --fav:#ff4f7b;
    --t1:rgba(41,224,232,.08); --t2:rgba(41,224,232,.16);
    --bar-h:76px; --nav-h:0px;
    --safe-b:env(safe-area-inset-bottom, 0px); --sa-t:env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
  body{background-color:transparent;background-image:radial-gradient(900px 460px at 20% -160px, var(--t2), transparent 70%),radial-gradient(700px 420px at 100% 0, var(--t1), transparent 70%);background-attachment:fixed;overflow:hidden}
  button{font:inherit;color:inherit}
  .hidden{display:none!important}
  svg.i{width:20px;height:20px;fill:currentColor;flex:0 0 auto;display:block}
  :root{--r-lg:22px;--r-md:16px;--r-sm:11px;--pill:999px;--shadow:0 14px 40px rgba(0,0,0,.35);--glass-bg:var(--panel)}

  /* Layout: a floating side panel on computers, a floating pill at the bottom on phones (as in MusicFlow). */
  #app{display:grid;grid-template-columns:248px 1fr;grid-template-rows:64px 1fr;height:100dvh;
    padding-bottom:calc(var(--bar-h) + var(--nav-h) + var(--safe-b))}
  #topbar{grid-column:2;display:flex;align-items:center;gap:10px;padding:0 24px}
  .logo{display:flex;align-items:center;gap:9px;white-space:nowrap;user-select:none;cursor:pointer;text-decoration:none;color:var(--ink)}
  .logo .wm{font-size:15px;letter-spacing:.32em;font-weight:700}
  .logo .wm span{font-weight:300;color:var(--muted)}
  .logo .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);flex:none}
  body.is-playing .logo .dot{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.6);opacity:.6}}
  .logo .tag{font-size:10px;font-weight:800;letter-spacing:.14em;padding:3px 7px;border-radius:var(--pill);background:var(--t2);color:var(--accent)}
  #topbar .logo{display:none}
  #search{flex:1;max-width:520px;position:relative}
  #search input{width:100%;height:42px;border-radius:var(--pill);border:1px solid var(--border);background:var(--panel);
    color:var(--ink);padding:0 40px 0 44px;font-size:14.5px;transition:border-color .15s,box-shadow .15s}
  #search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--t2)}
  #search input::-webkit-search-cancel-button{display:none}
  #search .i{position:absolute;left:15px;top:11px;color:var(--muted)}
  #search-clear{position:absolute;right:7px;top:7px;width:28px;height:28px;border:0;background:var(--panel2);color:var(--muted);cursor:pointer;border-radius:50%}
  .iconbtn{width:42px;height:42px;border-radius:14px;border:1px solid var(--border);background:var(--panel);color:var(--ink);
    cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .iconbtn:hover{border-color:var(--accent);color:var(--accent)}
  .iconbtn.on{color:var(--accent);border-color:var(--accent)}
  #btn-search,#search-back{display:none}
  #btn-settings{margin-left:auto}

  #side{grid-row:1/3;margin:12px 0 12px 12px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 12px;overflow:auto;display:flex;flex-direction:column}
  #side .logo{padding:2px 8px 18px;gap:7px}
  #side .logo .wm{letter-spacing:.24em;font-size:14px}
  .nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:13px;color:var(--muted);font-weight:600;
    cursor:pointer;margin-bottom:2px;user-select:none;font-size:13.5px}
  .nav:hover{background:var(--panel2);color:var(--ink)}
  .nav.active{background:var(--t2);color:var(--ink)}
  .nav.active .i{color:var(--accent)}
  .nav-h{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:16px 12px 6px;opacity:.8}

  #mf-frame{border:0;width:100%;height:100%;min-width:0;min-height:0;background:transparent;display:block}
  /* Download tab: MusicFlow full screen, as in its own app; a small button goes back to the library. */
  html.mf-full #topbar, html.mf-full #bar, html.mf-full #bottomnav, html.mf-full #side, html.mf-full #main{display:none!important}
  html.mf-full #mf-frame{position:fixed;left:0;right:0;top:var(--sa-t);bottom:var(--safe-b);width:100%;height:calc(100vh - var(--sa-t) - var(--safe-b));height:calc(100dvh - var(--sa-t) - var(--safe-b));z-index:40;background:var(--bg)}
  #mf-back{position:fixed;z-index:45;right:108px;top:calc(var(--sa-t) + 7px);width:40px;height:40px;border-radius:50%;border:1px solid var(--border);
    background:var(--panel2);color:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.35);cursor:pointer}
  #mf-back .i{width:22px;height:22px}
  html:not(.mf-full) #mf-back{display:none}

  /* Animations */
  @keyframes mfpIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes mfpPop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
  @keyframes mfpFade{from{opacity:0}to{opacity:1}}
  #main.anim>*{animation:mfpIn .3s cubic-bezier(.2,.8,.2,1) both}
  #main.anim>*:nth-child(2){animation-delay:.03s}#main.anim>*:nth-child(3){animation-delay:.06s}#main.anim>*:nth-child(n+4){animation-delay:.09s}
  #menu{animation:mfpPop .14s ease-out}#dialog .box{animation:mfpPop .18s ease-out}
  .card{transition:transform .18s ease}.card:hover{transform:translateY(-4px)}.card:active{transform:scale(.97)}
  .btn,.cb,.bn,.rb,.nav,.row,.chip{transition:transform .12s ease,background-color .15s ease,color .15s ease,border-color .15s ease}
  .btn:active,.cb:active,.bn:active,.rb:active,.chip:active{transform:scale(.92)}.row:active{transform:scale(.99)}
  .bn.active .i{animation:mfpPop .22s ease-out}
  .t2 a[data-artist]{color:inherit;text-decoration:none}.t2 a[data-artist]:hover{color:var(--accent);text-decoration:underline}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  /* Battery saver (on by default in the Android app): no blur, no endless animation. Blurs redrawn at every
     frame (glass panels over a moving list, the progress bar, the pulsing dot) kept the phone's GPU busy and hot. */
  html.lite *, html.lite *::before, html.lite *::after{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
  html.lite body.is-playing .logo .dot, html.lite body.is-playing .row.playing .eq{animation:none!important}
  html.lite #main.anim>*{animation:none!important}
  html.lite #ambient, html.lite #np .bgblur{display:none!important}
  html.lite[data-theme^="glass"] body::before{filter:none!important}
  html.lite[data-theme^="glass"] #side, html.lite[data-theme^="glass"] #bar, html.lite[data-theme^="glass"] #bottomnav,
  html.lite[data-theme^="glass"] .tile:not(.big), html.lite[data-theme^="glass"] .set{background:var(--option-bg)!important}

  #main{overflow:auto;padding:8px 28px 36px;min-width:0;overscroll-behavior:contain;position:relative;isolation:isolate}
  #ambient{position:fixed;left:0;right:0;top:0;height:460px;z-index:-1;background:center/cover no-repeat;filter:blur(70px) saturate(1.6);opacity:0;pointer-events:none;
    -webkit-mask-image:linear-gradient(#000 30%,transparent);mask-image:linear-gradient(#000 30%,transparent);transform:scale(1.2);transition:opacity .6s ease}
  #ambient.on{opacity:.5}
  .head{display:flex;align-items:flex-end;gap:22px;margin:10px 0 18px;flex-wrap:wrap}
  .head h1{margin:2px 0 0;font-size:34px;line-height:1.1;letter-spacing:-.02em;word-break:break-word;font-weight:800}
  .head .sub{color:var(--muted);margin-top:6px}
  .head .sub:first-child{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin:0}
  .head .grow{flex:1;min-width:180px}
  .head .art{width:200px;height:200px;border-radius:var(--r-lg);flex:0 0 auto;box-shadow:0 20px 50px rgba(0,0,0,.45)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
  .btn{height:40px;padding:0 18px;border-radius:var(--pill);border:1px solid var(--border);background:var(--panel);color:var(--ink);
    cursor:pointer;font-weight:650;display:inline-flex;align-items:center;gap:8px;font-size:13.5px}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 8px 22px var(--t2)}
  .btn.danger{color:var(--err);border-color:rgba(229,72,77,.45)}
  .btn .i{width:18px;height:18px}
  .actions #a-play{height:48px;padding:0 24px;font-size:15px}
  select,input.text{height:40px;border-radius:12px;border:1px solid var(--border);background:var(--panel);color:var(--ink);padding:0 12px;font:inherit}
  select option{background:var(--option-bg,var(--panel2));color:var(--ink)}
  input.text{width:100%}
  input.text:focus,select:focus{outline:none;border-color:var(--accent)}
  .spacer{flex:1}
  .muted{color:var(--muted)}
  h2.sec{font-size:19px;margin:28px 0 12px;font-weight:800;letter-spacing:-.01em}

  .art{background:var(--panel2) center/cover no-repeat;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--muted);overflow:hidden;position:relative}
  .art img{width:100%;height:100%;object-fit:cover;display:block}
  .art>.i{width:40%;height:40%;opacity:.55}

  .rows{display:flex;flex-direction:column;gap:2px}
  .row{display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:14px;cursor:pointer;min-height:60px}
  .row:hover{background:var(--panel)}
  .row.playing{background:var(--t1)}
  .row.playing .t1{color:var(--accent)}
  .row .art{width:48px;height:48px;flex:0 0 auto}
  .row .no{width:24px;text-align:right;color:var(--muted);flex:0 0 auto;font-variant-numeric:tabular-nums}
  .row .txt{flex:1;min-width:0}
  .t1{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t2{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
  .row .dur{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px;flex:0 0 auto}
  .row .rb{width:36px;height:36px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .row .rb:hover{color:var(--ink);background:var(--panel2)}
  .rb.fav-on{color:var(--fav)!important}
  .eq{display:none}
  .row.playing .eq{display:inline-block;width:14px;height:12px;margin-right:6px;vertical-align:-1px;
    background:linear-gradient(var(--accent),var(--accent)) 0 100%/3px 60% no-repeat,linear-gradient(var(--accent),var(--accent)) 5px 100%/3px 100% no-repeat,linear-gradient(var(--accent),var(--accent)) 10px 100%/3px 40% no-repeat}
  body.is-playing .row.playing .eq{animation:eq 0.9s infinite alternate}
  @keyframes eq{to{background-size:3px 30%,3px 50%,3px 90%}}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px}
  .shelf{display:grid;grid-auto-flow:column;grid-auto-columns:158px;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;margin:0 -2px;scrollbar-width:none}
  .shelf::-webkit-scrollbar{display:none}
  .shelf .card{scroll-snap-align:start}
  .card{cursor:pointer;min-width:0}
  .card .art{width:100%;aspect-ratio:1;border-radius:var(--r-md);margin-bottom:10px;box-shadow:0 10px 26px rgba(0,0,0,.28)}
  .card.round .art{border-radius:50%}
  .card .cplay{position:absolute;right:8px;bottom:8px;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.4);opacity:0;transform:translateY(8px);transition:opacity .18s,transform .18s}
  .card .cplay .i{width:20px;height:20px}
  .card:hover .cplay,.card .cplay:focus-visible{opacity:1;transform:none}
  .card.round .cplay{right:auto;left:calc(50% - 22px);bottom:8%}
  @media (hover:none){.card .cplay{opacity:1;transform:none;width:38px;height:38px}.card.round .cplay{left:calc(50% - 19px)}}
  .chips,.libtabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .chip{padding:8px 16px;border-radius:var(--pill);border:1px solid var(--border);background:var(--panel);cursor:pointer;font-weight:650;font-size:13px;white-space:nowrap;color:var(--ink)}
  .chip.on,.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .libtabs{display:none}
  .empty{padding:56px 20px;text-align:center;color:var(--muted);line-height:1.6}
  .empty > .i{width:52px;height:52px;margin:0 auto 14px;opacity:.5;display:block}
  .more{height:1px}
  .dups{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow:auto;padding-right:2px}
  .dup{border:1px solid var(--border);border-radius:var(--r-md);padding:10px;background:var(--panel)}
  .dup .dhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}.dup .dhead .art{width:40px;height:40px;flex:none}.dup .txt{min-width:0}
  .copy{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer;font-size:13px;word-break:break-all}
  .copy input{accent-color:var(--accent);flex:none}.copy .grow{flex:1;min-width:0}
  .copy .keep{font-size:11px;font-weight:800;padding:3px 8px;border-radius:var(--pill);background:var(--t2);color:var(--accent);visibility:hidden;flex:none}
  .copy:has(input:checked){background:var(--t1)}.copy:has(input:checked) .keep{visibility:visible}
  html:not(.mf-on) [data-r="download"], html:not(.mf-on) .mf-only{display:none!important}
  .note{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r-md);background:var(--panel);border:1px solid var(--border);color:var(--muted);flex-wrap:wrap}
  .note>span{flex:1;min-width:160px}
  @media (max-width:760px){.chips.kinds{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding:0 16px}.chips.kinds::-webkit-scrollbar{display:none}}
  .orow .btn{height:36px;padding:0 14px;flex:none}
  @media (max-width:760px){.orow .btn .hide-s{display:none}.orow .btn{padding:0 11px}}
  [data-r="download"][data-badge]:not([data-badge=""]){position:relative}
  [data-r="download"][data-badge]:not([data-badge=""])::after{content:attr(data-badge);position:absolute;top:4px;right:calc(50% - 22px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;
    background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .nav[data-r="download"][data-badge]:not([data-badge=""])::after{position:static;margin-left:auto}

  /* Home */
  .hello{margin:14px 0 18px}
  .hello h1{font-size:34px;margin:0;font-weight:800;letter-spacing:-.02em}
  .hello .sub{color:var(--muted);margin-top:6px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:6px}
  .tile{display:flex;align-items:center;gap:12px;padding:10px;border-radius:var(--r-md);background:var(--panel);border:1px solid var(--border);cursor:pointer;min-width:0;text-align:left;color:var(--ink)}
  .tile:hover{border-color:var(--accent)}
  .tile .art,.tile .ic{width:48px;height:48px;border-radius:12px;flex:none}
  .tile .ic{display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--accent-ink)}
  .tile.big{background:linear-gradient(135deg,var(--g1,var(--accent)),var(--g2,var(--accent)) 55%,var(--g3,var(--accent)));border:0;color:#fff;padding:16px}
  .tile.big .ic{background:rgba(255,255,255,.22);color:#fff}
  .tile.big .t2{color:rgba(255,255,255,.8)}

  #bar{position:fixed;left:272px;right:12px;bottom:calc(var(--nav-h) + var(--safe-b) + 12px);height:calc(var(--bar-h) - 12px);background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);
    display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);align-items:center;gap:16px;padding:0 16px 0 10px;z-index:30;box-shadow:var(--shadow);overflow:hidden}
  #bar .now{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer}
  #bar .now .art{width:56px;height:56px;flex:0 0 auto;border-radius:13px}
  #bar .center{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
  .ctrls{display:flex;align-items:center;gap:10px}
  .cb{width:40px;height:40px;border-radius:50%;border:0;background:none;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
  .cb:hover{background:var(--panel2)}
  .cb.dim{color:var(--muted)}
  .cb.on{color:var(--accent)}
  .cb.on::after{content:"";position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
  .cb .badge{position:absolute;top:6px;right:4px;font-size:9px;font-weight:800}
  .cb.play{width:44px;height:44px;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px var(--t2)}
  .cb.play:hover{background:var(--accent);transform:scale(1.06)}
  .seek{display:flex;align-items:center;gap:8px;width:100%;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .seek span{width:38px;flex:0 0 auto}
  .seek span:first-child{text-align:right}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:18px;background:transparent;cursor:pointer;min-width:0;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(var(--accent),var(--accent)) 0/var(--p,0%) 100% no-repeat,var(--panel3)}
  input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:var(--panel3)}
  input[type=range]::-moz-range-progress{height:5px;border-radius:3px;background:var(--accent)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--ink);margin-top:-4.5px;border:0;box-shadow:0 2px 6px rgba(0,0,0,.4)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ink);border:0}
  #bar .right{display:flex;align-items:center;justify-content:flex-end;gap:4px}
  #vol{max-width:110px}
  #bar .mini-progress{display:none}

  #bottomnav{display:none}

  #np{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;
    transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);visibility:hidden}
  #np.open{transform:none;visibility:visible}
  #np .bgblur{position:absolute;inset:-60px;background:center/cover no-repeat;filter:blur(70px) brightness(.5) saturate(1.6);z-index:-1;opacity:.95}
  #np header{display:flex;align-items:center;gap:10px;padding:calc(12px + var(--sa-t)) 18px 6px}
  #np header .iconbtn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12)}
  #np header .title{flex:1;text-align:center;font-weight:800;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.2em}
  #np .body{flex:1;display:grid;grid-template-columns:minmax(260px,460px) minmax(0,1fr);gap:48px;padding:10px 44px 28px;min-height:0;max-width:1200px;width:100%;margin:0 auto}
  #np-art,#np header{touch-action:none;cursor:pointer}
  @media (max-width:760px){#bar{touch-action:none}}
  #np .left{display:flex;flex-direction:column;justify-content:center;gap:20px;min-width:0}
  #np .left .art{width:100%;aspect-ratio:1;border-radius:26px;box-shadow:0 30px 70px rgba(0,0,0,.55);transition:transform .3s ease}
  body:not(.is-playing) #np .left .art{transform:scale(.94)}
  #np .meta{display:flex;align-items:center;gap:10px}
  #np .meta .txt{flex:1;min-width:0}
  #np .meta .t1{font-size:24px;font-weight:800;letter-spacing:-.01em}
  #np .meta .t2{font-size:15px;margin-top:5px}
  #np .meta .t2 a{color:inherit;text-decoration:none;cursor:pointer}
  #np .meta .t2 a:hover{text-decoration:underline;color:var(--ink)}
  #np .ctrls{justify-content:space-between}
  #np .cb.play{width:68px;height:68px;background:var(--ink);color:var(--bg)}

/* ---------- Library ---------- */
const L = {tracks: new Map(), list: [], artists: new Map(), albums: new Map(), favorites: [], playlists: [], loaded: false, scan: {}, tries: 0};

function albumKey(t) { return norm(t.album || UNKNOWN_ALBUM) + "\u0001" + norm(t.album ? t.album_artist : ""); }

function buildIndexes() {
  L.list = [...L.tracks.values()];
  for (const t of L.list) {
    t._q = norm([t.title, t.artist, t.album, t.album_artist].join(" "));
    t._title = norm(t.title);
  }
  L.artists = new Map();
  L.albums = new Map();
  for (const t of L.list) {
    const names = t.artists && t.artists.length ? t.artists : [UNKNOWN_ARTIST];
    for (const n of names) {
      const k = norm(n);
      if (!L.artists.has(k)) L.artists.set(k, {key: k, name: n, tracks: [], albums: new Set(), cover: null});
      const a = L.artists.get(k); a.tracks.push(t);
      if (t.album) a.albums.add(albumKey(t));
      if (!a.cover && t.cover) a.cover = t.id;
    }
    const ak = albumKey(t);
    if (!L.albums.has(ak)) L.albums.set(ak, {key: ak, name: t.album || UNKNOWN_ALBUM, artist: t.album ? t.album_artist : "", year: "", tracks: [], cover: null});
    const al = L.albums.get(ak); al.tracks.push(t);
    if (!al.cover && t.cover) al.cover = t.id;
    if (t.year && (!al.year || t.year < al.year)) al.year = t.year;
  }
  buildFolders();
  for (const al of L.albums.values()) al.tracks.sort((a, b) => (a.track_no || 999) - (b.track_no || 999) || a._title.localeCompare(b._title));
}

// Folder tree: one node per folder that holds songs (directly or below), keyed by its path under the library folders.
function buildFolders() {
  const clean = p => String(p || "").replace(/\\/g, "/").replace(/\/+$/, "");
  const roots = (L.roots || []).map(clean).sort((a, b) => b.length - a.length);
  const top = {key: "", name: "Folders", kids: new Map(), tracks: [], all: [], cover: null, parent: null};
  const nodes = new Map([["", top]]);
  for (const t of L.list) {
    const p = clean(t.path), dir = p.slice(0, p.lastIndexOf("/"));
    const root = roots.find(r => dir === r || dir.startsWith(r + "/")) ?? dir.slice(0, dir.lastIndexOf("/"));
    const parts = [root, ...(dir.length > root.length ? dir.slice(root.length + 1).split("/") : [])];
    let node = top, key = "";
    parts.forEach((part, i) => {
      key = i ? key + "/" + part : part;
      let n = nodes.get(key);
      if (!n) { n = {key, name: i ? part : (part.split("/").pop() || part), kids: new Map(), tracks: [], all: [], cover: null, parent: node}; nodes.set(key, n); node.kids.set(key, n); }
      node = n;
    });
    node.tracks.push(t); t._folder = node.key;
    for (let n = node; n; n = n.parent) { n.all.push(t); if (!n.cover && t.cover) n.cover = t.id; }
  }
  L.folders = nodes;
}
const folderOf = t => t._folder || null;
const cmpName = (x, y) => x.localeCompare(y, undefined, {sensitivity: "base", numeric: true});
function folderCards(nodes) {
  return cardsHtml(nodes.map(n => ({go: "folder/" + encodeURIComponent(n.key), cover: n.cover, icon: "folder", name: n.name,
    sub: [n.kids.size ? plural(n.kids.size, "folder") : "", plural(n.all.length, "song")].filter(Boolean).join(" · ")})));
}

// While the folders are read, a light check every 1.5 s; the whole library is reloaded only every 6 s and at the
// end (it was reloaded and redrawn every 1.5 s, and several of these loops could run at once).
function scanWatch(n = 0) {
  clearTimeout(L.scanTimer);
  L.scanTimer = setTimeout(async () => {
    let st = {}; try { st = await api("state"); } catch {}
    if (!(st.scan || {}).running || (n + 1) % 4 === 0) loadLibrary(true);
    else { L.scan = st.scan; scanWatch(n + 1); }
  }, 1500);
}
async function loadLibrary(quiet) {
  try {
    const [d, c, st] = await Promise.all([api("tracks"), api("collections"), api("state").catch(() => ({}))]);
    mfState(st);
    if (!mfUrl && ["downloading", "installed"].includes((st.module || {}).state)) mfWatch();
    L.roots = st.folders || L.roots || [];
    if (st.version && !Upd.version) { Upd.version = st.version; if (Upd.on() && !window.__testMode) setTimeout(() => Upd.check(true), 4000); }
    L.tracks = new Map(d.tracks.map(t => [t.id, t]));
    L.scan = d.scan || {};
    L.favorites = c.favorites || [];
    L.playlists = c.playlists || [];
    L.loaded = true;
    buildIndexes();
    Player.restoreIfNeeded();
    render();
    updateNow();
    if (L.scan.running) scanWatch(); else clearTimeout(L.scanTimer);
  } catch (e) {
    if (e instanceof TypeError && !L.loaded && ++L.tries < 80) { setTimeout(() => loadLibrary(quiet), 500); return; }
    L.error = e.message;
    if (!quiet) render();
  }
}

const isFav = id => L.favorites.includes(id);
async function toggleFav(id) {
  if (!id) return;
  const on = !isFav(id);
  L.favorites = on ? [id, ...L.favorites] : L.favorites.filter(x => x !== id);
  refreshFavButtons();
  try { L.favorites = (await api("favorites", {id, on})).favorites; } catch (e) { toast(e.message); }
  refreshFavButtons();
  if (route().name === "favorites") render();
}
function refreshFavButtons() {

}

/* ---------- Player ---------- */
const audio = $("#audio");
const Player = {
  queue: store.get("queue", []), original: store.get("original", null), i: store.get("index", -1),
  shuffle: store.get("shuffle", false), repeat: store.get("repeat", "off"), resumeAt: store.get("position", 0),
  errors: 0, restored: false,
  currentId() { return this.queue[this.i] || null; },
  current() { return L.tracks.get(this.currentId()) || null; },
  save() { store.set("queue", this.queue); store.set("original", this.original); store.set("index", this.i); store.set("shuffle", this.shuffle); store.set("repeat", this.repeat); },
  restoreIfNeeded() {
    if (this.restored) return;
    this.restored = true;
    const keep = this.queue.filter(id => L.tracks.has(id));
    if (keep.length !== this.queue.length) { const cur = this.currentId(); this.queue = keep; this.i = Math.max(0, keep.indexOf(cur)); if (this.original) this.original = this.original.filter(id => L.tracks.has(id)); }
    if (this.current()) { this.load(false, this.resumeAt); }
    else { this.i = this.queue.length ? 0 : -1; }
    syncModeButtons();
  },
  playList(ids, start = 0, shuffle) {
    ids = ids.filter(id => L.tracks.has(id));
    if (!ids.length) return;
    if (shuffle !== undefined) this.shuffle = shuffle;
    if (this.shuffle) {
      this.original = ids.slice();
      const first = shuffle && start === 0 ? ids[Math.floor(Math.random() * ids.length)] : ids[start];
      this.queue = [first, ...shuffled(ids.filter(x => x !== first))];
      this.i = 0;
    } else { this.original = null; this.queue = ids.slice(); this.i = start; }
    this.save(); syncModeButtons(); this.load(true);
  },
  load(autoplay, at = 0) {
    const t = this.current();
    if (!t) { audio.removeAttribute("src"); audio.load(); updateNow(); return; }
    if (this.blobUrl) { URL.revokeObjectURL(this.blobUrl); this.blobUrl = null; }
    this.blobTried = null;
    audio.src = audioUrl(t.id);
    this.pendingSeek = at > 0 ? at : 0;
    clearTimeout(this.watchdog);
    // Some Android WebViews never start a streamed M4A/FLAC/OGG file: if nothing is playable after a few
    // seconds, read the whole file and play it from memory instead (what MusicFlow does on Android).
    if (autoplay) { const id = t.id; this.watchdog = setTimeout(() => { if (this.currentId() === id && audio.readyState < 3 && !audio.error) this.playFromMemory(id, "stalled"); }, 5000); }
    if (autoplay) audio.play().catch(err => { if (err.name !== "AbortError") toast("Tap play to start"); });
    if (autoplay) store.set("recent", [t.id, ...store.get("recent", []).filter(x => x !== t.id)].slice(0, 40));
    updateNow(); loadLyrics(t);
    this.save();
  },
  async playFromMemory(id, why) {
    if (this.blobTried === id) return false;
    this.blobTried = id;
    const t = L.tracks.get(id);
    console.log("MFP_BLOB", t ? t.format : "", t ? t.title : "", why);
    try {
      const r = await fetch(audioUrl(id));
      if (!r.ok) throw new Error("HTTP " + r.status);
      const blob = await r.blob();
      if (this.currentId() !== id) return true;
      const at = audio.currentTime || this.pendingSeek || 0;
      this.blobUrl = URL.createObjectURL(blob);
      audio.src = this.blobUrl;
      this.pendingSeek = at > 0 ? at : 0;
      audio.play().catch(() => {});
    } catch (e) {
      console.log("MFP_BLOB_FAILED", e.message);
      toast(`Can't play “${t ? t.title : "this file"}”: ${e.message}`);
    }
    return true;
  },
  toggle() {
    if (!this.current()) { const ids = sortedSongs().map(t => t.id); if (ids.length) this.playList(ids, 0); return; }
    if (audio.paused) audio.play().catch(() => {}); else audio.pause();
  },
  next(auto) {
    if (!this.queue.length) return;
    if (auto && this.repeat === "one") { audio.currentTime = 0; audio.play().catch(() => {}); return; }
    if (this.i + 1 < this.queue.length) { this.i++; this.load(true); return; }
    if (this.repeat === "all") { this.i = 0; this.load(true); return; }
    if (auto) { audio.pause(); audio.currentTime = 0; this.save(); updateNow(); return; }
    this.i = 0; this.load(false);
  },
  prev() {
    if (audio.currentTime > 3 || this.i <= 0) { if (this.i <= 0 && this.repeat === "all" && audio.currentTime <= 3 && this.queue.length > 1) { this.i = this.queue.length - 1; this.load(true); return; } audio.currentTime = 0; return; }
    this.i--; this.load(true);
  },
  jump(k) { if (k >= 0 && k < this.queue.length) { this.i = k; this.load(true); } },
  setShuffle(on) {
    const cur = this.currentId();
    if (on && !this.shuffle) {
      this.original = this.queue.slice();
      const rest = this.queue.filter((_, k) => k !== this.i);
      this.queue = cur ? [cur, ...shuffled(rest)] : shuffled(rest);
      this.i = cur ? 0 : -1;
    } else if (!on && this.shuffle) {
      const base = (this.original || this.queue).filter(id => this.queue.includes(id));
      for (const id of this.queue) if (!base.includes(id)) base.push(id);
      this.queue = base; this.original = null; this.i = cur ? base.indexOf(cur) : -1;
    }
    this.shuffle = on; this.save(); syncModeButtons(); renderQueuePane(); if (route().name === "queue") render();
  },
  cycleRepeat() { this.repeat = {off: "all", all: "one", one: "off"}[this.repeat] || "off"; this.save(); syncModeButtons(); },
  playNext(ids) {
    ids = ids.filter(id => L.tracks.has(id));
    if (!ids.length) return;
    if (!this.current()) { this.playList(ids, 0); return; }
    this.queue.splice(this.i + 1, 0, ...ids);
    if (this.original) this.original.push(...ids);
    this.save(); afterQueueChange(); toast(ids.length > 1 ? `${ids.length} songs will play next` : "Will play next");
  },
  addToQueue(ids) {
    ids = ids.filter(id => L.tracks.has(id));
    if (!ids.length) return;
    if (!this.current()) { this.playList(ids, 0); return; }
    this.queue.push(...ids);
    if (this.original) this.original.push(...ids);
    this.save(); afterQueueChange(); toast(ids.length > 1 ? `${ids.length} songs added to the queue` : "Added to the queue");
  },
  removeAt(k) {
    if (k === this.i) { this.queue.splice(k, 1); if (this.i >= this.queue.length) this.i = this.queue.length - 1; this.load(!audio.paused); }
    else { this.queue.splice(k, 1); if (k < this.i) this.i--; }
    this.save(); afterQueueChange();
  },
  move(k, d) {
    const j = k + d;
    if (j < 0 || j >= this.queue.length) return;
    [this.queue[k], this.queue[j]] = [this.queue[j], this.queue[k]];
    if (this.i === k) this.i = j; else if (this.i === j) this.i = k;
    this.save(); afterQueueChange();
  },
  clearUpcoming() { this.queue = this.queue.slice(0, this.i + 1); if (this.original) this.original = this.queue.slice(); this.save(); afterQueueChange(); },
};
function shuffled(a) { a = a.slice(); for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; }
function afterQueueChange() { renderQueuePane(); if (route().name === "queue") render(); }

function syncModeButtons() {
  native("modes", !!Player.shuffle, Player.repeat || "off");
  for (const b of $$('[data-act="shuffle"]')) { b.classList.toggle("on", Player.shuffle); b.classList.toggle("dim", !Player.shuffle); b.title = Player.shuffle ? "Shuffle: on" : "Shuffle: off"; }
  for (const b of $$('[data-act="repeat"]')) {
    const r = Player.repeat; b.classList.toggle("on", r !== "off"); b.classList.toggle("dim", r === "off");
    $(".badge", b).textContent = r === "one" ? "1" : ""; b.title = {off: "Repeat: off", all: "Repeat: all", one: "Repeat: this song"}[r];
  }
}

audio.addEventListener("loadedmetadata", () => {
  if (Player.pendingSeek) { try { audio.currentTime = Math.min(Player.pendingSeek, Math.max(0, audio.duration - 1)); } catch {} Player.pendingSeek = 0; }
  updateTime(true);
});
audio.addEventListener("playing", () => { Player.errors = 0; nativeState(); });
audio.addEventListener("seeked", nativeState);
audio.addEventListener("durationchange", nativeState);
audio.addEventListener("play", () => { document.body.classList.add("is-playing"); syncPlayButtons(); nativeState(); });
audio.addEventListener("pause", () => { document.body.classList.remove("is-playing"); syncPlayButtons(); store.set("position", audio.currentTime); nativeState(); });
audio.addEventListener("ended", () => Player.next(true));
audio.addEventListener("timeupdate", () => updateTime());
audio.addEventListener("error", () => {
  if (!audio.getAttribute("src")) return;
  const t = Player.current();
  if (t && !audio.src.startsWith("blob:") && Player.blobTried !== t.id) {
    console.log("MFP_ERROR", t.format, t.title, audio.error ? audio.error.code + " " + (audio.error.message || "") : "", "→ trying from memory");
    Player.playFromMemory(t.id, "error"); return;
  }
  Player.errors++;
  const why = audio.error ? `${audio.error.code} ${audio.error.message || ""}`.trim() : "";
  console.log("MFP_ERROR", t ? t.format : "", t ? t.title : "", why);
  toast(`Can't play “${t ? t.title : "this file"}”${t ? " (" + t.format.toUpperCase() + ")" : ""}${why ? " · error " + why : ""}`);
  if (Player.errors < 4 && Player.i + 1 < Player.queue.length) setTimeout(() => Player.next(false), 1200);
});
let lastSaved = 0, lastPos = 0, loggedPlaying = "";
function updateTime(force) {
  if (document.hidden && !force) { const now = Date.now(); if (now - lastSaved > 5000) { lastSaved = now; store.set("position", audio.currentTime || 0); } return; }
  const d = audio.duration || (Player.current() || {}).length_s || 0, c = audio.currentTime || 0;
  if (NATIVE && c >= 1.5 && !audio.paused && loggedPlaying !== Player.currentId()) { loggedPlaying = Player.currentId(); const t = Player.current(); console.log("MFP_PLAYING", t ? t.format : "", t ? t.title : ""); }
  if (!seeking) for (const s of $$(".seekbar")) { s.value = d ? Math.round(c / d * 1000) : 0; s.style.setProperty("--p", (d ? c / d * 100 : 0) + "%"); }
  for (const e of $$(".seek .cur")) e.textContent = fmt(c);
  for (const e of $$(".seek .tot")) e.textContent = fmt(d);
  $("#bar .mini-progress div").style.width = (d ? c / d * 100 : 0) + "%";
  const now = Date.now();
  if (now - lastSaved > 5000) { lastSaved = now; store.set("position", c); }
  if ("mediaSession" in navigator && d && isFinite(d) && (force || Math.abs(now - lastPos) > 4000)) {
    lastPos = now;
    try { navigator.mediaSession.setPositionState({duration: d, position: Math.min(c, d), playbackRate: audio.playbackRate || 1}); } catch {}
  }
  syncLyrics(c);
}
let seeking = false;
for (const s of $$(".seekbar")) {
  s.addEventListener("input", () => { seeking = true; s.style.setProperty("--p", s.value / 10 + "%"); const d = audio.duration || 0; for (const e of $$(".seek .cur")) e.textContent = fmt(d * s.value / 1000); });
  s.addEventListener("change", () => { const d = audio.duration || 0; if (d) audio.currentTime = d * s.value / 1000; seeking = false; updateTime(true); });
}
const vol = $("#vol");
audio.volume = store.get("volume", 1);
vol.value = Math.round(audio.volume * 100); vol.style.setProperty("--p", vol.value + "%");
vol.addEventListener("input", () => { audio.volume = vol.value / 100; audio.muted = false; vol.style.setProperty("--p", vol.value + "%"); store.set("volume", audio.volume); syncMute(); });
function syncMute() { for (const b of $$('[data-act="mute"]')) b.innerHTML = ico(audio.muted || audio.volume === 0 ? "mute" : "vol"); }
function syncPlayButtons() { const p = !audio.paused; for (const b of $$('[data-act="toggle"]')) { b.innerHTML = ico(p ? "pause" : "play"); b.title = p ? "Pause" : "Play"; } if ("mediaSession" in navigator) navigator.mediaSession.playbackState = p ? "playing" : "paused"; }

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const a = b.dataset.act;
  if (a === "toggle") Player.toggle();
  else if (a === "next") Player.next(false);
  else if (a === "prev") Player.prev();
  else if (a === "shuffle") Player.setShuffle(!Player.shuffle);
  else if (a === "repeat") Player.cycleRepeat();
  else if (a === "fav") toggleFav(Player.currentId());
  else if (a === "mute") { audio.muted = !audio.muted; syncMute(); }
  else if (a === "lyrics") openNow("lyrics");
  else if (a === "queue") openNow("queue");
});

if ("mediaSession" in navigator) {
  const ms = navigator.mediaSession, h = (n, f) => { try { ms.setActionHandler(n, f); } catch {} };
  h("play", () => audio.play()); h("pause", () => audio.pause()); h("stop", () => audio.pause());
  h("previoustrack", () => Player.prev()); h("nexttrack", () => Player.next(false));
  h("seekbackward", d => { audio.currentTime = Math.max(0, audio.currentTime - (d.seekOffset || 10)); });
  h("seekforward", d => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + (d.seekOffset || 10)); });
  h("seekto", d => { if (d.fastSeek && audio.fastSeek) audio.fastSeek(d.seekTime); else audio.currentTime = d.seekTime; updateTime(true); });
}

/* ---------- Lyrics ---------- */
const Ly = {id: null, lines: [], cur: -1, userScroll: 0, data: null};
function parseLrc(text) {
  let offset = 0; const out = [];
  for (const raw of String(text || "").split(/\r?\n/)) {
    const off = raw.match(/^\s*\[offset:\s*([+-]?\d+)\s*\]/i);
    if (off) { offset = +off[1] / 1000; continue; }
    const stamps = [...raw.matchAll(/\[(\d{1,3}):(\d{2})(?:[.:](\d{1,3}))?\]/g)];
    if (!stamps.length) continue;
    const txt = raw.replace(/\[[^\]]*\]/g, "").trim();
    for (const m of stamps) out.push({t: +m[1] * 60 + +m[2] + (m[3] ? +("0." + m[3]) : 0), txt});
  }
  out.forEach(l => l.t = Math.max(0, l.t - offset));
  return out.sort((a, b) => a.t - b.t);
}
async function loadLyrics(t) {
  const box = $("#lyr");
  Ly.id = t ? t.id : null; Ly.lines = []; Ly.cur = -1; Ly.data = null;
  box.className = ""; box.innerHTML = `<div class="note">Loading lyrics…</div>`;
  if (!t) { box.innerHTML = `<div class="note">Nothing playing</div>`; return; }
  try {
    const d = await api("lyrics/" + t.id);
    if (Ly.id !== t.id) return;
    showLyrics(t, d);

// One app: the search box searches online and starts downloads through MusicFlow (kept loaded, hidden).
const MF = {
  seq: 0, waiting: new Map(), active: 0,
  async ensure() {
    if (mfUrl === undefined || mfUrl === null) { try { const st = await api("state"); mfUrl = st.musicflow || null; } catch { mfUrl = null; } }
    if (!mfUrl) return false;
    mfFrameSrc();
    for (let k = 0; k < 60 && !window.mfReady; k++) await new Promise(r => setTimeout(r, 250));
    return !!window.mfReady;
  },
  post(msg) { const fr = $("#mf-frame"); fr.contentWindow.postMessage(msg, new URL(fr.src).origin); },
  async search(q) {
    if (!await this.ensure()) throw Object.assign(new Error("The Download tab is not installed."), {noModule: true});
    const id = ++this.seq;
    return new Promise((resolve, reject) => {
      const t = setTimeout(() => { this.waiting.delete(id); reject(new Error("No answer from the online search. Try again.")); }, 45000);
      this.waiting.set(id, d => { clearTimeout(t); d.error ? reject(new Error(d.error)) : resolve(d.mfpResults || []); });
      this.post({mfpSearch: q, id, limit: 15});
    });
  },
  async download(item) { if (await this.ensure()) this.post({mfpDownload: item}); else toast("MusicFlow is not ready. Try again."); },
};

  if (route().name !== "download") return true;

  mfFrameSrc();

// Updates, as in MusicFlow: checked at start (at most every 6 h), offered once per version, can be turned off.
const Upd = {
  info: null, ready: "",
  on() { try { return localStorage.getItem("mfp.updatesOff") !== "1"; } catch { return true; } },
  usable() { return NATIVE ? !!NATIVE.installUpdate : ["127.0.0.1", "localhost"].includes(location.hostname); },
  state(t) { const e = $("#u-state"); if (e) e.textContent = t; },
  newer(a, b) { const x = a.split(".").map(n => +n || 0), y = b.split(".").map(n => +n || 0);
    for (let i = 0; i < Math.max(x.length, y.length); i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); return false; },
  async check(auto) {
    if (!this.usable()) return;
    try { this.ready = (NATIVE && NATIVE.updateReady && NATIVE.updateReady()) || ""; } catch {}
    if (this.ready) { this.state(`Version ${this.ready} is downloaded.`); this.button(`Install ${this.ready}`); if (auto) this.offer(this.ready, ""); return; }
    if (!auto) this.state("Checking…");
    try {
      let d = null;
      try { const c = JSON.parse(localStorage.getItem("mfp.updCache") || "null"); if (auto && c && Date.now() - c.t < 6 * 3600e3) d = c.d; } catch {}
      if (!d) {
        const r = await fetch("https://api.github.com/repos/captentv1/musicflow-play/releases/latest").catch(() => null);
        if (r && r.ok) { const x = await r.json(); d = {tag_name: x.tag_name, body: x.body, assets: (x.assets || []).map(a => ({name: a.name, url: a.browser_download_url}))}; }
        else d = await api("latest-version");
        try { localStorage.setItem("mfp.updCache", JSON.stringify({t: Date.now(), d})); } catch {}
      }
      const v = String(d.tag_name || "").replace(/^v/, ""), cur = Upd.version || "";
      const file = (d.assets || []).find(a => a.name === (NATIVE ? "MusicFlowPlay.apk" : "MusicFlowPlay.exe"));
      if (!v || !file || !cur || !this.newer(v, cur)) { this.info = null; this.button("Check for updates"); this.state(`Up to date (${cur})`); return; }
      this.info = {v, url: file.url, notes: String(d.body || "").slice(0, 800)};
      this.button(`Update to ${v}`); this.state(`Version ${v} is available (you have ${cur}).`);
      if (auto) this.offer(v, this.info.notes);
    } catch (e) { if (!auto) this.state("Could not check for updates (no connection?)"); }
  },
  offer(v, notes) {
    try { if (localStorage.getItem("mfp.updLater") === v) return; localStorage.setItem("mfp.updLater", v); } catch {}
    if ($("#dialog")) return;
    dialog(`MusicFlow Play ${v} is available`, `<p class="muted" style="margin:0;white-space:pre-wrap;max-height:40vh;overflow:auto">${esc(notes || "A new version is ready.")}</p>`, "Install", () => { Upd.install(); });
  },
  button(t) { const b = $("#u-btn"); if (b) { b.textContent = t; b.classList.toggle("primary", t !== "Check for updates"); } },
  install() {
    if (this.ready) { this.ready = ""; this.state("Opening the installer… Confirm “Install”."); native("installDownloadedUpdate"); return; }
    if (!this.info) return this.check(false);
    if (NATIVE) { this.state("Downloading the update… A notification says when it is ready."); native("installUpdate", this.info.url); }
    else { window.open(this.info.url, "_blank"); this.state("The new MusicFlowPlay.exe is downloading: close this one, then open the new one."); }
  },
};

async function removeFromPlaylist(pid, pos) {
  const p = L.playlists.find(x => x.id === pid); if (!p) return;
  const visible = p.tracks.filter(id => L.tracks.has(id)), id = visible[pos];
  const k = p.tracks.indexOf(id); if (k < 0) return;
  const tracks = p.tracks.slice(); tracks.splice(k, 1);
  try { Object.assign(p, (await api("playlists/" + pid, {tracks})).playlist); render(); toast("Removed from the playlist"); } catch (e) { toast(e.message); }
}

const SRCH = {scope: store.get("sscope", "all"), kind: "all", online: {}, added: new Set()};
const fmtDur = d => typeof d === "number" ? fmt(d) : String(d || "");
function localMatch(r) {
  const tt = norm(r.title || ""), aa = norm(r.uploader || "");
  return L.list.find(t => t._title === tt && (!aa || norm(t.artist || "").includes(aa.split(" ")[0]))) || null;
}
async function searchOnline(q) {
  q = (q || "").trim(); if (!q || SRCH.scope === "local" || !mfUrl) return;
  if (!navigator.onLine) { SRCH.online = {q, error: "You are offline: only your music is shown."}; return render(); }
  SRCH.online = {q, loading: true}; render();
  try { SRCH.online = {q, results: await MF.search(q)}; }
  catch (e) { const m = String(e.message || ""); SRCH.online = {q, noModule: !!e.noModule,
    error: /proxy|connect|network|resolve|timed out|URLError|getaddrinfo/i.test(m) ? "The online search could not connect. Check the connection, then try again." : m.length > 160 ? m.slice(0, 157) + "…" : m}; }
  if ($("#q").value.trim() === q) render();
}
// Online songs of an artist or album (MusicFlow installed): what you have plays, the rest downloads.
const ONL = {items: []};
const mbOf = d => { const p = String(d || "").split(":").map(Number); const sec = p.length > 1 ? p[0] * 60 + (p[1] || 0) : +d || 0; return sec * 40 / 1024; };
function onlineBlock(items) {
  const base = ONL.items.length; ONL.items.push(...items);
  const miss = items.map((r, i) => base + i).filter(i => !localMatch(ONL.items[i]));
  const mb = miss.reduce((a, i) => a + mbOf(ONL.items[i].duration), 0);
  return (miss.length > 1 ? `<button class="btn" data-onlall="${miss.join(",")}" style="margin:0 0 8px">${ico("download")} Download ${miss.length} missing (≈ ${Math.round(mb)} MB)</button>` : "")
    + `<div class="rows">${items.map((r, i) => { const have = localMatch(r), k = (r.title || "") + "|" + (r.uploader || "");
    return `<div class="row orow"><div class="art">${r.thumbnail ? `<img loading="lazy" src="${esc(r.thumbnail)}" alt="" onerror="this.remove()">` : ico("note")}</div>
      <div class="txt"><div class="t1">${esc(r.title || "")}</div><div class="t2">${esc([r.album, r.duration, r.duration ? "≈ " + mbOf(r.duration).toFixed(1) + " MB" : ""].filter(Boolean).join(" · "))}</div></div>
      ${have ? `<button class="btn" data-oplay="${have.id}">${ico("play")}<span class="hide-s">In your music</span></button>`
        : SRCH.added.has(k) ? `<button class="btn" data-r="download">${ico("download")}<span class="hide-s">Added</span></button>`
        : `<button class="btn primary" data-onl="${base + i}" title="Download">${ico("download")}<span class="hide-s">Download</span></button>`}</div>`; }).join("")}</div>`;
}

function renderSearch(main, q) {

  const mfOn = !!mfUrl, sc = mfOn ? SRCH.scope : "local", k = SRCH.kind, local = sc !== "online", want = x => local && (k === "all" || k === x);
  const songs = want("songs") ? L.list.filter(t => hit(t._q)).sort((a, b) => (b._title.startsWith(words[0]) - a._title.startsWith(words[0])) || a.title.localeCompare(b.title)) : [];
  const arts = want("artists") ? [...L.artists.values()].filter(a => hit(a.key)).slice(0, 12) : [];
  const als = want("albums") ? [...L.albums.values()].filter(al => al.name !== UNKNOWN_ALBUM && hit(norm(al.name + " " + al.artist))).slice(0, 12) : [];

    else if (!o.results.length) online = `<div class="muted">Nothing found online.</div>`;

      return `<div class="row orow" data-oi="${i}"><div class="art">${r.thumbnail ? `<img loading="lazy" src="${esc(r.thumbnail)}" alt="" onerror="this.remove()">` : ico("note")}</div>

function searchUi() { $("#search-clear").classList.toggle("hidden", !$("#q").value); }
$("#q").addEventListener("input", () => { searchUi(); clearTimeout(searchTimer); searchTimer = setTimeout(() => { render(); $("#main").scrollTop = 0; }, 160); });
$("#q").addEventListener("keydown", e => { if (e.key === "Escape") { $("#q").value = ""; searchUi(); render(); $("#q").blur(); }
  if (e.key === "Enter") { $("#q").blur(); clearTimeout(searchTimer); render(); searchOnline($("#q").value); } });
$("#search-clear").onclick = () => { $("#q").value = ""; searchUi(); render(); };
document.addEventListener("click", e => { if (e.target.closest("[data-go]")) { $("#q").value = ""; searchUi(); } }, true);

document.addEventListener("keydown", e => {
  if (e.target.closest("input, select, textarea") || e.ctrlKey || e.metaKey || e.altKey || $("#dialog")) return;
  if (e.key === " ") { e.preventDefault(); Player.toggle(); }
  else if (e.key === "ArrowRight" && e.shiftKey) Player.next(false);
  else if (e.key === "ArrowLeft" && e.shiftKey) Player.prev();
  else if (e.key === "ArrowRight") audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
  else if (e.key === "ArrowLeft") audio.currentTime = Math.max(0, audio.currentTime - 5);
  else if (e.key === "l" || e.key === "L") $("#np").classList.contains("open") && npPane === "lyrics" ? closeNow() : openNow("lyrics");
  else if (e.key === "q" || e.key === "Q") $("#np").classList.contains("open") && npPane === "queue" ? closeNow() : openNow("queue");
  else if (e.key === "/") { e.preventDefault(); $("#q").focus(); }
  else if (e.key === "Escape") { closeMenu(); closeNow(); }
});
document.addEventListener("visibilitychange", () => { if (document.hidden) store.set("position", audio.currentTime || 0); else updateTime(true); mfIdle(); });
window.addEventListener("pagehide", () => store.set("position", audio.currentTime || 0));

applyTheme(savedTheme()); syncModeButtons(); syncMute(); render();
if (TOKEN) loadLibrary();
</script>
</body>
</html>
