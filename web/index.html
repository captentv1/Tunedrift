<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Tunedrift</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{
    --bg:#000000; --panel:#10242A; --panel2:#17323A; --panel3:#1d3d46;
    --ink:#e8f6f8; --muted:#8b9aa3; --border:#24303A;
    --accent:#29E0E8; --accent-ink:#00191b; --err:#E5484D; --fav:#ff4f7b;
    --t1:rgba(41,224,232,.08); --t2:rgba(41,224,232,.16);
    --bar-h:76px; --nav-h:0px;
    --safe-b:env(safe-area-inset-bottom, 0px); --sa-t:env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
  body{background-color:transparent;background-image:radial-gradient(900px 460px at 20% -160px, var(--t2), transparent 70%),radial-gradient(700px 420px at 100% 0, var(--t1), transparent 70%);background-attachment:fixed;overflow:hidden}
  button{font:inherit;color:inherit}
  .hidden{display:none!important}
  svg.i{width:20px;height:20px;fill:currentColor;flex:0 0 auto;display:block}
  :root{--r-lg:22px;--r-md:16px;--r-sm:11px;--pill:999px;--shadow:0 14px 40px rgba(0,0,0,.35);--glass-bg:var(--panel)}

  /* Layout: a floating side panel on computers, a floating pill at the bottom on phones (as in MusicFlow). */
  #app{display:grid;grid-template-columns:248px 1fr;grid-template-rows:64px 1fr;height:100dvh;
    padding-bottom:calc(var(--bar-h) + var(--nav-h) + var(--safe-b))}
  #topbar{grid-column:2;display:flex;align-items:center;gap:10px;padding:0 24px}
  .logo{display:flex;align-items:center;gap:9px;white-space:nowrap;user-select:none;cursor:pointer;text-decoration:none;color:var(--ink)}
  .logo .wm{font-size:15px;letter-spacing:.32em;font-weight:700}
  .logo .wm span{font-weight:300;color:var(--muted)}
  .logo .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);flex:none}
  body.is-playing .logo .dot{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.6);opacity:.6}}
  .logo .tag{font-size:10px;font-weight:800;letter-spacing:.14em;padding:3px 7px;border-radius:var(--pill);background:var(--t2);color:var(--accent)}
  #topbar .logo{display:none}
  #search{flex:1;max-width:520px;position:relative}
  #search input{width:100%;height:42px;border-radius:var(--pill);border:1px solid var(--border);background:var(--panel);
    color:var(--ink);padding:0 40px 0 44px;font-size:14.5px;transition:border-color .15s,box-shadow .15s}
  #search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--t2)}
  #search input::-webkit-search-cancel-button{display:none}
  #search .i{position:absolute;left:15px;top:11px;color:var(--muted)}
  #search-clear{position:absolute;right:7px;top:7px;width:28px;height:28px;border:0;background:var(--panel2);color:var(--muted);cursor:pointer;border-radius:50%}
  .iconbtn{width:42px;height:42px;border-radius:14px;border:1px solid var(--border);background:var(--panel);color:var(--ink);
    cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .iconbtn:hover{border-color:var(--accent);color:var(--accent)}
  .iconbtn.on{color:var(--accent);border-color:var(--accent)}
  #btn-search,#search-back{display:none}
  #btn-settings{margin-left:auto}

  #side{grid-row:1/3;margin:12px 0 12px 12px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 12px;overflow:auto;display:flex;flex-direction:column}
  #side .logo{padding:2px 8px 18px;gap:7px}
  #side .logo .wm{letter-spacing:.24em;font-size:14px}
  .nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:13px;color:var(--muted);font-weight:600;
    cursor:pointer;margin-bottom:2px;user-select:none;font-size:13.5px}
  .nav:hover{background:var(--panel2);color:var(--ink)}
  .nav.active{background:var(--t2);color:var(--ink)}
  .nav.active .i{color:var(--accent)}
  .nav-h{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:16px 12px 6px;opacity:.8}

  /* Import tab: downloads, root folder and sources */
  .dl-row .t2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dl-row .st{font-size:12px;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:auto;padding-left:8px}
  .st.err{color:var(--err)}.st.ok{color:var(--accent)}
  .dl-row .bar{height:3px;border-radius:2px;background:var(--accent);margin-top:4px;transition:width .4s}
  .imp-pl{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
  .imp-pl .grow{min-width:0;flex:1}.imp-pl .t1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  textarea.text{width:100%;min-height:110px;resize:vertical;font:inherit;border-radius:12px;border:1px solid var(--border);background:var(--panel);color:var(--ink);padding:10px 12px;box-sizing:border-box}

  /* Animations */
  @keyframes mfpIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes mfpPop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
  @keyframes mfpFade{from{opacity:0}to{opacity:1}}
  #main.anim>*{animation:mfpIn .3s cubic-bezier(.2,.8,.2,1) both}
  #main.anim>*:nth-child(2){animation-delay:.03s}#main.anim>*:nth-child(3){animation-delay:.06s}#main.anim>*:nth-child(n+4){animation-delay:.09s}
  #menu{animation:mfpPop .14s ease-out}#dialog .box{animation:mfpPop .18s ease-out}
  .card{transition:transform .18s ease}.card:hover{transform:translateY(-4px)}.card:active{transform:scale(.97)}
  .btn,.cb,.bn,.rb,.nav,.row,.chip{transition:transform .12s ease,background-color .15s ease,color .15s ease,border-color .15s ease}
  .btn:active,.cb:active,.bn:active,.rb:active,.chip:active{transform:scale(.92)}.row:active{transform:scale(.99)}
  .bn.active .i{animation:mfpPop .22s ease-out}
  .t2 a[data-artist]{color:inherit;text-decoration:none}.t2 a[data-artist]:hover{color:var(--accent);text-decoration:underline}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  /* Battery saver (on by default in the Android app): no blur, no endless animation. Blurs redrawn at every
     frame (glass panels over a moving list, the progress bar, the pulsing dot) kept the phone's GPU busy and hot. */
  html.lite *, html.lite *::before, html.lite *::after{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
  html.lite body.is-playing .logo .dot, html.lite body.is-playing .row.playing .eq{animation:none!important}
  html.lite #main.anim>*{animation:none!important}
  html.lite #ambient, html.lite #np .bgblur{display:none!important}
  html.lite[data-theme^="glass"] body::before{filter:none!important}
  html.lite[data-theme^="glass"] #side, html.lite[data-theme^="glass"] #bar, html.lite[data-theme^="glass"] #bottomnav,
  html.lite[data-theme^="glass"] .tile:not(.big), html.lite[data-theme^="glass"] .set{background:var(--option-bg)!important}

  #main{overflow:auto;padding:8px 28px 36px;min-width:0;overscroll-behavior:contain;position:relative;isolation:isolate}
  #ambient{position:fixed;left:0;right:0;top:0;height:460px;z-index:-1;background:center/cover no-repeat;filter:blur(70px) saturate(1.6);opacity:0;pointer-events:none;
    -webkit-mask-image:linear-gradient(#000 30%,transparent);mask-image:linear-gradient(#000 30%,transparent);transform:scale(1.2);transition:opacity .6s ease}
  #ambient.on{opacity:.5}
  .head{display:flex;align-items:flex-end;gap:22px;margin:10px 0 18px;flex-wrap:wrap}
  .head h1{margin:2px 0 0;font-size:34px;line-height:1.1;letter-spacing:-.02em;word-break:break-word;font-weight:800}
  .head .sub{color:var(--muted);margin-top:6px}
  .head .sub:first-child{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin:0}
  .head .grow{flex:1;min-width:180px}
  .head .art{width:200px;height:200px;border-radius:var(--r-lg);flex:0 0 auto;box-shadow:0 20px 50px rgba(0,0,0,.45)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
  .btn{height:40px;padding:0 18px;border-radius:var(--pill);border:1px solid var(--border);background:var(--panel);color:var(--ink);
    cursor:pointer;font-weight:650;display:inline-flex;align-items:center;gap:8px;font-size:13.5px}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 8px 22px var(--t2)}
  .btn.danger{color:var(--err);border-color:rgba(229,72,77,.45)}
  .btn .i{width:18px;height:18px}
  .actions #a-play{height:48px;padding:0 24px;font-size:15px}
  select,input.text{height:40px;border-radius:12px;border:1px solid var(--border);background:var(--panel);color:var(--ink);padding:0 12px;font:inherit}
  select option{background:var(--option-bg,var(--panel2));color:var(--ink)}
  input.text{width:100%}
  input.text:focus,select:focus{outline:none;border-color:var(--accent)}
  .spacer{flex:1}
  .muted{color:var(--muted)}
  h2.sec{font-size:19px;margin:28px 0 12px;font-weight:800;letter-spacing:-.01em}

  .art{background:var(--panel2) center/cover no-repeat;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--muted);overflow:hidden;position:relative}
  .art img{width:100%;height:100%;object-fit:cover;display:block}
  .art>.i{width:40%;height:40%;opacity:.55}

  .rows{display:flex;flex-direction:column;gap:2px}
  .row{display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:14px;cursor:pointer;min-height:60px}
  .row:hover{background:var(--panel)}
  .row.playing{background:var(--t1)}
  .row.playing .t1{color:var(--accent)}
  .row .art{width:48px;height:48px;flex:0 0 auto}
  .row .no{width:24px;text-align:right;color:var(--muted);flex:0 0 auto;font-variant-numeric:tabular-nums}
  .row .txt{flex:1;min-width:0}
  .t1{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t2{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
  .row .dur{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px;flex:0 0 auto}
  .row .rb{width:36px;height:36px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .row .rb:hover{color:var(--ink);background:var(--panel2)}
  .rb.fav-on{color:var(--fav)!important}
  .eq{display:none}
  .row.playing .eq{display:inline-block;width:14px;height:12px;margin-right:6px;vertical-align:-1px;
    background:linear-gradient(var(--accent),var(--accent)) 0 100%/3px 60% no-repeat,linear-gradient(var(--accent),var(--accent)) 5px 100%/3px 100% no-repeat,linear-gradient(var(--accent),var(--accent)) 10px 100%/3px 40% no-repeat}
  body.is-playing .row.playing .eq{animation:eq 0.9s infinite alternate}
  @keyframes eq{to{background-size:3px 30%,3px 50%,3px 90%}}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px}
  .shelf{display:grid;grid-auto-flow:column;grid-auto-columns:158px;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;margin:0 -2px;scrollbar-width:none}
  .shelf::-webkit-scrollbar{display:none}
  .shelf .card{scroll-snap-align:start}
  .card{cursor:pointer;min-width:0}
  .card .art{width:100%;aspect-ratio:1;border-radius:var(--r-md);margin-bottom:10px;box-shadow:0 10px 26px rgba(0,0,0,.28)}
  .card.round .art{border-radius:50%}
  .card .cplay{position:absolute;right:8px;bottom:8px;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.4);opacity:0;transform:translateY(8px);transition:opacity .18s,transform .18s}
  .card .cplay .i{width:20px;height:20px}
  .card:hover .cplay,.card .cplay:focus-visible{opacity:1;transform:none}
  .card.round .cplay{right:auto;left:calc(50% - 22px);bottom:8%}
  @media (hover:none){.card .cplay{opacity:1;transform:none;width:38px;height:38px}.card.round .cplay{left:calc(50% - 19px)}}
  .chips,.libtabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .chip{padding:8px 16px;border-radius:var(--pill);border:1px solid var(--border);background:var(--panel);cursor:pointer;font-weight:650;font-size:13px;white-space:nowrap;color:var(--ink)}
  .chip.on,.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .libtabs{display:none}
  .chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-left:-2px;padding-left:2px}
  .chips.scroll::-webkit-scrollbar{display:none}
  .gcard .art{aspect-ratio:1}.gcard .art img{width:100%;height:100%;object-fit:cover}
  .br-find{width:100%;max-width:420px;padding:10px 14px;border-radius:var(--pill);border:1px solid var(--border);background:var(--panel);color:var(--ink);font:inherit;margin:0 0 12px}
  .empty{padding:56px 20px;text-align:center;color:var(--muted);line-height:1.6}
  .empty > .i{width:52px;height:52px;margin:0 auto 14px;opacity:.5;display:block}
  .more{height:1px}
  .dups{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow:auto;padding-right:2px}
  .dup{border:1px solid var(--border);border-radius:var(--r-md);padding:10px;background:var(--panel)}
  .dup .dhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}.dup .dhead .art{width:40px;height:40px;flex:none}.dup .txt{min-width:0}
  .copy{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer;font-size:13px;word-break:break-all}
  .copy input{accent-color:var(--accent);flex:none}.copy .grow{flex:1;min-width:0}
  .copy .keep{font-size:11px;font-weight:800;padding:3px 8px;border-radius:var(--pill);background:var(--t2);color:var(--accent);visibility:hidden;flex:none}
  .copy:has(input:checked){background:var(--t1)}.copy:has(input:checked) .keep{visibility:visible}
  html:not(.mf-on) .mf-only{display:none!important}
  .note{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r-md);background:var(--panel);border:1px solid var(--border);color:var(--muted);flex-wrap:wrap}
  .note>span{flex:1;min-width:160px}
  @media (max-width:760px){.chips.kinds{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding:0 16px}.chips.kinds::-webkit-scrollbar{display:none}}
  .orow .btn{height:36px;padding:0 14px;flex:none}
  @media (max-width:760px){.orow .btn .hide-s{display:none}.orow .btn{padding:0 11px}}
  [data-r="download"][data-badge]:not([data-badge=""]){position:relative}
  [data-r="download"][data-badge]:not([data-badge=""])::after{content:attr(data-badge);position:absolute;top:4px;right:calc(50% - 22px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;
    background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .nav[data-r="download"][data-badge]:not([data-badge=""])::after{position:static;margin-left:auto}

  /* Home */
  .hello{margin:14px 0 18px}
  .hello h1{font-size:34px;margin:0;font-weight:800;letter-spacing:-.02em}
  .hello .sub{color:var(--muted);margin-top:6px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:6px}
  .tile{display:flex;align-items:center;gap:12px;padding:10px;border-radius:var(--r-md);background:var(--panel);border:1px solid var(--border);cursor:pointer;min-width:0;text-align:left;color:var(--ink)}
  .tile:hover{border-color:var(--accent)}
  .tile .art,.tile .ic{width:48px;height:48px;border-radius:12px;flex:none}
  .tile .ic{display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--accent-ink)}
  .tile.big{background:linear-gradient(135deg,var(--g1,var(--accent)),var(--g2,var(--accent)) 55%,var(--g3,var(--accent)));border:0;color:#fff;padding:16px}
  .tile.big .ic{background:rgba(255,255,255,.22);color:#fff}
  .tile.big .t2{color:rgba(255,255,255,.8)}

  #bar{position:fixed;left:272px;right:12px;bottom:calc(var(--nav-h) + var(--safe-b) + 12px);height:calc(var(--bar-h) - 12px);background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);
    display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);align-items:center;gap:16px;padding:0 16px 0 10px;z-index:30;box-shadow:var(--shadow);overflow:hidden}
  #bar .now{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer}
  #bar .now .art{width:56px;height:56px;flex:0 0 auto;border-radius:13px}
  #bar .center{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
  .ctrls{display:flex;align-items:center;gap:10px}
  .cb{width:40px;height:40px;border-radius:50%;border:0;background:none;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
  .cb:hover{background:var(--panel2)}
  .cb.dim{color:var(--muted)}
  .cb.on{color:var(--accent)}
  .cb.on::after{content:"";position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
  .cb .badge{position:absolute;top:6px;right:4px;font-size:9px;font-weight:800}
  .cb.play{width:44px;height:44px;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px var(--t2)}
  .cb.play:hover{background:var(--accent);transform:scale(1.06)}
  .seek{display:flex;align-items:center;gap:8px;width:100%;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .seek span{width:38px;flex:0 0 auto}
  .seek span:first-child{text-align:right}
  .stars{display:flex;gap:6px;justify-content:center;margin:8px 0}.stars button{background:none;border:0;cursor:pointer;color:var(--muted);padding:4px}
  .stars button .i{width:34px;height:34px}.stars button.on{color:#f5b301}
  .rate-s{color:#f5b301;font-size:12px;letter-spacing:1px;margin-left:6px}
  .statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:6px 0 16px}
  .stat{padding:12px 14px;border-radius:var(--r-md);background:var(--panel);border:1px solid var(--border)}.stat b{display:block;font-size:22px}.stat span{color:var(--muted);font-size:12.5px}
  .bars{display:flex;align-items:flex-end;gap:3px;height:110px;padding:6px 0;margin-bottom:4px}.bars div{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
  .barlbl{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:14px}
  .toplist{counter-reset:n}.toplist .row .no{width:26px}
  .rule{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}.rule select,.rule input{flex:1 1 90px;min-width:0}#sm-rules .rule [data-f],#sm-rules .rule [data-op]{flex:1 1 40%}#sm-rules .rule [data-v]{flex:1 1 60%}#sm-rules .rule .rb{flex:none}
  #lyr-ctrl{display:none}
  #np.lyrfull .left,#np.lyrfull #np-tabs,#np.lyrfull .np-switch,#np.lyrfull #np-fx,#np.lyrfull #np-more{display:none!important}
  #np.lyrfull .body{grid-template-columns:1fr!important;grid-template-rows:1fr auto!important;max-width:980px}
  #np.lyrfull .right{display:flex!important;order:0!important}
  #np.lyrfull #pane-lyrics{display:block!important;mask-image:linear-gradient(transparent,#000 14%,#000 80%,transparent);-webkit-mask-image:linear-gradient(transparent,#000 14%,#000 80%,transparent)}
  #np.lyrfull #lyr{font-size:clamp(26px,6.4vw,48px);text-align:center;padding-top:26vh}
  #np.lyrfull #lyr .l{transform-origin:center}
  #np.lyrfull #lyr-ctrl{display:flex;justify-content:center;align-items:center;gap:14px;padding:8px 0 calc(6px + var(--safe-b))}
  #lyr-ctrl .cb.on{color:var(--accent)}
  #car{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;background:var(--bg,#000);color:var(--ink);padding:calc(14px + var(--sa-t,0px)) 20px calc(18px + var(--safe-b,0px))}
  #car .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(40px) brightness(.35);transform:scale(1.2);z-index:-1}

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);

const ico = (id, cls = "") => `<svg class="i ${cls}"><use href="#i-${id}"/></svg>`;
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = String(s % 60).padStart(2, "0"); return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`; };

const store = {
  get(k, d) { try { const v = localStorage.getItem("mfp." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("mfp." + k, JSON.stringify(v)); } catch {} },
};
const UNKNOWN_ARTIST = "Unknown artist", UNKNOWN_ALBUM = "Unknown album";

(function token() {
  const u = new URL(location.href), t = u.searchParams.get("t");
  if (t) { store.set("token", t); u.searchParams.delete("t"); history.replaceState(null, "", u.pathname + u.search + u.hash); }
  let fromApp = "";
  try { fromApp = window.MFPNative ? MFPNative.token() : ""; } catch {}
  window.TOKEN = window.MFP_TOKEN || fromApp || store.get("token", "");
})();

async function api(path, body, method) {
  const opt = {method: method || (body ? "POST" : "GET"), headers: {"X-MFP-Token": TOKEN}};
  if (body) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch("/api/" + path, opt);
  let data = {};
  try { data = await r.json(); } catch {}
  if (!r.ok) { const e = new Error(data.error || (r.status === 403 ? "Access refused: open the link shown on the computer that runs the player." : "Server error " + r.status)); e.status = r.status; e.data = data; throw e; }
  return data;
}
const isOnl = id => String(id || "").startsWith("o_");
const audioUrl = id => { const o = isOnl(id) && (L.tracks.get(id) || {}).online;
  return o ? `/api/online/stream?t=${encodeURIComponent(TOKEN)}&` + new URLSearchParams(/^https?:\/\/(www\.|m\.|music\.)?(youtube\.com|youtu\.be)\//.test(o.url || "") ? {url: o.url} : {title: o.title || "", artist: o.uploader || "", duration: o.duration || ""})
    : `/api/audio/${id}?t=${encodeURIComponent(TOKEN)}`; };
const coverUrl = id => isOnl(id) ? ((L.tracks.get(id) || {}).online || {}).thumbnail || "" : `/api/cover/${id}?t=${encodeURIComponent(TOKEN)}&v=${(L.tracks.get(id) || {}).mtime || 0}`;

const NATIVE = window.MFPNative || null;
const THEMES = [
  {id: "glass", name: "Glass", group: "Glass", colors: ["#2a1f5c", "#8b5cf6", "#3b82f6"]},
  {id: "glass-aurora", name: "Aurora", group: "Glass", colors: ["#3b0a24", "#f43f5e", "#f97316"]},
  {id: "glass-ocean", name: "Ocean", group: "Glass", colors: ["#042033", "#06b6d4", "#3b82f6"]},
  {id: "glass-forest", name: "Forest", group: "Glass", colors: ["#062a17", "#22c55e", "#14b8a6"]},
  {id: "glass-sunset", name: "Sunset", group: "Glass", colors: ["#3a1408", "#f97316", "#ec4899"]},
  {id: "glass-night", name: "Night", group: "Glass", colors: ["#05060f", "#312e81", "#7c3aed"]},
  {id: "glass-neon", name: "Neon", group: "Glass", colors: ["#020204", "#d946ef", "#06b6d4"]},
  {id: "glass-gold", name: "Gold", group: "Glass", colors: ["#0b0905", "#ca8a04", "#78350f"]},
  {id: "glass-light", name: "Light glass", group: "Light", colors: ["#eef2ff", "#a5b4fc", "#f9a8d4"]},
  {id: "glass-sakura", name: "Sakura", group: "Light", colors: ["#fff1f5", "#fbcfe8", "#ddd6fe"]},
  {id: "oled", name: "OLED black", group: "Minimal", colors: ["#000000", "#000000", "#1ed760"]},
  {id: "", name: "Jarvis", group: "Classic", colors: ["#000000", "#10242A", "#29E0E8"]},
  {id: "sky", name: "Sky", group: "Classic", colors: ["#070d18", "#152540", "#5AA9FF"]},
  {id: "origin", name: "Origin", group: "Classic", colors: ["#1b1b24", "#2b2b39", "#ff6d5a"]},
  {id: "white", name: "Light", group: "Classic", colors: ["#f4f6f9", "#eef2f7", "#0b6fb8"]},
  {id: "auto", name: "Automatic", group: "System", colors: ["#0c0a1f", "#8b5cf6", "#eef2ff"]},
];
const LIGHT_THEMES = ["white", "glass-light", "glass-sakura"];
function savedTheme() { try { return localStorage.getItem("mfp.theme") ?? "glass"; } catch { return "glass"; } }
function applyTheme(id) {
  const real = id === "auto" ? (matchMedia("(prefers-color-scheme: light)").matches ? "glass-light" : "glass") : id;
  if (real) document.documentElement.setAttribute("data-theme", real); else document.documentElement.removeAttribute("data-theme");
  try { localStorage.setItem("mfp.theme", id); } catch {}
  const bg = getComputedStyle(document.documentElement).getPropertyValue(real.startsWith("glass") ? "--backdrop" : "--bg").trim();
  const meta = document.querySelector('meta[name="theme-color"]'); if (meta && bg) meta.content = bg;
  if (NATIVE && NATIVE.setLightStatusBar) try { NATIVE.setLightStatusBar(LIGHT_THEMES.includes(real)); } catch {}
  for (const el of document.querySelectorAll(".theme-opt")) el.classList.toggle("active", el.dataset.theme === id);
}
try { matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => { if (savedTheme() === "auto") applyTheme("auto"); }); } catch {}
function themeChoices() {
  const cur = savedTheme();
  return THEMES.map(t => `<div class="theme-opt${t.id === cur ? " active" : ""}${parseInt(t.colors[0].slice(1, 3), 16) > 200 ? " light" : ""}" data-theme="${t.id}"><div class="tpreview" style="background:radial-gradient(70% 90% at 15% 15%, ${t.colors[1]}, transparent 70%),radial-gradient(70% 90% at 90% 80%, ${t.colors[2]}, transparent 70%),${t.colors[0]}"></div><div class="tname">${t.name}</div><div class="tgroup">${t.group}</div></div>`).join("");
}
function setTextSize(z) { document.documentElement.style.zoom = z === "1" ? "" : z; try { localStorage.setItem("mfp.textsize", z); } catch {} }
const native = (fn, ...args) => { if (NATIVE) try { NATIVE[fn](...args); } catch {} };
function nativeState() { native("playback", !audio.paused, Math.round((audio.currentTime || 0) * 1000), Math.round((isFinite(audio.duration) ? audio.duration : 0) * 1000)); }
window.MFP_cmd = (c, v) => {
  if (c === "play") { if (Player.current()) audio.play().catch(() => {}); else Player.toggle(); }
  else if (c === "pause") audio.pause();
  else if (c === "toggle") Player.toggle();
  else if (c === "shuffle") Player.setShuffle(!Player.shuffle);
  else if (c === "repeat") Player.cycleRepeat();
  else if (c === "next") Player.next(false);
  else if (c === "prev") Player.prev();
  else if (c === "seek") { audio.currentTime = Math.max(0, v / 1000); updateTime(true); nativeState(); }
  else if (c === "fav") toggleFav(Player.currentId());
};
// Android Auto: the item picked in the car (a song, a playlist, a mix…), in the form kind:id[:index]
window.MFP_auto = what => {
  if (!L.loaded) { widgetWant = null; setTimeout(() => window.MFP_auto(what), 1000); return; }
  const [kind, id, k] = String(what).split(":");
  const list = kind === "shuffle" ? shuffled(L.list) : kind === "fav" ? L.favorites.map(x => L.tracks.get(x)).filter(Boolean)
    : kind === "pl" ? playlistTracks(L.playlists.find(p => p.id === id) || {tracks: []}) : kind === "mix" ? mixTracks(id) : [];
  if (kind === "song" && L.tracks.has(id)) return Player.playList([id], 0, false);
  if (list.length) Player.playList(list.map(t => t.id), Math.max(0, Math.min(list.length - 1, +k || 0)), kind === "shuffle" ? false : undefined);
};
window.MFP_autoSearch = q => {
  const w = norm(q).split(" ").filter(Boolean); if (!w.length) return window.MFP_auto("shuffle:");
  const hit = L.list.filter(t => w.every(x => t._q.includes(x)));
  if (hit.length) Player.playList(hit.map(t => t.id), 0, false); else toast(`Nothing found for “${q}”`);
};
// Home screen widgets: their shortcuts open the app with an action, done once the library is there.
let widgetWant = null;
window.MFP_widget = a => {
  if (!L.loaded) { widgetWant = a; return; }
  const ids = ts => ts.map(t => t.id);
  if (a === "play") { if (audio.paused) Player.toggle(); }
  else if (a === "shuffleall") Player.playList(ids(L.list), 0, true);
  else if (a === "favorites") { const f = L.favorites.filter(id => L.tracks.has(id)); if (f.length) Player.playList(f, 0, true); go("favorites"); }
  else if (a === "mixtop" || a === "mixnew") { const k = a.slice(3), t = mixTracks(k); if (t.length) Player.playList(ids(t), 0, false); go("mix/" + k); }
  else if (a === "queue") { openNow("queue"); }
  else if (a === "car") { carMode(true); }
};
let widgetSent = "";
function syncWidget() {
  if (!NATIVE || !NATIVE.widgetInfo) return;
  const id = Player.currentId(), next = Player.queue.slice(Player.i + 1, Player.i + 4).map(x => L.tracks.get(x)).filter(Boolean).map(t => `${t.title} · ${t.artist || UNKNOWN_ARTIST}`);
  const key = (id && isFav(id) ? "1" : "0") + next.join("\n");
  if (key === widgetSent) return;
  widgetSent = key; native("widgetInfo", !!(id && isFav(id)), next.join("\n"));
}
async function useFolder(folder, replace) {
  try {
    const st = await api("state");
    await api("folders", {folders: replace ? [folder] : [...st.folders, folder]});
    toast("Reading the folder…"); L.scan.running = true; setTimeout(() => loadLibrary(true), 800); render();
  } catch (e) { toast(e.message); }
}
let pickReplaces = false;
function pickFolder(replace) {
  pickReplaces = !!replace; folderCb = null;
  if (NATIVE && NATIVE.pickFolder) NATIVE.pickFolder(); else browseFolder(f => useFolder(f, pickReplaces));
}
let folderCb = null;
function chooseFolder(cb) { folderCb = cb; if (NATIVE && NATIVE.pickFolder) NATIVE.pickFolder(); else browseFolder(f => { folderCb = null; cb(f); }); }
window.MFP_folderPicked = folder => { const cb = folderCb; folderCb = null; if (cb) { if (folder) cb(folder); else toast("This folder can't be used: pick one in the phone's storage or on the SD card."); return; } if (folder) useFolder(folder, pickReplaces); else toast("This folder can't be used: pick one in the phone's storage or on the SD card."); };
window.MFP_rescan = async () => { try { await api("scan", {}); } catch {} L.scan.running = true; setTimeout(() => loadLibrary(true), 700); if (route().name === "settings") setTimeout(render, 900); };

let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600); }

/* ---------- Library ---------- */
const L = {tracks: new Map(), list: [], artists: new Map(), albums: new Map(), favorites: [], playlists: [], ratings: {}, plays: {}, follows: [], loaded: false, scan: {}, tries: 0};

function albumKey(t) { return norm(t.album || UNKNOWN_ALBUM) + "\u0001" + norm(t.album ? t.album_artist : ""); }

function buildIndexes() {
  L.list = [...L.tracks.values()].filter(t => !t.online);
  for (const t of L.list) {
    t._q = norm([t.title, t.artist, t.album, t.album_artist].join(" "));
    t._title = norm(t.title);
  }
  L.artists = new Map();
  L.albums = new Map();
  for (const t of L.list) {
    const names = t.artists && t.artists.length ? t.artists : [UNKNOWN_ARTIST];
    for (const n of names) {
      const k = norm(n);
      if (!L.artists.has(k)) L.artists.set(k, {key: k, name: n, tracks: [], albums: new Set(), cover: null});
      const a = L.artists.get(k); a.tracks.push(t);
      if (t.album) a.albums.add(albumKey(t));
      if (!a.cover && t.cover) a.cover = t.id;
    }
    const ak = albumKey(t);
    if (!L.albums.has(ak)) L.albums.set(ak, {key: ak, name: t.album || UNKNOWN_ALBUM, artist: t.album ? t.album_artist : "", year: "", tracks: [], cover: null});
    const al = L.albums.get(ak); al.tracks.push(t);
    if (!al.cover && t.cover) al.cover = t.id;
    if (t.year && (!al.year || t.year < al.year)) al.year = t.year;
  }
  buildFolders();
  for (const al of L.albums.values()) al.tracks.sort((a, b) => (a.track_no || 999) - (b.track_no || 999) || a._title.localeCompare(b._title));
}

// Folder tree: one node per folder that holds songs (directly or below), keyed by its path under the library folders.
function buildFolders() {
  const clean = p => String(p || "").replace(/\\/g, "/").replace(/\/+$/, "");
  const roots = (L.roots || []).map(clean).sort((a, b) => b.length - a.length);
  const top = {key: "", name: "Folders", kids: new Map(), tracks: [], all: [], cover: null, parent: null};
  const nodes = new Map([["", top]]);
  for (const t of L.list) {
    const p = clean(t.path), dir = p.slice(0, p.lastIndexOf("/"));
    const root = roots.find(r => dir === r || dir.startsWith(r + "/")) ?? dir.slice(0, dir.lastIndexOf("/"));
    const parts = [root, ...(dir.length > root.length ? dir.slice(root.length + 1).split("/") : [])];
    let node = top, key = "";
    parts.forEach((part, i) => {
      key = i ? key + "/" + part : part;
      let n = nodes.get(key);
      if (!n) { n = {key, name: i ? part : (part.split("/").pop() || part), kids: new Map(), tracks: [], all: [], cover: null, parent: node}; nodes.set(key, n); node.kids.set(key, n); }
      node = n;
    });
    node.tracks.push(t); t._folder = node.key;
    for (let n = node; n; n = n.parent) { n.all.push(t); if (!n.cover && t.cover) n.cover = t.id; }
  }
  L.folders = nodes;
}
const folderOf = t => t._folder || null;
const cmpName = (x, y) => x.localeCompare(y, undefined, {sensitivity: "base", numeric: true});
function folderCards(nodes) {
  return cardsHtml(nodes.map(n => ({go: "folder/" + encodeURIComponent(n.key), cover: n.cover, icon: "folder", name: n.name,
    sub: [n.kids.size ? plural(n.kids.size, "folder") : "", plural(n.all.length, "song")].filter(Boolean).join(" · ")})));
}

// While the folders are read, a light check every 1.5 s; the whole library is reloaded only every 6 s and at the
// end (it was reloaded and redrawn every 1.5 s, and several of these loops could run at once).
function scanWatch(n = 0) {
  clearTimeout(L.scanTimer);
  L.scanTimer = setTimeout(async () => {
    let st = {}; try { st = await api("state"); } catch {}
    if (!(st.scan || {}).running || (n + 1) % 4 === 0) loadLibrary(true);
    else { L.scan = st.scan; scanWatch(n + 1); }
  }, 1500);
}
async function loadLibrary(quiet) {
  try {
    const [d, c, st, pl] = await Promise.all([api("tracks"), api("collections"), api("state").catch(() => ({})), api("plays").catch(() => null)]);
    if (pl) L.plays = pl.counts || {};
    L.ratings = c.ratings || {}; L.follows = c.follows || [];
    mfState(st);
    L.roots = st.folders || L.roots || [];
    if (st.version && !Upd.version) {
      Upd.version = st.version; checkWhatsNew(st.version); if (Upd.on() && !window.__testMode) setTimeout(() => Upd.check(true), 4000);
      if (!window.__testMode) setTimeout(() => api("import/spotify?warm=1").catch(() => {}), 8000);
    }
    L.tracks = new Map([...d.tracks.map(t => [t.id, t]), ...[...L.tracks.values()].filter(t => t.online).map(t => [t.id, t])]);
    L.scan = d.scan || {};
    L.favorites = c.favorites || [];
    L.playlists = c.playlists || [];
    L.loaded = true;
    if (!window.__booted) {
      window.__booted = true;
      setTimeout(() => {
        try {
          localStorage.setItem("mfp.boots", "0");
          if (localStorage.getItem("mfp.safe")) { localStorage.removeItem("mfp.safe"); toast("The app did not start well: the theme is back to Glass"); }
        } catch {}
      }, 4000);
    }
    buildIndexes();
    Player.restoreIfNeeded();
    render();
    updateNow();
    if (widgetWant) { const w = widgetWant; widgetWant = null; setTimeout(() => window.MFP_widget(w), 300); }
    // Started in the background by a widget or the notification (app closed): do what was asked.
    try {
      const p = NATIVE && NATIVE.takePending ? NATIVE.takePending() : "";
      if (p) setTimeout(() => { const [k, a] = p.split(":"); if (k === "widget") window.MFP_widget(a); else window.MFP_cmd(a, 0); }, 300);
    } catch (e) { console.log("pending", e); }
    if (L.scan.running) scanWatch(); else clearTimeout(L.scanTimer);
  } catch (e) {
    if (e instanceof TypeError && !L.loaded && ++L.tries < 80) { setTimeout(() => loadLibrary(quiet), 500); return; }
    L.error = e.message;
    if (!quiet) render();
  }
}

const isFav = id => L.favorites.includes(id);
async function toggleFav(id) {

const Ly = {id: null, lines: [], cur: -1, userScroll: 0, data: null};
function parseLrc(text) {
  let offset = 0; const out = [];
  for (const raw of String(text || "").split(/\r?\n/)) {
    const off = raw.match(/^\s*\[offset:\s*([+-]?\d+)\s*\]/i);
    if (off) { offset = +off[1] / 1000; continue; }
    const stamps = [...raw.matchAll(/\[(\d{1,3}):(\d{2})(?:[.:](\d{1,3}))?\]/g)];
    if (!stamps.length) continue;
    const txt = raw.replace(/\[[^\]]*\]/g, "").trim();
    for (const m of stamps) out.push({t: +m[1] * 60 + +m[2] + (m[3] ? +("0." + m[3]) : 0), txt});
  }
  out.forEach(l => l.t = Math.max(0, l.t - offset));
  return out.sort((a, b) => a.t - b.t);
}

  if (t.online) { box.innerHTML = `<div class="note">Playing online. Download the song to get its lyrics.</div>`; return; }
  try {
    const d = await api("lyrics/" + t.id);
    if (Ly.id !== t.id) return;
    showLyrics(t, d);

}

  }

// Touch gestures. Mini player: swipe up opens the player, left/right = next/previous.
// Cover in the player: left/right = next/previous, up or double tap = lyrics, down = close, one tap = next song.
let lastSwipe = 0;
function swipe(el, handlers) {
  let x0 = 0, y0 = 0, t0 = 0, id = null, taps = 0, tapTimer = 0;
  el.addEventListener("pointerdown", e => { if (e.pointerType === "mouse") return; id = e.pointerId; x0 = e.clientX; y0 = e.clientY; t0 = Date.now(); });
  el.addEventListener("pointercancel", () => { id = null; });
  el.addEventListener("pointerup", e => {
    if (e.pointerId !== id) return; id = null;
    const dx = e.clientX - x0, dy = e.clientY - y0, ax = Math.abs(dx), ay = Math.abs(dy);
    if (Math.max(ax, ay) > 45 && Date.now() - t0 < 800) {
      lastSwipe = Date.now();
      const dir = ax > ay ? (dx < 0 ? "left" : "right") : (dy < 0 ? "up" : "down");
      if (handlers[dir]) handlers[dir]();
      return;
    }
    if (ax < 12 && ay < 12 && (handlers.tap || handlers.doubletap)) {
      if (e.target.closest("button,input,a")) return;
      lastSwipe = Date.now();
      if (++taps === 2) { clearTimeout(tapTimer); taps = 0; if (handlers.doubletap) handlers.doubletap(); return; }
      tapTimer = setTimeout(() => { taps = 0; if (handlers.tap) handlers.tap(); }, handlers.doubletap ? 280 : 0);
    }
  });
}

// Duplicates: the same song (title, artist, album and length) saved in more than one place. The copy to keep is the

const LOSSLESS = ["flac", "wav", "alac", "aiff"];

const dupTitle = s => norm(String(s || "").replace(/\s*[([]([^)\]]*)[)\]]/g, (m, x) => /remix|mix|live|edit|version|acoustic|instrumental|demo|remaster|karaok|cover|reprise|extended|radio/i.test(x) ? m : "")

    if (!groups.has(k)) groups.set(k, []); groups.get(k).push(t);

  const score = t => (t.lrc || t.lyrics ? 4 : 0) + (LOSSLESS.includes(String(t.format || "").toLowerCase()) ? 2 : 0) + (t.cover ? 1 : 0);
  return [...groups.values()].filter(g => g.length > 1).map(g => g.sort((a, b) => score(b) - score(a) || (b.size_bytes || 0) - (a.size_bytes || 0) || (a.mtime || 0) - (b.mtime || 0)));

    <div class="dups">${groups.map((g, gi) => `<div class="dup" data-g="${gi}"><div class="dhead"><div class="art">${artHtml(g.find(t => t.cover)?.id)}</div><div class="txt"><div class="t1">${esc(g[0].title)}</div><div class="t2">${esc([g[0].artist, g[0].album].filter(Boolean).join(" · "))}</div></div></div>

// Smart playlists: songs chosen by rules, updated by themselves -------------------------------------------------
const RULE_FIELDS = {
  title: ["Title", "text"], artist: ["Artist", "text"], album: ["Album", "text"], genre: ["Genre", "text"], folder: ["Folder", "text"], format: ["Format", "text"],
  year: ["Year", "num"], length: ["Length (min)", "num"], rating: ["Stars", "num"], plays: ["Plays", "num"],
  played: ["Last played", "date"], added: ["Added", "date"], favorite: ["Favorite", "bool"],
};
const RULE_OPS = {text: [["has", "contains"], ["lacks", "does not contain"], ["is", "is"], ["not", "is not"]], num: [["gt", "more than"], ["lt", "less than"], ["is", "is"]],
  date: [["within", "in the last (days)"], ["before", "not in the last (days)"]], bool: [["is", "is"]]};
function ruleValue(t, f) {
  switch (f) {
    case "title": return t.title; case "artist": return (t.artists || []).join(" ") + " " + (t.artist || ""); case "album": return t.album; case "genre": return t.genre;
    case "folder": return t.path; case "format": return t.format;
    case "year": return t.year || 0; case "length": return (t.length_s || 0) / 60; case "rating": return stars(t.id); case "plays": return plays(t.id);
    case "played": return lastPlayed(t.id); case "added": return t.mtime || 0; case "favorite": return isFav(t.id);
  }
  return "";
}
function ruleOk(t, r) {
  const kind = (RULE_FIELDS[r.f] || [])[1], v = ruleValue(t, r.f);
  if (kind === "text") { const a = norm(v), b = norm(r.v); return r.op === "has" ? a.includes(b) : r.op === "lacks" ? !a.includes(b) : r.op === "is" ? a === b : a !== b; }
  if (kind === "num") { const b = parseFloat(String(r.v).replace(",", ".")) || 0; return r.op === "gt" ? v > b : r.op === "lt" ? v < b : Math.round(v) === Math.round(b); }
  if (kind === "date") { const since = nowS() - (parseFloat(r.v) || 0) * DAY; return r.op === "within" ? v >= since : v < since; }
  if (kind === "bool") return v === (r.v !== "no");
  return true;
}
function smartTracks(p) {
  const R = p.rules || {}, rules = R.rules || [];
  let list = L.list.filter(t => !rules.length || (R.match === "any" ? rules.some(r => ruleOk(t, r)) : rules.every(r => ruleOk(t, r))));
  list = R.sort === "random" ? shuffled(list) : sortedSongs(list, R.sort || "title");
  return R.limit ? list.slice(0, R.limit) : list;
}
const playlistTracks = p => p.rules ? smartTracks(p) : p.tracks.map(id => L.tracks.get(id)).filter(Boolean);
function smartEditor(p) {

    return `<div class="rule" data-k="${k}"><select data-f>${Object.entries(RULE_FIELDS).map(([f, [l]]) => `<option value="${f}"${f === r.f ? " selected" : ""}>${l}</option>`).join("")}</select>
      <select data-op>${RULE_OPS[kind].map(([o, l]) => `<option value="${o}"${o === r.op ? " selected" : ""}>${l}</option>`).join("")}</select>
      ${kind === "bool" ? `<select data-v><option value="yes"${r.v !== "no" ? " selected" : ""}>yes</option><option value="no"${r.v === "no" ? " selected" : ""}>no</option></select>` : `<input class="text" data-v value="${esc(r.v)}" inputmode="${kind === "text" ? "text" : "decimal"}">`}
      <button class="rb iconbtn" data-del title="Remove">${ico("close")}</button></div>`; };
  const body = () => `<input class="text" id="sm-name" maxlength="120" placeholder="Name" value="${esc(p ? p.name : "My smart playlist")}">
    <p style="margin:12px 0 4px">Songs that match <select id="sm-match"><option value="all"${R.match !== "any" ? " selected" : ""}>all the rules</option><option value="any"${R.match === "any" ? " selected" : ""}>any rule</option></select></p>
    <div id="sm-rules">${R.rules.map(ruleHtml).join("")}</div><button class="btn" id="sm-add">${ico("plus")} Add a rule</button>
    <div class="rule" style="margin-top:12px"><span>Order</span><select id="sm-sort">${[["plays", "Most played"], ["played", "Recently played"], ["rating", "Rating"], ["recent", "Recently added"], ["title", "Title"], ["artist", "Artist"], ["year", "Year"], ["random", "Random"]].map(([v, l]) => `<option value="${v}"${R.sort === v ? " selected" : ""}>${l}</option>`).join("")}</select>

// Listening statistics and history -------------------------------------------------------------------------------
async function statsView(main, period) {
  period = ["week", "month", "year", "all"].includes(period) ? period : "week";
  const span = {week: 7, month: 30, year: 365, all: 0}[period], since = span ? nowS() - span * DAY : 0;
  main.innerHTML = `<div class="head"><div class="grow"><h1>Your listening</h1><div class="sub">Statistics and history</div></div></div>
    <div class="chips" style="margin-bottom:14px">${[["week", "7 days"], ["month", "30 days"], ["year", "12 months"], ["all", "All time"]].map(([v, l]) => `<button class="chip${v === period ? " active" : ""}" data-go="stats/${v}">${l}</button>`).join("")}</div>
    <div id="st-box"><div class="progress-line"><div></div></div></div>`;
  let d; try { d = await api("plays?since=" + since); } catch (e) { $("#st-box").innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  if (route().name !== "stats") return;
  L.plays = d.counts || L.plays;
  const log = d.log || [];
  const songN = new Map(), artN = new Map(), genN = new Map(); let secs = 0;
  for (const [, id, s] of log) {
    secs += s; songN.set(id, (songN.get(id) || 0) + 1);
    const t = L.tracks.get(id); if (!t) continue;
    for (const a of (t.artists && t.artists.length ? t.artists.slice(0, 1) : [t.artist || UNKNOWN_ARTIST])) artN.set(a, (artN.get(a) || 0) + 1);
    if (t.genre) genN.set(t.genre, (genN.get(t.genre) || 0) + 1);
  }
  if (!log.length) { $("#st-box").innerHTML = `<div class="empty">${ico("chart")}Nothing listened to in this period yet.<br>A song counts after 30 seconds.</div>`; return; }
  const hours = secs >= 3600 ? `${Math.floor(secs / 3600)} h ${Math.floor(secs / 60) % 60} min` : `${Math.round(secs / 60)} min`;
  // plays per day (7 or 30 days) or per month
  const days = span && span <= 30 ? span : 12, buckets = new Array(days).fill(0), labels = [];
  const now = new Date();
  if (span && span <= 30) {
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - days + 1).getTime() / 1000;
    for (const [at] of log) { const k = Math.floor((at - start) / DAY); if (k >= 0 && k < days) buckets[k]++; }
    labels.push(new Date(start * 1000).toLocaleDateString(undefined, {day: "numeric", month: "short"}), "Today");
  } else {
    for (const [at] of log) { const dt = new Date(at * 1000), k = days - 1 - ((now.getFullYear() - dt.getFullYear()) * 12 + now.getMonth() - dt.getMonth()); if (k >= 0 && k < days) buckets[k]++; }
    labels.push(new Date(now.getFullYear(), now.getMonth() - 11, 1).toLocaleDateString(undefined, {month: "short", year: "numeric"}), "This month");
  }
  const max = Math.max(1, ...buckets);
  const topSongs = [...songN].sort((a, b) => b[1] - a[1]).map(([id, n]) => [L.tracks.get(id), n]).filter(x => x[0]).slice(0, 10);
  const topArt = [...artN].sort((a, b) => b[1] - a[1]).slice(0, 10), topGen = [...genN].sort((a, b) => b[1] - a[1]).slice(0, 6);
  const recent = log.slice(-60).reverse().map(([at, id]) => [L.tracks.get(id), at]).filter(x => x[0]);
  const when = at => { const dt = new Date(at * 1000), today = new Date().toDateString(); return (dt.toDateString() === today ? "" : dt.toLocaleDateString(undefined, {day: "numeric", month: "short"}) + " ") + dt.toLocaleTimeString(undefined, {hour: "2-digit", minute: "2-digit"}); };
  $("#st-box").innerHTML = `<div class="statgrid"><div class="stat"><b>${hours}</b><span>listened</span></div><div class="stat"><b>${log.length}</b><span>plays</span></div>
      <div class="stat"><b>${songN.size}</b><span>different songs</span></div><div class="stat"><b>${artN.size}</b><span>artists</span></div></div>
    <div class="bars">${buckets.map(n => `<div style="height:${Math.round(n / max * 100)}%" title="${n}"></div>`).join("")}</div><div class="barlbl"><span>${esc(labels[0])}</span><span>${esc(labels[1])}</span></div>
    <h2 class="sec">Top songs</h2><div class="rows toplist">${topSongs.map(([t, n], k) => `<div class="row" data-id="${t.id}" data-st="${k}"><div class="no">${k + 1}</div><div class="art">${t.cover ? artHtml(t.id) : ico("note")}</div><div class="txt"><div class="t1">${esc(t.title)}</div><div class="t2">${esc(t.artist || UNKNOWN_ARTIST)}</div></div><span class="dur">${plural(n, "play")}</span></div>`).join("")}</div>
    <h2 class="sec">Top artists</h2><div class="rows">${topArt.map(([a, n], k) => `<div class="row" data-go="artist/${esc(encodeURIComponent(norm(a)))}"><div class="no">${k + 1}</div><div class="art" style="border-radius:50%">${(L.artists.get(norm(a)) || {}).cover ? artHtml(L.artists.get(norm(a)).cover) : ico("person")}</div><div class="txt"><div class="t1">${esc(a)}</div></div><span class="dur">${plural(n, "play")}</span></div>`).join("")}</div>
    ${topGen.length ? `<h2 class="sec">Top genres</h2><div class="chips">${topGen.map(([g, n]) => `<span class="chip">${esc(g)} · ${n}</span>`).join("")}</div>` : ""}
    <h2 class="sec">History</h2><div class="rows">${recent.map(([t, at], k) => `<div class="row" data-id="${t.id}" data-hist="${k}"><div class="art">${t.cover ? artHtml(t.id) : ico("note")}</div><div class="txt"><div class="t1">${esc(t.title)}</div><div class="t2">${esc(t.artist || UNKNOWN_ARTIST)}</div></div><span class="dur">${esc(when(at))}</span></div>`).join("")}</div>`;
  const top = topSongs.map(([t]) => t.id), hist = recent.map(([t]) => t.id);
  $("#st-box").onclick = e => { const r = e.target.closest("[data-st],[data-hist]"); if (!r) return; if (r.dataset.st) Player.playList(top, +r.dataset.st, false); else Player.playList(hist, +r.dataset.hist, false); };
}

// What's new: after an update, the changes since the version used before -----------------------------------------
function mdLite(t) {
  const inline = x => esc(x).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, "<code>$1</code>");
  const out = []; let li = null;
  for (const line of String(t).split("\n")) {
    if (/^\s*- /.test(line)) { if (li !== null) out.push(`<li>${inline(li)}</li>`); li = line.replace(/^\s*- /, ""); }
    else if (/^\s+\S/.test(line) && li !== null) li += " " + line.trim();
    else { if (li !== null) { out.push(`<li>${inline(li)}</li>`); li = null; } if (line.trim()) out.push(`<p style="margin:6px 0">${inline(line.trim())}</p>`); }
  }
  if (li !== null) out.push(`<li>${inline(li)}</li>`);
  return out.join("").replace(/(<li>.*?<\/li>)+/gs, m => `<ul style="margin:6px 0;padding-left:20px">${m}</ul>`);
}
async function whatsNew(since, auto) {
  let d; try { d = await api("changelog" + (since ? "?since=" + encodeURIComponent(since) : "")); } catch { return; }
  const vs = (d.versions || []).slice(0, auto ? 4 : 6);
  if (!vs.length) { if (!auto) toast("No notes for this version"); return; }
  dialog(auto ? "What's new" : "Latest changes", `<div style="max-height:60vh;overflow:auto">${vs.map(v => `<h4 style="margin:12px 0 4px">${esc(v.v)}</h4>${mdLite(v.body)}`).join("")}</div>`, "OK", () => {});
  const x = $("#dialog [data-x]"); if (x) x.remove();
}
function checkWhatsNew(version) {
  const seen = store.get("seenVersion", "");
  store.set("seenVersion", version);
  if (seen && seen !== version && !window.__testMode) setTimeout(() => whatsNew(seen, true), 1500);
}

// Autoplay: when the queue ends, similar songs from your music (same artists, genre, years; ones you like first)
function similarSongs(seedIds, avoidIds, n) {
  const seeds = seedIds.map(id => L.tracks.get(id)).filter(Boolean); if (!seeds.length) return [];
  const avoid = new Set(avoidIds), arts = new Map(), gens = new Map(), years = [];
  for (const t of seeds) { for (const a of t.artists || []) arts.set(norm(a), (arts.get(norm(a)) || 0) + 1); if (t.genre) gens.set(norm(t.genre), (gens.get(norm(t.genre)) || 0) + 1); if (t.year) years.push(+t.year); }
  const y = years.length ? years.reduce((a, b) => a + b, 0) / years.length : 0;
  const recent = nowS() - 2 * 3600;
  const scored = [];
  for (const t of L.list) {
    if (avoid.has(t.id) || lastPlayed(t.id) > recent) continue;
    let sc = 0;
    for (const a of t.artists || []) sc += 3 * (arts.get(norm(a)) || 0);
    if (t.genre) sc += 2 * (gens.get(norm(t.genre)) || 0);
    if (y && t.year && Math.abs(+t.year - y) <= 4) sc += 1;
    if (!sc) continue;
    sc += Math.min(2, plays(t.id) / 5) + stars(t.id) / 2 + (isFav(t.id) ? 1 : 0) + Math.random() * 2.5;
    scored.push([sc, t]);
  }
  scored.sort((a, b) => b[0] - a[0]);
  // not more than 3 songs in a row from the same artist
  const out = [], per = new Map();
  for (const [, t] of scored) { const a = norm((t.artists || [])[0] || t.artist); if ((per.get(a) || 0) >= 4) continue; per.set(a, (per.get(a) || 0) + 1); out.push(t.id); if (out.length >= n) break; }
  if (out.length < 5) for (const t of shuffled(L.list)) { if (out.length >= n) break; if (!avoid.has(t.id) && !out.includes(t.id)) out.push(t.id); }
  return out;
}

// Discover: songs you don't have, close to what you listen to; new releases of the artists you follow
function topArtists(k) {
  const n = new Map();
  for (const t of L.list) { const p = plays(t.id) * 3 + (isFav(t.id) ? 2 : 0) + 0.2; for (const a of (t.artists || []).slice(0, 1)) if (a && a !== UNKNOWN_ARTIST) n.set(a, (n.get(a) || 0) + p); }
  return [...n].sort((a, b) => b[1] - a[1]).slice(0, k).map(x => x[0]);
}

function mountRows(container, tracks, opt = {}) {

  container.innerHTML = `<div class="rows"></div><div class="more"></div>`;

  moreObserver = new IntersectionObserver(es => { if (es.some(x => x.isIntersecting) && shown < tracks.length) more(); }, {root: $("#main"), rootMargin: "600px"});
  if (shown < tracks.length) moreObserver.observe(sentinel);

}

const SORTS = {title: "Title", artist: "Artist", album: "Album", recent: "Recently added", year: "Year", genre: "Genre", length: "Length",
  plays: "Most played", played: "Recently played", rating: "Rating"};
const plays = id => (L.plays[id] || [0, 0, 0])[0], lastPlayed = id => (L.plays[id] || [0, 0, 0])[1], stars = id => L.ratings[id] || 0;
function sortedSongs(list = L.list, by = store.get("sort", "title")) {
  const a = list.slice(), cmp = (x, y) => x.localeCompare(y, undefined, {sensitivity: "base", numeric: true});
  if (by === "artist") a.sort((x, y) => cmp(x.artist || "\uffff", y.artist || "\uffff") || cmp(x.album, y.album) || (x.track_no - y.track_no) || cmp(x.title, y.title));
  else if (by === "album") a.sort((x, y) => cmp(x.album || "\uffff", y.album || "\uffff") || (x.track_no - y.track_no) || cmp(x.title, y.title));
  else if (by === "recent") a.sort((x, y) => y.mtime - x.mtime);
  else if (by === "year") a.sort((x, y) => (y.year || 0) - (x.year || 0) || cmp(x.album, y.album) || (x.track_no - y.track_no));
  else if (by === "genre") a.sort((x, y) => cmp(x.genre || "\uffff", y.genre || "\uffff") || cmp(x.artist, y.artist) || cmp(x.title, y.title));
  else if (by === "length") a.sort((x, y) => (y.length_s || 0) - (x.length_s || 0));
  else if (by === "plays") a.sort((x, y) => plays(y.id) - plays(x.id) || lastPlayed(y.id) - lastPlayed(x.id) || cmp(x.title, y.title));
  else if (by === "played") a.sort((x, y) => lastPlayed(y.id) - lastPlayed(x.id) || cmp(x.title, y.title));
  else if (by === "rating") a.sort((x, y) => stars(y.id) - stars(x.id) || plays(y.id) - plays(x.id) || cmp(x.title, y.title));
  else a.sort((x, y) => cmp(x.title, y.title));
  return a;
}

  IMP.src = "radio"; store.set("impsrc", "radio"); IMP.wantRadio = {q, kind};
  if (route().name === "download" && $("#src-box")) IMP.drawSource(); else closeNowAndGo("download");
}
function rescanSoon(delay) { clearTimeout(mfRescan); mfRescan = setTimeout(() => window.MFP_rescan(), delay); }
function openUrl(url) { if (NATIVE && NATIVE.openUrl) native("openUrl", url); else window.open(url, "_blank", "noopener"); }

// The download queue runs in the server (it goes on with the page hidden or the app closed); the page only shows it.
const DL = {
  snap: {items: [], counts: {}, settings: {}}, timer: 0, done: -1, libTimer: 0, busy: false,
  async add(songs, folder) { const r = await api("dl/add", {songs, folder: folder || ""}); this.poll(); return r; },
  active() { const c = this.snap.counts || {}; return (c.queued || 0) + (c.working || 0); },
  async poll() {
    clearTimeout(this.timer);
    if (this.busy) return; this.busy = true;
    try { this.snap = await api("dl"); } catch { this.busy = false; this.timer = setTimeout(() => this.poll(), 5000); return; }
    this.busy = false;
    const n = this.active(), c = this.snap.counts || {}, fin = (c.done || 0);
    for (const b of $$('[data-r="download"]')) b.dataset.badge = n || "";
    // New songs on the device: the library is read again (at most every 6 s), without leaving the current view.
    if (this.done >= 0 && fin !== this.done) { clearTimeout(this.libTimer); this.libTimer = setTimeout(() => this.refreshLib(), n ? 6000 : 500); }
    this.done = fin;
    if (route().name === "download") IMP.drawQueue();
    if (n) native("backgroundWork");  // Android: a notification keeps the downloads going with the app closed
    if (n || route().name === "download") this.timer = setTimeout(() => this.poll(), document.hidden ? 15000 : n ? 1500 : 4000);
  },
  async refreshLib() {
    try {
      const [d, c] = await Promise.all([api("tracks"), api("collections")]);
      L.tracks = new Map([...d.tracks.map(t => [t.id, t]), ...[...L.tracks.values()].filter(t => t.online).map(t => [t.id, t])]); L.favorites = c.favorites || []; L.playlists = c.playlists || [];
      buildIndexes();
      if (route().name !== "download" && !$("#q").value.trim() && !document.hidden) render();
    } catch {}
  },
  async control(action, id) { try { this.snap = await api("dl/control", {action, id: id || ""}); IMP.drawQueue(); this.poll(); } catch (e) { toast(e.message); } },
  async set(conf) { try { this.snap = await api("dl/settings", conf); IMP.drawRoot(); } catch (e) { toast(e.message); } },
};

const SOURCES = [["link", "Link"], ["spotify", "Spotify"], ["radio", "Radio"], ["youtube", "YouTube"], ["server", "Computer (local server)"], ["file", "File or list"]];
const FORMATS = [["mp3-320", "MP3 320 kbps"], ["mp3-192", "MP3 192 kbps"], ["mp3-128", "MP3 128 kbps"], ["flac", "FLAC (lossless)"], ["opus", "Opus"], ["aac", "AAC (m4a)"]];
const IMP = {
  src: store.get("impsrc", "link"), st: null, lists: {}, preview: null,
  stateLabel(i) {
    if (i.state === "working") return "";
    if (i.state === "queued") return `<span class="st muted">Waiting</span>`;
    if (i.state === "done") return `<span class="st ok">Downloaded</span>`;
    if (i.state === "have") return `<span class="st ok" title="${esc(i.path)}">On the device: linked</span>`;
    if (i.state === "stopped") return `<span class="st muted">Stopped</span>`;
    return `<span class="st err" title="${esc(i.msg)}">${esc((i.msg || "Failed").slice(0, 70))}</span>`;
  },
  drawQueue() {
    const box = $("#dl-box"); if (!box) return;
    const s = DL.snap, c = s.counts || {}, items = (s.items || []).slice().reverse();
    const working = items.filter(i => i.state === "working"), waiting = items.filter(i => i.state === "queued").reverse();
    const finished = items.filter(i => !["working", "queued"].includes(i.state)).slice(0, 40);
    const parts = [working.length ? `${working.length} downloading` : "", c.queued ? `${c.queued} waiting` : "", c.done ? `${c.done} downloaded` : "",
      c.have ? `${c.have} already on the device` : "", c.error ? `${c.error} failed` : "", s.paused ? "paused" : ""].filter(Boolean);
    const row = i => `<div class="row dl-row" style="cursor:default;min-height:52px"><div class="art">${i.cover ? `<img loading="lazy" src="${esc(i.cover)}" alt="" onerror="this.remove()">` : ico(i.state === "have" ? "folder" : "note")}</div>
      <div class="txt" style="min-width:0;flex:1"><div class="t1">${esc(i.title || "…")}</div><div class="t2">${esc(i.state === "working" ? [i.msg || "Downloading…", i.pct ? Math.round(i.pct) + " %" : ""].filter(Boolean).join(" · ") : i.artist)}</div>
      ${i.state === "working" ? `<div class="bar" style="width:${Math.max(3, Math.min(100, i.pct || 0))}%"></div>` : ""}</div>
      ${this.stateLabel(i)}${["working", "queued"].includes(i.state) ? `<button class="iconbtn" data-dlact="stop" data-dlid="${i.id}" title="Stop">${ico("close")}</button>`
        : ["error", "stopped"].includes(i.state) ? `<button class="iconbtn" data-dlact="retry" data-dlid="${i.id}" title="Try again">${ico("refresh")}</button>` : ""}</div>`;
    box.innerHTML = `<p style="margin:0 0 8px">${parts.join(" · ") || "Nothing to download. Search online, open an artist or import a playlist below."}</p>
      <div class="actions" style="margin:0 0 6px;flex-wrap:wrap">${s.paused ? `<button class="btn primary" data-dlact="resume">${ico("play")} Resume</button>` : working.length || waiting.length ? `<button class="btn" data-dlact="pause">${ico("pause")} Pause</button>` : ""}
        ${c.error || c.stopped ? `<button class="btn" data-dlact="retry">${ico("refresh")} Try the failed ones again</button>` : ""}
        ${waiting.length ? `<button class="btn" data-dlact="stop">Stop all</button>` : ""}${finished.length ? `<button class="btn" data-dlact="clear">Clear the list</button>` : ""}</div>
      <div class="rows">${working.map(row).join("")}${waiting.slice(0, 5).map(row).join("")}${waiting.length > 5 ? `<p class="muted" style="margin:6px 8px">… and ${waiting.length - 5} more waiting</p>` : ""}${finished.map(row).join("")}</div>`;
  },
  drawRoot() {
    const box = $("#root-box"); if (!box) return;
    const conf = DL.snap.settings || {}, def = (this.st || {}).default_root || "";
    const noAccess = NATIVE && NATIVE.hasAllFiles && !NATIVE.hasAllFiles();
    box.innerHTML = `<p>Each imported playlist goes into its own folder inside this one. Before downloading a song, the app looks for it in all your music:
        if it is already on the device, it is only linked in the playlist, never downloaded again.</p>
      <div class="folder">${ico("folder")}<span style="word-break:break-all">${esc(conf.root || (def ? def + " (default)" : "Not chosen yet"))}</span></div>
      <div class="actions" style="margin:10px 0 0;flex-wrap:wrap"><button class="btn primary" id="root-pick">${ico("folder")} Choose the root folder</button></div>
      ${noAccess ? `<div class="note" style="margin-top:12px">${ico("folder")}<span style="flex:1;min-width:200px">To save songs in a folder of your choice (e.g. Music/MusicFlow) and find the songs you already have, allow access to all files.</span><button class="btn" id="root-all">Allow</button></div>` : ""}
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px"><span>Format</span><select id="dl-fmt">${FORMATS.map(([v, n]) => `<option value="${v}"${(conf.format || "mp3-320") === v ? " selected" : ""}>${n}</option>`).join("")}</select>
        <span>At once</span><select id="dl-par">${[1, 2, 3].map(n => `<option${(conf.parallel || 2) === n ? " selected" : ""}>${n}</option>`).join("")}</select></div>
      <label class="chk"><input type="checkbox" id="dl-sub"${conf.subfolders !== false ? " checked" : ""}> One folder per playlist</label>
      <label class="chk"><input type="checkbox" id="dl-m3u"${conf.m3u !== false ? " checked" : ""}> Also write the playlist as a .m3u8 file (other players, like Samsung Music, see it)</label>
      <label class="chk"><input type="checkbox" id="dl-lyr"${conf.lyrics !== false ? " checked" : ""}> Lyrics in the files</label>`;
    $("#root-pick").onclick = () => chooseFolder(f => DL.set({root: f}).then(() => toast("Root folder saved")));
    if ($("#root-all")) $("#root-all").onclick = () => native("requestAllFiles");
    $("#dl-fmt").onchange = e => DL.set({format: e.target.value});
    $("#dl-par").onchange = e => DL.set({parallel: +e.target.value});
    $("#dl-sub").onchange = e => DL.set({subfolders: e.target.checked});
    $("#dl-m3u").onchange = e => DL.set({m3u: e.target.checked});
    $("#dl-lyr").onchange = e => DL.set({lyrics: e.target.checked});
  },
  async drawSource() {
    const box = $("#src-box"); if (!box) return;
    for (const b of $$("[data-src]")) b.classList.toggle("active", b.dataset.src === this.src);
    const k = this.src, st = this.st || {};
    if (!mfUrl && ["link", "spotify", "radio", "youtube", "file"].includes(k)) {
      box.innerHTML = `<div class="note">${ico("close")}<span>Search and download are not available here${st.musicflow && st.musicflow.error ? ": " + esc(st.musicflow.error) : ""}.</span></div>`; return;
    }
    if (k === "link") {
      box.innerHTML = `<p>A playlist or album link from Spotify, YouTube, YouTube Music, Deezer, Apple Music or SoundCloud. No account needed.</p>
        <div class="addrow"><input class="text" id="src-url" placeholder="https://open.spotify.com/playlist/…" inputmode="url"><button class="btn primary" id="src-go">Read</button></div><div id="pv"></div>`;
      $("#src-go").onclick = () => { const url = $("#src-url").value.trim(); if (url) this.showPreview({kind: "link", url}); };
      $("#src-url").onkeydown = e => { if (e.key === "Enter") $("#src-go").click(); };
    } else if (k === "spotify") {
      const a = st.spotify || {};
      if (!a.available) {
        box.innerHTML = `<p>Connecting your Spotify account is done in the phone app. On the computer, paste a Spotify playlist link in <b>Link</b>.</p>`;
      } else if (!a.connected) {
        box.innerHTML = `<p>Sign in with your usual Spotify account, on Spotify's own page. No key or developer account: the app then reads your playlists and your Liked Songs by itself.</p>
          <div class="actions" style="margin:0;flex-wrap:wrap"><button class="btn primary" id="sp-login">Connect Spotify</button></div>
          <p class="muted" style="font-size:13px;margin:10px 0 0">Sign in with your e-mail (password or code by e-mail). “Continue with Google” is refused by Google inside apps.</p>`;
        $("#sp-login").onclick = () => native("spotifyLogin");
      } else {
        box.innerHTML = `<div class="actions" style="margin:0 0 8px;flex-wrap:wrap"><span style="align-self:center">Spotify connected</span>
          <button class="btn" id="acc-out">Disconnect</button><button class="iconbtn" id="sp-refresh" title="Read again">${ico("refresh")}</button></div><div id="pl-list"></div><div id="pv"></div>`;
        $("#acc-out").onclick = async () => { native("spotifyLogout"); this.st = await api("import/state").catch(() => this.st); this.st.spotify = {available: true, connected: false}; this.drawSource(); };
        $("#sp-refresh").onclick = () => this.spLists("?refresh=1");
        this.spLists();
      }
    } else if (k === "radio") {
      box.innerHTML = `<p>Spotify radio: a mix of about 50 songs around a song or an artist (its name or its Spotify link). It shows up below like a playlist, to download.</p>
        <div class="addrow" style="flex-wrap:wrap"><input class="text" id="rd-q" placeholder="Blinding Lights The Weeknd · Stromae" style="flex:1 1 200px">
          <select id="rd-kind" style="flex:0 0 auto"><option value="track">Song radio</option><option value="artist">Artist radio</option></select>
          <button class="btn primary" id="rd-go">Find the radio</button></div><div id="pv"></div>`;
      $("#rd-q").oninput = e => { const m = e.target.value.match(/open\.spotify\.com\/(?:intl-[\w-]+\/)?(track|artist)\//); if (m) $("#rd-kind").value = m[1]; };
      $("#rd-go").onclick = () => { const q = $("#rd-q").value.trim(); if (q) this.radio(q, $("#rd-kind").value); else $("#rd-q").focus(); };
      $("#rd-q").onkeydown = e => { if (e.key === "Enter") $("#rd-go").click(); };
      const w = this.wantRadio; this.wantRadio = null;
      if (w) { $("#rd-q").value = w.q; $("#rd-kind").value = w.kind; this.radio(w.q, w.kind); }
    } else if (k === "youtube") {
      const ch = (st.youtube || {}).channel || "";
      box.innerHTML = `<p>Your YouTube channel link or @name: its public playlists appear (no sign-in, no key). For one playlist (or a private one shared by link), use <b>Link</b>.</p>
        <div class="addrow"><input class="text" id="yt-ch" placeholder="https://www.youtube.com/@yourname" inputmode="url" value="${esc(ch)}"><button class="btn primary" id="yt-go">Show</button></div>
        ${ch ? `<div class="actions" style="margin:8px 0 0"><button class="btn" id="yt-forget">Forget this channel</button></div>` : ""}<div id="pl-list"></div><div id="pv"></div>`;
      $("#yt-go").onclick = () => { const v = $("#yt-ch").value.trim(); if (v) this.drawLists("youtube", {kind: "youtube", address: v}); };
      $("#yt-ch").onkeydown = e => { if (e.key === "Enter") $("#yt-go").click(); };
      if ($("#yt-forget")) $("#yt-forget").onclick = async () => { await api("import/account", {provider: "youtube"}).catch(() => {}); this.st = await api("import/state").catch(() => this.st); this.drawSource(); };
      if (ch) this.drawLists("youtube", {kind: "youtube", address: ch});
    } else if (k === "server") {
      const servers = st.servers || [];
      box.innerHTML = `<p>Copy the playlists of Tunedrift on your computer to this device, over Wi-Fi: the files are copied as they are (nothing is searched or downloaded again).
          On the computer, start <code>run_lan.bat</code> (or <code>mfp_server.py --lan</code>) and paste the link it shows.</p>
        <div class="addrow"><input class="text" id="srv-addr" placeholder="http://192.168.1.20:5091/?t=…" inputmode="url"><button class="btn primary" id="srv-go">Connect</button></div>
        ${servers.filter(x => x.token).length ? `<div class="chips" style="margin:10px 0 0">${servers.filter(x => x.token).map(x => `<button class="chip" data-srv="${esc(x.base)}">${esc(x.base.replace(/^https?:\/\//, ""))}</button>`).join("")}</div>` : ""}
        <div id="pl-list"></div><div id="pv"></div>`;
      $("#srv-go").onclick = () => { const v = $("#srv-addr").value.trim(); if (v) this.drawLists("server", {kind: "server", address: v}); };
      for (const b of $$("[data-srv]", box)) b.onclick = () => this.drawLists("server", {kind: "server", base: b.dataset.srv});
    } else {
      box.innerHTML = `<p>A playlist file (<code>.m3u</code>, <code>.m3u8</code>, <code>.csv</code> exported from Spotify with Exportify, <code>.txt</code>), or a list of titles: one “Artist - Title” per line.</p>
        <input type="file" id="src-file" accept=".m3u,.m3u8,.csv,.txt,text/plain,text/csv,audio/x-mpegurl" style="margin-bottom:10px">
        <textarea class="text" id="src-text" placeholder="Daft Punk - One More Time&#10;Stromae - Papaoutai"></textarea>
        <div class="addrow" style="margin-top:8px"><input class="text" id="src-name" placeholder="Playlist name"><button class="btn primary" id="src-go">Read</button></div><div id="pv"></div>`;
      let fname = "";
      $("#src-file").onchange = async e => { const f = e.target.files[0]; if (!f) return; fname = f.name; $("#src-text").value = await f.text(); if (!$("#src-name").value) $("#src-name").value = f.name.replace(/\.[^.]+$/, ""); };
      $("#src-go").onclick = () => { const text = $("#src-text").value; if (text.trim()) this.showPreview({kind: "text", text, filename: fname || ($("#src-name").value.trim() || "List") + ".txt"}, $("#src-name").value.trim()); };
    }
  },
  async drawLists(k, req) {
    const box = $("#pl-list"); if (!box) return;
    box.innerHTML = `<div class="progress-line"><div></div></div>`;
    let d;
    try { d = await api("import/playlists", req); } catch (e) { box.innerHTML = `<div class="note">${ico("close")}<span>${esc(e.message)}</span></div>`; return; }
    const base = d.base || "";
    if (k === "server" && base) { this.st = await api("import/state").catch(() => this.st); }
    box.innerHTML = this.listRows(d.playlists || []) || `<p class="muted">No playlist.</p>`;
    this.bindLists(box, id => k === "server" ? {kind: "server", base, id} : {kind: k, id});
  },
  listRows(lists) {
    if (!lists.length) return "";
    return `<div style="margin-top:8px">${lists.map(p => `<div class="imp-pl" data-plview="${esc(p.id)}" style="cursor:pointer" title="See the songs"><div class="art" style="width:44px;height:44px;border-radius:10px;overflow:hidden;flex:none;display:grid;place-items:center;background:var(--option-bg)">${p.image ? `<img loading="lazy" src="${esc(p.image)}" alt="" style="width:100%;height:100%;object-fit:cover">` : ico("list")}</div>
      <div class="grow"><div class="t1">${esc(p.name)}</div><div class="t2 muted" style="font-size:13px">${p.count == null ? "" : plural(p.count, "song")}</div></div>
      <button class="btn" data-pl="${esc(p.id)}">${ico("download")} Import</button></div>`).join("")}</div>`;
  },
  bindLists(box, src) {
    for (const b of $$("[data-pl]", box)) b.onclick = e => { e.stopPropagation(); this.showPreview(src(b.dataset.pl)); };
    // Tapping a playlist shows its songs (with their covers) before importing it.
    for (const r of $$("[data-plview]", box)) r.onclick = () => this.showPreview(src(r.dataset.plview));
  },
  // Spotify: the playlists kept on the device show at once; while the app reads them again, each one found
  // appears as it comes.
  async spLists(q = "") {
    const box = $("#pl-list"); if (!box) return;
    clearTimeout(this.spT);
    let d;
    try { d = await api("import/spotify" + q); } catch (e) { box.innerHTML = `<div class="note">${ico("close")}<span>${esc(e.message)}</span></div>`; return; }
    if ($("#pl-list") !== box || this.src !== "spotify") return;
    const lists = d.playlists || [], sig = JSON.stringify([lists, d.running, d.error]);
    if (sig !== this.spSig || !box.innerHTML) {
      this.spSig = sig;
      box.innerHTML = (d.running ? `<div class="progress-line slim"><div></div></div>` : "") + (this.listRows(lists)
        || (d.running ? `<p class="muted" style="margin:8px 0 0">Reading your library…</p>` : d.error ? `<div class="note">${ico("close")}<span>${esc(d.error)}</span></div>` : `<p class="muted">No playlist.</p>`));
      this.bindLists(box, id => ({kind: "spotify", id}));
    }
    if (d.running) this.spT = setTimeout(() => this.spLists(), 1500);
  },
  // A Spotify playlist: its kept songs at once, or the songs found so far while it is read.
  async spPreview(id, first) {
    const box = $("#pv"); if (!box) return;
    clearTimeout(this.pvT);
    if (first) {
      this.pvId = id; this.pvSig = "";
      box.innerHTML = `<div class="muted" style="margin-top:12px">Reading the playlist…</div><div class="progress-line"><div></div></div>`;
      box.scrollIntoView({block: "nearest", behavior: "smooth"});
    }
    let d;
    try { d = await api("import/spotify?pid=" + encodeURIComponent(id)); } catch (e) { box.innerHTML = `<div class="note" style="margin-top:12px">${ico("close")}<span>${esc(e.message)}</span></div>`; return; }
    if (this.pvId !== id || $("#pv") !== box) return;
    const tracks = d.tracks || [];
    if (!tracks.length && !d.tracks_running) {
      box.innerHTML = `<div class="note" style="margin-top:12px">${ico("close")}<span>${esc(d.tracks_error || "Spotify showed no songs for this playlist.")}</span></div>`; return;
    }
    const sig = [tracks.length, d.have, d.complete, d.tracks_running].join("|");
    if (tracks.length && sig !== this.pvSig) { this.pvSig = sig; this.renderPreview({kind: "spotify", id}, "", d, !d.complete); }
    if (d.tracks_running) this.pvT = setTimeout(() => this.spPreview(id), 1500);
  },
  async radio(q, kind) {
    const box = $("#pv"); if (!box) return;
    const btn = $("#rd-go"); if (btn) btn.disabled = true;
    box.innerHTML = `<div class="muted" style="margin-top:12px">Looking for the radio on Spotify (10 to 25 seconds)…</div><div class="progress-line"><div></div></div>`;
    try {
      const d = await api("mf/spotify-radio", {query: q, kind});
      if (!d.url) throw new Error(d.error || "No radio found.");
      await this.showPreview({kind: "link", url: d.url}, (kind === "artist" ? "Artist radio · " : "Radio · ") + q.replace(/^https?:\/\/\S+$/, "Spotify"));
    } catch (e) { if ($("#pv") === box) box.innerHTML = `<div class="note" style="margin-top:12px">${ico("close")}<span>${esc(e.message || "No radio found.")}</span></div>`; }

  async showPreview(source, name) {
    const box = $("#pv"); if (!box) return;
    clearTimeout(this.pvT); this.pvId = "";
    if (source.kind === "spotify") return this.spPreview(source.id, true);

    this.renderPreview(source, name, d, false);

  renderPreview(source, name, d, partial) {
    const box = $("#pv"); if (!box) return;
    const typed = $("#pv-name") && $("#pv-name").dataset.edited ? $("#pv-name").value : "";
    const list = $(".rows", box), top = list ? list.scrollTop : 0;
    const tracks = d.tracks || [], miss = tracks.length - d.have;
    const conf = DL.snap.settings || {}, root = conf.root || (this.st || {}).default_root || "";
    box.innerHTML = `<div class="set" style="margin:14px 0 0;background:var(--option-bg)"><div class="addrow" style="margin:0 0 8px"><input class="text" id="pv-name" value="${esc(name || d.name)}"></div>
      <p style="margin:0 0 10px">${plural(tracks.length, "song")} · <b>${d.have}</b> already on this device (linked, not downloaded) · <b>${miss}</b> to ${source.kind === "server" ? "copy" : "download"}
        <br><span class="muted">Into: ${esc(root ? root + (conf.subfolders !== false ? "/" + (name || d.name) : "") : "choose the root folder above")}</span></p>
